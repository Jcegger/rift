# Refreshes the committed data files from their upstream sources, daily.
#
# GitHub Pages serves this repo directly, so a commit here IS a deploy — there is no
# build step and no other infrastructure involved. That is the whole reason this works
# as a cron: regenerate, verify, commit, done.
#
# Failures are graded, because they are not all the same failure. Each source builds
# independently and a broken one keeps its last-good file while the others still ship:
# every builder writes its output in a single writeFile at the end of main(), so a
# failure anywhere before that leaves the previous file byte-identical. That matters
# because the most brittle input here is a scrape of a WordPress page, and a redesign
# there used to abort the job and freeze the deck snapshot along with it.
#
#   one source fails          -> commit the rest, job green, logged in the summary.
#                                The app's own age dot goes amber at ten days and red
#                                at twenty-one, which is ten days of runway; going red
#                                on every transient 5xx would only teach us to ignore it.
#   a source is past its
#   shelf life                -> commit, then FAIL. `check.mjs --max-age` measures the
#                                committed generatedAt against the app's FRESH_LIMITS.
#                                Past 'bad', "transient" has stopped being credible.
#   check.mjs fails           -> commit NOTHING and fail. Every source is a public
#                                endpoint that can change shape without warning, and
#                                stale data that works beats fresh data that lies.
#   every source fails        -> fail. Nothing changed, so nothing would have committed
#                                anyway; the point is to not report that as a success.
#
# Any failure opens (or updates) a tracking issue, and the next clean run closes it.
#
# If a run succeeds but the site does not update, the Pages build is the usual suspect:
# builds here fail intermittently with an empty error message, and re-requesting one has
# always cleared it:
#   gh api repos/Jcegger/rift/pages/builds -X POST

name: refresh data

on:
  schedule:
    # Twice, because one daily slot is not a schedule you can rely on. GitHub's cron is
    # best-effort: it delays runs under load and drops them silently, and the first
    # slot this workflow ever had came and went without firing at all. Two attempts
    # eight hours apart turn a missed run into a late one.
    #
    # The odd minutes are deliberate too — GitHub queues every top-of-the-hour cron on
    # the platform at once and sheds the overflow, so :00 is the least reliable minute
    # in the hour to ask for.
    #
    # The second run is close to free and cannot double-post: the commit step only
    # commits when a file actually changed, and generatedAt is date-only, so a same-day
    # rerun either finds decks posted since the morning or says nothing to commit.
    - cron: '17 11 * * *'
    - cron: '47 19 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Deck window in days'
        required: false
        default: '60'
      simulate_failure:
        description: 'Comma-separated sources to force-fail (catalog,banned,events,decks,news,tiers)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  # Interpolated into shell below, so they go through the environment rather than
  # through ${{ }} splicing.
  DAYS: ${{ github.event.inputs.days || '60' }}
  SIMULATE: ${{ github.event.inputs.simulate_failure || '' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # GitHub disables a scheduled workflow after 60 days of repository inactivity,
          # and pushes made with GITHUB_TOKEN do not count as activity — so this cron
          # cannot keep itself alive. Set REFRESH_PAT to a fine-grained token with
          # contents:write and the daily push is attributed to a user, which does. Unset,
          # this behaves exactly as before and the 60-day clock is real but slow, and
          # GitHub emails before it fires.
          token: ${{ secrets.REFRESH_PAT || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Order matters. The catalog is what every other script resolves card codes
      # against, events supply the sizes that build-decks attaches to tournament decks,
      # and the ban list and the deck snapshot both read the catalog. A source that
      # failed leaves its previous file in place, so the ones downstream of it build
      # against yesterday's copy rather than against nothing — which is the intent.
      - name: Rebuild the card catalog
        id: catalog
        continue-on-error: true
        run: |
          case ",$SIMULATE," in *,catalog,*) echo "simulated failure"; exit 1;; esac
          node scripts/build-catalog.mjs

      - name: Rebuild the ban list
        id: banned
        continue-on-error: true
        run: |
          case ",$SIMULATE," in *,banned,*) echo "simulated failure"; exit 1;; esac
          node scripts/build-banned.mjs

      - name: Rebuild the event archive
        id: events
        continue-on-error: true
        run: |
          case ",$SIMULATE," in *,events,*) echo "simulated failure"; exit 1;; esac
          node scripts/build-events.mjs

      - name: Rebuild the deck snapshot
        id: decks
        continue-on-error: true
        run: |
          case ",$SIMULATE," in *,decks,*) echo "simulated failure"; exit 1;; esac
          node scripts/build-decks.mjs --days "$DAYS"

      - name: Rebuild the news feed
        id: news
        continue-on-error: true
        run: |
          case ",$SIMULATE," in *,news,*) echo "simulated failure"; exit 1;; esac
          node scripts/build-news.mjs

      # A scrape of riftbound.gg's tier-list page, so more brittle than the others.
      # build-tiers.mjs exits non-zero and writes nothing if the parse comes up short,
      # which now costs the tier list alone rather than the whole day's data.
      - name: Rebuild the tier list
        id: tiers
        continue-on-error: true
        run: |
          case ",$SIMULATE," in *,tiers,*) echo "simulated failure"; exit 1;; esac
          node scripts/build-tiers.mjs

      # Events again: build-decks changes which events have lists, and the coverage
      # figures the Meta tab quotes are computed here. Cheap, one request. This pass
      # rewrites events.json wholesale, so its outcome is the one that counts.
      - name: Recompute event coverage
        id: events2
        continue-on-error: true
        run: |
          case ",$SIMULATE," in *,events,*) echo "simulated failure"; exit 1;; esac
          node scripts/build-events.mjs

      # The recorder, not a builder: it fetches nothing and derives today's row from the
      # two files above. It runs after them and outside the fail-soft set on purpose — a
      # row is only worth writing once the snapshot it describes is the real one, and if
      # it cannot be written the job should say so rather than leave a hole in the
      # archive that no later run will ever fill.
      - name: Record today in the archive
        run: node scripts/build-history.mjs

      - name: Source report
        id: sources
        run: |
          set -euo pipefail
          declare -A outcome=(
            [catalog]='${{ steps.catalog.outcome }}'
            [banned]='${{ steps.banned.outcome }}'
            [events]='${{ steps.events2.outcome }}'
            [decks]='${{ steps.decks.outcome }}'
            [news]='${{ steps.news.outcome }}'
            [tiers]='${{ steps.tiers.outcome }}'
          )
          failed=""; ok_count=0
          {
            echo "| source | result | file |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for s in catalog banned events decks news tiers; do
            case "$s" in
              catalog) f=data/cards.json;; banned) f=data/banned.json;;
              events)  f=data/events.json;; decks) f=data/decks.json;;
              news)    f=data/news.json;;  tiers) f=data/tiers.json;;
            esac
            at=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).generatedAt||"?"))' "$f" 2>/dev/null || echo '?')
            if [ "${outcome[$s]}" = "success" ]; then
              ok_count=$((ok_count + 1))
              echo "| $s | ok | rebuilt, $at |" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="${failed:+$failed,}$s"
              echo "| $s | **FAILED** | kept $at |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=$s did not rebuild::Keeping the last-good $f from $at. The other sources still ship."
            fi
          done
          echo "failed=$failed"     >> "$GITHUB_OUTPUT"
          echo "ok_count=$ok_count" >> "$GITHUB_OUTPUT"
          echo "Sources rebuilt: $ok_count of 6${failed:+ (failed: $failed)}"

      # Nothing changed and nothing can be salvaged. Reporting that as a green run is
      # the exact failure mode this whole file is trying to close.
      - name: Fail if every source broke
        if: steps.sources.outputs.ok_count == '0'
        run: |
          echo "::error title=No source rebuilt::All six builders failed — the data is entirely unchanged."
          exit 1

      - name: Verify
        run: node scripts/check.mjs

      - name: Commit if anything changed
        env:
          FAILED_SOURCES: ${{ steps.sources.outputs.failed }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then ask the index what moved. `git diff` alone ignores
          # untracked files, so a data file appearing for the first time would look
          # like "no changes" and never get committed.
          git add -A data/
          if git diff --cached --quiet -- data/; then
            echo "No upstream changes today; nothing to commit."
            exit 0
          fi
          # A one-line summary of what actually moved, so the history is readable
          # rather than 365 identical "refresh data" commits.
          summary=$(node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const changed = execSync("git diff --cached --name-only -- data/", { encoding: "utf8" })
              .split("\n").filter(Boolean);
            const bits = [];
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            // Throws for a file that is new in this commit, which the caller catches.
            // stderr is muted so a first-time file does not litter the log with fatal:.
            const was = (f) => JSON.parse(execSync(`git show HEAD:${f}`,
              { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }));
            for (const f of changed) {
              try {
                if (f.endsWith("decks.json")) {
                  const d = read(f).decks.length, o = was(f).decks.length;
                  bits.push(`${d} decks${d === o ? "" : ` (${d > o ? "+" : ""}${d - o})`}`);
                } else if (f.endsWith("cards.json")) {
                  const d = read(f).cards.length, o = was(f).cards.length;
                  if (d !== o) bits.push(`${d - o > 0 ? "+" : ""}${d - o} printings`);
                } else if (f.endsWith("news.json")) {
                  const d = read(f).posts.length, o = was(f).posts.length;
                  if (d !== o) bits.push(`${d - o > 0 ? "+" : ""}${d - o} posts`);
                } else if (f.endsWith("banned.json")) {
                  const d = read(f).constructed.length, o = was(f).constructed.length;
                  if (d !== o) bits.push(`ban list ${o} -> ${d}`);
                } else if (f.endsWith("events.json")) {
                  const d = read(f).events.length, o = was(f).events.length;
                  if (d !== o) bits.push(`${d - o > 0 ? "+" : ""}${d - o} events`);
                } else if (f.endsWith("tiers.json")) {
                  const d = read(f), o = was(f);
                  if (d.week !== o.week) bits.push(`tier list wk ${o.week} -> ${d.week}`);
                  else if (JSON.stringify(d.tiers) !== JSON.stringify(o.tiers)) bits.push("tier list moved");
                }
              } catch { /* first run, or a shape change; the file list still tells the story */ }
            }
            process.stdout.write(bits.join(", ") || changed.map((f) => f.replace("data/", "")).join(", "));
          ')
          # Name the sources that did not rebuild, so a run that half-worked says so in
          # the history rather than only in a log that expires.
          if [ -n "$FAILED_SOURCES" ]; then
            summary="${summary} · kept ${FAILED_SOURCES//,/, }"
          fi
          git commit -m "chore(data): ${summary}"
          git push
          echo "Committed: ${summary}"

      # After the commit, deliberately: whatever did refresh should reach the site even
      # on the day we notice that something else has been rotting for three weeks.
      - name: Fail if any source is past its shelf life
        run: node scripts/check.mjs --max-age

      - name: Open or update the tracking issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Data refresh is failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = '${{ steps.sources.outputs.failed }}' || 'none — the failure was downstream of the builders';
            const body = [
              `The daily data refresh failed.`,
              ``,
              `- **Sources that did not rebuild:** ${failed}`,
              `- **Sources rebuilt:** ${{ steps.sources.outputs.ok_count || 0 }} of 6`,
              `- **Run:** ${run}`,
              ``,
              `A single failing source does not reach here — it keeps its last-good file and the`,
              `run stays green. This means either \`check.mjs\` failed, every source failed, or a`,
              `file is past the shelf life in \`FRESH_LIMITS\`.`,
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.notice(`Updated issue #${existing.number}`);
            } else {
              const { data: made } = await github.rest.issues.create({ ...context.repo, title, body });
              core.notice(`Opened issue #${made.number}`);
            }

      # The recovery signal matters as much as the alarm; an issue left open after the
      # thing fixed itself only teaches us to stop reading them.
      - name: Close the tracking issue on recovery
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Data refresh is failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (!existing) return;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: existing.number,
              body: `Recovered — a clean refresh completed. ${run}`,
            });
            await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
            core.notice(`Closed issue #${existing.number}`);
