# Builds the Kobo sheets (guides/kobo.txt, scripts/build-kobo) and publishes them on the
# `kobo-sheets` branch: the PDFs, the Kobo books KCC makes from them, and manifest.json.
# The Plex server polls that branch, downloads what changed and syncs it to the Kobo
# Libra Colour over Wi-Fi, so editing a guide here is all it takes
# (egger-theater: plans/kobo-komga.md, "Docs").
#
# The branch holds one commit, replaced on each run: it's a drop box, not history.
name: kobo sheets

on:
  push:
    branches: [master]
    paths:
      - guides/kobo.txt
      - guides/*.md
      - guides/*.css
      - scripts/build-kobo
      - scripts/build-journal
      - .github/workflows/kobo-sheets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kobo-sheets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # KCC from its git tag: the published Docker images fail at startup (no PySide6).
      - name: Tools (pandoc, weasyprint, matplotlib, KCC)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc weasyprint fonts-dejavu p7zip-full libegl1 libxkbcommon0
          pip install --quiet matplotlib "kindlecomicconverter @ git+https://github.com/ciromattia/kcc@v13.0.1"

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/build-kobo
          # every reference sheet got its Kobo book (write-on sheets stay PDF only)
          python3 -c "import json,sys; m=json.load(open('guides/out/kobo/manifest.json'))['items']; bad=[i['title'] for i in m if not i.get('write') and not i.get('kepub')]; sys.exit('no kepub: '+', '.join(bad) if bad else 0)"

      # Google Drive → the Kobo's own Drive link (folder "Rakuten Kobo"), which it downloads on
      # Sync from anywhere. Needs the RCLONE_CONF secret (an rclone config with a [gdrive] remote).
      # Reference sheets go up only when their version changed since the last publish; write-on
      # sheets only when missing, so a copy with ink on it is never replaced.
      - name: Upload to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "no RCLONE_CONF secret: skipping Drive"; exit 0; fi
          curl -fsSLO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip && sudo install -m 755 rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          cd guides/out/kobo
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/kobo-sheets/manifest.json -o previous.json || echo '{"items":[]}' > previous.json
          python3 - <<'EOF' > changed.txt
          import json
          old = {i.get("drive") or i["file"]: i["version"] for i in json.load(open("previous.json"))["items"]}
          for i in json.load(open("manifest.json"))["items"]:
              if not i.get("write") and old.get(i["drive"]) != i["version"]:
                  print(i["drive"])
          EOF
          echo "reference sheets that changed:"; cat changed.txt
          if [ -s changed.txt ]; then rclone copy drive "gdrive:Rakuten Kobo" --files-from changed.txt -v; fi
          rclone copy drive "gdrive:Rakuten Kobo" --files-from drive-write.txt --ignore-existing -v
          rm -f previous.json changed.txt

      # Cloudflare R2 → the Kobo's own sync (kobo repo: device/kit/usr/local/jay/sync.sh), which on
      # every Wi-Fi connect copies new PDFs from kobo-inbox into /mnt/onboard/Sheets and never replaces
      # a file it already has (so ink is safe). Needs the R2_RCLONE_CONF secret: an rclone config with
      # an [r2] remote whose token can read and write kobo-inbox (kobo repo .secrets/, set by Jay).
      # Write-on sheets go up once under their plain name. Reference sheets go up under a dated name
      # each time their version changes ("Nexus Night - Table sheet (Sivir) 2026-11-17.pdf"), with
      # the older dated copy removed from the inbox; versions.json in the bucket remembers what's there.
      - name: Upload to R2 (kobo-inbox)
        env:
          R2_RCLONE_CONF: ${{ secrets.R2_RCLONE_CONF }}
        run: |
          if [ -z "$R2_RCLONE_CONF" ]; then echo "no R2_RCLONE_CONF secret: skipping R2"; exit 0; fi
          command -v rclone >/dev/null || {
            curl -fsSLO https://downloads.rclone.org/rclone-current-linux-amd64.zip
            unzip -q rclone-current-linux-amd64.zip && sudo install -m 755 rclone-*-linux-amd64/rclone /usr/local/bin/rclone; }
          export RCLONE_CONFIG=$RUNNER_TEMP/r2.conf
          printf '%s\n' "$R2_RCLONE_CONF" > "$RCLONE_CONFIG"
          cd guides/out/kobo
          python3 - <<'EOF'
          import datetime, json, os, subprocess
          B = "r2:kobo-inbox"
          def rc(*a, **k):
              return subprocess.run(["rclone", *a], check=True, text=True, **k)
          names = set(rc("lsf", B, "--files-only", capture_output=True).stdout.split("\n")) - {""}
          seen = json.loads(rc("cat", f"{B}/versions.json", capture_output=True).stdout) if "versions.json" in names else {}
          today = datetime.date.today().isoformat()
          for i in json.load(open("manifest.json"))["items"]:
              src = os.path.join("drive", i["drive"])
              if i.get("write"):
                  if i["drive"] not in names:
                      rc("copyto", src, f"{B}/{i['drive']}", "-v"); print("up (write-on):", i["drive"])
                  continue
              old = seen.get(i["drive"], {})
              if old.get("version") == i["version"] and old.get("name") in names:
                  continue
              name = i["drive"][:-4] + f" {today}.pdf"
              if old.get("name") in names and old["name"] != name:
                  rc("deletefile", f"{B}/{old['name']}"); print("removed old:", old["name"])
              rc("copyto", src, f"{B}/{name}", "-v"); print("up (reference):", name)
              seen[i["drive"]] = {"version": i["version"], "name": name}
          with open("versions.json", "w") as f:
              json.dump(seen, f, indent=1)
          rc("copyto", "versions.json", f"{B}/versions.json")
          os.remove("versions.json")
          EOF
          rm -f "$RCLONE_CONFIG"

      - name: Publish to kobo-sheets
        run: |
          cd guides/out/kobo
          git init -q -b kobo-sheets
          git config user.name "kobo-sheets bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json ./*.pdf ./*.kepub.epub drive-reference.txt drive-write.txt
          git commit -q -m "Kobo sheets from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kobo-sheets
