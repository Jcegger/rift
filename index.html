/* ══════════════════════════════════════════════════════════════════════════
   LEGENDS: the roster, and whether you can actually field one
   ══════════════════════════════════════════════════════════════════════════
   A deck is built around one Legend, and a Legend needs a champion unit to work —
   the game has a Chosen Champion and a Champion Zone, and cards like Hallowed Tomb
   reference them. So "do I have this legend" is two questions, not one: the legend
   itself, and at least one unit of its champion.

   The first thing to check was whether any legend simply has no champion unit
   printed, and none does: every one of the 49 has between two and four, and all of
   them sit inside the legend's own domain identity, so none is unplayable on paper.
   That is why this view is about what is owned. The printed-pool count is still shown
   per legend, so if a future set ever ships a legend without one, it appears here
   instead of the check silently continuing to pass.                                */

// The champion a card is named after. Legends carry it as a tag, but the tag list
// mixes champions with regions and races — Heart of the Tempest is tagged both Yordle
// and Kennen — so the tag has to be the one that some card is actually named after.
// Cards from products Riot does not publish carry no tags at all, hence the fallback
// to the card's own name; with it, nothing in the catalog is left unresolved.
function championOf(card){
  if (!card) return null;
  for (const t of (card.g || [])) if (CHAMPS.has(t)) return t;
  const m = /^(.+?)(?:,| - )/.exec(card.n || '');
  return m ? m[1].trim() : null;
}

const VORDER = ['', 'alt', 'sig', 'over', 'promo'];

// One row per legend, folded across printings, with its champion units resolved and
// counted. Everything downstream of this is presentation.
function legendRoster(){
  if (!CAT) return [];
  const byLegend = new Map();
  for (const c of CAT.cards){
    if (c.t !== 'Legend') continue;
    const key = gameName(c);
    if (!byLegend.has(key)) byLegend.set(key, []);
    byLegend.get(key).push(c);
  }

  // Champion -> its distinct units, one entry per card rather than per printing so the
  // Arcane Box Set reprints do not appear as extra units.
  //
  // A unit is filed under every champion it is tagged with, not under one picked from
  // the list. Tag order carries no meaning: Azir, Ascendant is tagged Bird, Azir,
  // Shurima, so asking a unit "who is your champion" and taking the first answer filed
  // both Azir units under Bird and left the Emperor of the Sands looking like a legend
  // with no champion unit in the game. Membership is the question, not extraction.
  const unitsByChamp = new Map();
  const seenUnit = new Set();
  const file = (champ, card) => {
    if (!champ) return;
    if (!unitsByChamp.has(champ)) unitsByChamp.set(champ, []);
    unitsByChamp.get(champ).push(card);
  };
  for (const c of CAT.cards){
    if (c.t !== 'Unit' || c.v) continue;
    const id = identityOf(c);
    if (seenUnit.has(id)) continue;
    seenUnit.add(id);
    const tagged = (c.g || []).filter(t => CHAMPS.has(t));
    if (tagged.length) for (const t of tagged) file(t, c);
    else file(championOf(c), c);   // products Riot does not publish carry no tags
  }

  const have = ownedIdentities();
  const lists = new Map();
  for (const d of (DECKS || [])){
    const n = archetypeName(d);
    lists.set(n, (lists.get(n) || 0) + 1);
  }

  const out = [];
  for (const [name, printings] of byLegend){
    printings.sort((a, b) => VORDER.indexOf(a.v || '') - VORDER.indexOf(b.v || '') ||
                             a.c.localeCompare(b.c));
    const rep = printings.find(x => !x.v) || printings[0];
    const champ = championOf(rep);
    const copies = have.get(identityOf(rep)) || 0;
    const units = (unitsByChamp.get(champ) || []).map(u => {
      const n = have.get(identityOf(u)) || 0;
      return { card: u, owned: n };
    }).sort((a, b) => b.owned - a.owned || a.card.n.localeCompare(b.card.n));
    const unitsOwned = units.filter(u => u.owned > 0).length;
    out.push({
      name, champ, rep, printings, copies, units, unitsOwned,
      // A legend is held at one copy of any printing: a deck runs exactly one, so the
      // three-copy playset target the rest of the app uses does not apply.
      held: copies > 0,
      fieldable: copies > 0 && unitsOwned > 0,
      blocked: copies > 0 && unitsOwned === 0,
      printingsOwned: printings.filter(x => owned(x.c) > 0).length,
      lists: lists.get(name) || 0,
    });
  }
  return out.sort((a, b) => b.lists - a.lists || a.name.localeCompare(b.name));
}

/* ── the champion is the unit of thought ───────────────────────────────────
   The legend-level roster above is what the printings checklist needs, but it is not
   how you decide anything. You do not set out to play Loose Cannon, you set out to
   play Jinx, and what stops you is missing either half of the pair. So the roster is
   regrouped by champion and every row carries the same verdict.

   It is nearly one legend per champion — 49 legends over 48 champions — with a single
   exception that the grouping has to survive: Master Yi has two, Wuju Bladesman -
   Starter and Wuju Master, and they share all four of his champion units. Holding
   either legend makes him playable, so the champion is the row and both epithets sit
   on it.

   The 48 champions with units but no legend at all are left out. Nothing about them
   can ever become playable, so a verdict column would read the same forever.        */

// One champion unit is all playability needs, so the counts on the right are collection
// depth rather than a threshold. The blurbs have to say that, or a row reading "1/4
// units" under NEED THE LEGEND looks like it contradicts the heading above it.
const CH_STATES = [
  ['playable',   'PLAYABLE',         'The legend and at least one of its champion units, both in hand.', 'var(--good)'],
  ['needUnit',   'NEED A UNIT',      'The legend is in hand but none of its champion units. Any single one listed makes it playable.', 'var(--bad)'],
  ['needLegend', 'NEED THE LEGEND',  'A champion unit is already in hand, which is all that is needed, so the legend is the only thing left. The fraction is how deep the collection goes, not a bar to clear.', 'var(--maize)'],
  ['needBoth',   'NEED BOTH',        'Neither half yet.', 'var(--dimmer)'],
];

function championRoster(legends){
  const byChamp = new Map();
  for (const l of (legends || legendRoster())){
    if (!l.champ) continue;
    const e = byChamp.get(l.champ) || { champ: l.champ, legends: [], units: l.units, lists: 0 };
    e.legends.push(l);
    e.lists += l.lists;
    // Every legend of a champion resolves the same unit set, so keep the fuller one
    // rather than assuming they match.
    if (l.units.length > e.units.length) e.units = l.units;
    byChamp.set(l.champ, e);
  }

  const out = [];
  for (const e of byChamp.values()){
    e.legends.sort((a, b) => b.lists - a.lists || a.name.localeCompare(b.name));
    const heldLegend = e.legends.some(l => l.held);
    const unitsOwned = e.units.filter(u => u.owned > 0).length;
    const state = heldLegend
      ? (unitsOwned ? 'playable' : 'needUnit')
      : (unitsOwned ? 'needLegend' : 'needBoth');
    out.push({
      ...e,
      rep: (e.legends.find(l => l.held) || e.legends[0]).rep,
      epithets: e.legends.map(l => l.name),
      heldLegend, unitsOwned, state,
      playable: state === 'playable',
      // The cheapest legend printing to go and get, when the legend is what is missing.
      legendToGet: heldLegend ? null : e.legends[0],
      missingUnits: e.units.filter(u => !u.owned),
    });
  }
  const order = CH_STATES.map(x => x[0]);
  return out.sort((a, b) => order.indexOf(a.state) - order.indexOf(b.state) ||
                            b.lists - a.lists || a.champ.localeCompare(b.champ));
}

// Champions who have units but no legend, and so can never be a deck identity. Counted
// rather than written down, because the number moves every time a set ships.
function legendlessChampions(){
  if (!CAT) return [];
  const withLegend = new Set();
  for (const c of CAT.cards) if (c.t === 'Legend') withLegend.add(championOf(c));
  const out = new Set();
  for (const c of CAT.cards){
    if (c.t !== 'Unit' || c.v) continue;
    const tagged = (c.g || []).filter(t => CHAMPS.has(t));
    for (const t of (tagged.length ? tagged : [championOf(c)]))
      if (t && !withLegend.has(t)) out.add(t);
  }
  return [...out].sort();
}

function legendText(roster){
  const champs = championRoster(roster);
  const lines = ['CHAMPIONS', ''];
  for (const [key, label] of CH_STATES){
    const g = champs.filter(c => c.state === key);
    if (!g.length) continue;
    lines.push(`${label} (${g.length})`);
    for (const c of g){
      lines.push(`  ${c.champ} — ${c.epithets.join(' / ')}` +
                 `   ${c.unitsOwned}/${c.units.length} units` +
                 `${c.lists ? `, ${c.lists} list${c.lists === 1 ? '' : 's'}` : ''}`);
      if (key === 'needUnit')
        lines.push(`      any of: ${c.units.map(u => `${u.card.n} ${u.card.c}`).join(' · ')}`);
      if (key === 'needLegend' && c.legendToGet)
        lines.push(`      legend: ${c.legendToGet.rep.c}`);
    }
    lines.push('');
  }
  return lines.join('\n').trim();
}

let CH_NEED_UNIT = [];        // what the two wants buttons act on
let CH_NEED_LEGEND = [];

function renderLegends(){
  const host = document.getElementById('v-legends');
  if (!CAT){ host.innerHTML = ''; return; }
  const roster = legendRoster();
  const champs = championRoster(roster);
  const legendless = legendlessChampions();
  const bucket = (k) => champs.filter(c => c.state === k);
  CH_NEED_UNIT   = bucket('needUnit');
  CH_NEED_LEGEND = bucket('needLegend');

  const printTotal = roster.reduce((a, l) => a + l.printings.length, 0);
  const printHave  = roster.reduce((a, l) => a + l.printingsOwned, 0);

  // The champion is the heading, the epithet is the cross-reference: Meta and Next
  // name archetypes by epithet, so a row that said only "Irelia" would leave you
  // unable to connect the two.
  // riftbound.gg writes a guide per champion, and a guide is only useful next to the
  // champion it is about, so it rides on the row rather than living in the feed.
  const guides = guideByChampion();

  const row = (c, right) => {
    const g = guides.get(c.champ);
    return `
    <div class="row"${right.detail ? ' style="align-items:flex-start"' : ''}>
      ${c.rep.i ? `<img class="thumb" loading="lazy" src="${imgURL(c.rep, 60)}" alt="" data-zoom="${esc(c.rep.c)}">` : ''}
      <span class="nm"${right.detail ? ' style="white-space:normal"' : ''}>${dchips(c.rep)}
        <b style="color:var(--cream)">${esc(c.champ)}</b>
        <span class="code">${esc(c.epithets.join(' / '))}${
          c.rep.d ? ' · ' + esc(c.rep.d.join('/')) : ''}${
          c.lists ? ` · ${c.lists} list${c.lists === 1 ? '' : 's'}` : ''}</span>
        ${g ? `<a class="code" style="color:var(--teal)" target="_blank" rel="noopener"
           href="${esc(g.url)}" title="${esc(g.title)}">guide · ${esc(g.dt)}</a>` : ''}
        ${right.detail ? `<div class="note" style="margin-top:3px">${right.detail}</div>` : ''}</span>
      <span class="qty${right.warn ? ' need' : ''}">${right.text}</span>
    </div>`;
  };

  // A champion in NEED A UNIT owns none of them by definition, so a per-unit owned
  // column would mark every row the same. The names are the actionable part.
  //
  // Each one is a chip rather than an item in a separated list, because champion unit
  // names contain commas — "Master Yi, Tempered" — and any punctuation separator makes
  // four units read as eight. A bounded box cannot be misread that way.
  const anyOf = (c) => 'any of: ' + c.units.map(u =>
    `<span class="chip" style="cursor:default" title="${esc(u.card.c)}">${esc(u.card.n)}
      <span class="code">${esc(u.card.c)}</span></span>`).join(' ');

  const chips = (l) => l.printings.map(x => {
    const n = owned(x.c);
    return `<span class="chip" aria-pressed="${n > 0}" title="${esc(x.c)}" style="cursor:default">${
      esc(vLabel(x.v))}${n ? ` ${n}` : ''}</span>`;
  }).join(' ');

  const right = (c) => {
    if (c.state === 'playable')   return { text: `${c.unitsOwned}/${c.units.length} units` };
    if (c.state === 'needUnit')   return { text: `0/${c.units.length} units`, warn: true, detail: anyOf(c) };
    if (c.state === 'needLegend') return { text: `${c.unitsOwned}/${c.units.length} units`, warn: true,
      detail: `legend: ${c.legendToGet ? `${esc(c.legendToGet.name)} <span class="code">${esc(c.legendToGet.rep.c)}</span>` : '?'}` };
    return { text: `${c.unitsOwned}/${c.units.length} units`, warn: true };
  };

  host.innerHTML = `
    <div class="panel">
      <h2>CHAMPIONS <span class="code">${champs.length}</span></h2>
      <p class="note">A champion is playable when you hold both halves: the legend, at one copy of any
      printing since a deck runs exactly one, and at least one unit of that champion for the Champion
      Zone. Grouped below by which half is missing, most-played first.${
        guides.size ? ` ${guides.size} have a guide on riftbound.gg, linked from the row.` : ''}</p>
      <div class="stats" style="margin-top:14px">
        ${CH_STATES.map(([k, label, , colour]) => `
          <div class="stat"><div class="v" style="color:${colour}">${bucket(k).length}</div>
            <div class="k">${label.toLowerCase()}</div></div>`).join('')}
      </div>
      <div class="bar-row" style="margin-top:12px">
        <button class="ghost" id="btn-legend-copy">Copy the gaps</button>
        ${CH_NEED_UNIT.length ? '<button class="ghost" id="btn-legend-wants">Add missing units to wants</button>' : ''}
        ${CH_NEED_LEGEND.length ? '<button class="ghost" id="btn-legend-wants-legends">Add missing legends to wants</button>' : ''}
      </div>
      ${legendless.length ? `<p class="note" style="margin-top:10px">${legendless.length} further
        champion${legendless.length === 1 ? ' has' : 's have'} units but no legend printed, so
        ${legendless.length === 1 ? 'it' : 'they'} can never be a deck identity and
        ${legendless.length === 1 ? 'is' : 'are'} left out.</p>` : ''}
    </div>

    ${CH_STATES.map(([k, label, blurb, colour]) => {
      const g = bucket(k);
      return `<div class="panel">
        <h2 style="color:${colour}">${label} <span class="code">${g.length}</span></h2>
        <p class="note">${blurb}</p>
        ${g.length ? `<div class="rows" style="margin-top:8px">${g.map(c => row(c, right(c))).join('')}</div>`
          : `<p class="empty">None.</p>`}
      </div>`;
    }).join('')}

    <div class="panel">
      <h2>LEGEND PRINTINGS <span class="code">${printHave}/${printTotal}</span></h2>
      <p class="note">Lit chips are what you hold, per legend rather than per champion. The classes
      shown are the ones that exist: most legends have a base, a signature and an overnumber, four only
      a base, and two also have a Secret Garden promo.</p>
      <div class="rows">${roster.map(l => `
        <div class="row">
          <span class="nm">${dchips(l.rep)} <b style="color:var(--cream)">${esc(l.champ || '?')}</b>
            <span class="code">${esc(l.name)}</span></span>
          <span class="qty" style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${chips(l)}</span>
        </div>`).join('')}</div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   NEWS
   ══════════════════════════════════════════════════════════════════════════
   data/news.json is riftbound.gg's own posts: a title, a date, a tag and a link. The
   endpoint carries no body text, so this links out rather than reproducing anything.

   The valuable part is not the feed, it is the join. A post tagged Legends is a guide
   to one champion, so it belongs on that champion's row rather than in a list you have
   to remember to read. Two tags mean our own data is about to be wrong — a new set, or
   a rules change — so those get said loudly instead of scrolling past.

   The matching is done here rather than in the build script on purpose. It needs the
   same name fold the rest of the app uses, and a second copy of that would drift, the
   way the deck parser nearly did.                                                   */

// Titles come in two shapes, both real:
//   "Jayce, Defender of Tomorrow - Best Decks & Synergies"   champion, legend
//   "Vex - Gloomist Guide - Best Decks & Cards"              champion - legend
// so take the head, drop the marketing tail, then try the pair before the champion.
const NEWS_TAIL = /\s+(?:guide|best decks?(?:\s*(?:&|and)\s*(?:synergies|cards))?|deck guide|synergies)\s*$/i;

// The lookup a title is matched against: "champion, legend" and bare champion, both
// lowercased. Built from the catalog, which does not change after boot, so unlike the
// champion roster this has nothing to do with what is owned and can be built once.
//
// It matters that this is not championRoster(). Matching used to call that per post,
// which rebuilt the whole 48-champion roster 94 times and made rendering the news feed
// the slowest thing in the app at 294ms. The names never move; the ownership does.
let CHAMP_INDEX = null;
function championIndex(){
  if (CHAMP_INDEX) return CHAMP_INDEX;
  CHAMP_INDEX = new Map();
  if (!CAT) return CHAMP_INDEX;
  const legends = CAT.cards.filter(c => c.t === 'Legend');
  const seen = new Set();
  for (const l of legends){
    const name = gameName(l);
    if (seen.has(name)) continue;
    seen.add(name);
    const rep = legends.find(x => gameName(x) === name && !x.v) || l;
    const champ = championOf(rep);
    if (!champ) continue;
    CHAMP_INDEX.set(`${champ}, ${name}`.toLowerCase(), champ);
    if (!CHAMP_INDEX.has(champ.toLowerCase())) CHAMP_INDEX.set(champ.toLowerCase(), champ);
  }
  return CHAMP_INDEX;
}

function newsChampion(title){
  if (!CAT) return null;
  let head = String(title || '').split(' - ')[0].trim();
  for (let i = 0; i < 3 && NEWS_TAIL.test(head); i++) head = head.replace(NEWS_TAIL, '').trim();
  if (!head) return null;
  const idx = championIndex();
  // champion + legend, e.g. "Diana, Scorn of the Moon", before champion alone, e.g.
  // "Pyke" or the head of "Pyke - Bloodharbor Ripper".
  return idx.get(head.toLowerCase()) ||
         idx.get(head.split(',')[0].trim().toLowerCase()) || null;
}

const newsTag = (p) => (p.tags && p.tags[0]) || 'Untagged';
const newsByTag = (tag) => (NEWS || []).filter(p => (p.tags || []).includes(tag));

// Champion -> its most recent guide, so a Legends row can link to it.
let NEWS_GUIDES = null;
function guideByChampion(){
  if (NEWS_GUIDES) return NEWS_GUIDES;
  NEWS_GUIDES = new Map();
  for (const p of (NEWS || [])){
    if (!(p.tags || []).includes('Legends')) continue;
    const champ = newsChampion(p.title);
    if (!champ) continue;
    const prev = NEWS_GUIDES.get(champ);
    if (!prev || p.dt > prev.dt) NEWS_GUIDES.set(champ, p);
  }
  return NEWS_GUIDES;
}

// A new set or a rules change means the catalog and the ban list are about to be
// wrong, which is worth interrupting for. Anything older than a month is history.
function dataAlerts(){
  const out = [];
  for (const p of (NEWS || [])){
    const tags = p.tags || [];
    if (!tags.includes('Sets') && !tags.includes('Rules')) continue;
    const age = daysSince(p.dt);
    if (age == null || age > 30) continue;
    out.push({ ...p, age });
  }
  return out.sort((a, b) => b.dt.localeCompare(a.dt));
}

function newsRow(p, opts){
  const champ = (opts && opts.champ) !== false ? newsChampion(p.title) : null;
  return `<div class="row">
    <span class="nm" style="white-space:normal">${esc(p.title)}
      <span class="code">${esc(p.dt)} · ${esc(newsTag(p))}${p.author ? ` · ${esc(p.author)}` : ''}${
        champ ? ` · ${esc(champ)}` : ''}</span></span>
    <a class="ghost" style="text-decoration:none;white-space:nowrap" target="_blank" rel="noopener"
       href="${esc(p.url)}">Read</a>
  </div>`;
}

// A compact block of the latest posts under given tags, for the Meta tab.
function newsBlock(tags, n){
  const picks = (NEWS || []).filter(p => (p.tags || []).some(t => tags.includes(t)))
                            .slice(0, n || 4);
  if (!picks.length) return '';
  return `<div class="rows" style="margin-top:8px">${picks.map(p => newsRow(p, { champ:false })).join('')}</div>`;
}

let NEWS_TAG = '';        // the active tag filter

function renderNews(){
  const host = document.getElementById('v-news');
  if (!NEWS || !NEWS.length){
    host.innerHTML = `<div class="panel"><h2>NEWS</h2><p class="note">No news snapshot yet.
      Run <code>node scripts/build-news.mjs</code>.</p></div>`;
    return;
  }
  const counts = {};
  for (const p of NEWS) counts[newsTag(p)] = (counts[newsTag(p)] || 0) + 1;
  const tags = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const shown = NEWS_TAG ? newsByTag(NEWS_TAG) : NEWS;
  const alerts = dataAlerts();
  const guides = guideByChampion();

  host.innerHTML = `
    <div class="panel">
      <h2>NEWS <span class="code">${NEWS.length}</span></h2>
      <p class="note">riftbound.gg's own posts, ${esc(NEWS[NEWS.length - 1].dt)} to
      ${esc(NEWS[0].dt)}. Titles and links only: the feed they publish carries no body text, so these
      open on their site. ${guides.size} of the ${championRoster().length} champions have a guide, linked
      from their row on the Legends tab.</p>
      ${staleNote('news', 'this feed')}
      <div class="bar-row" style="margin-top:12px">
        <button class="chip" data-news-tag="" aria-pressed="${!NEWS_TAG}">All ${NEWS.length}</button>
        ${tags.map(([t, n]) => `<button class="chip" data-news-tag="${esc(t)}"
          aria-pressed="${NEWS_TAG === t}">${esc(t)} ${n}</button>`).join(' ')}
      </div>
    </div>

    ${alerts.length ? `<div class="panel" style="border-color:var(--maize)">
      <h2 style="color:var(--maize)">WORTH KNOWING <span class="code">${alerts.length}</span></h2>
      <p class="note">Set and rules posts from the last month. These are the two kinds that make this
      app's own data wrong, so a new set means the catalog needs rebuilding and a rules post may mean
      the ban list has moved.</p>
      <div class="rows" style="margin-top:8px">${alerts.map(p => newsRow(p, { champ:false })).join('')}</div>
    </div>` : ''}

    <div class="panel">
      <h2>${NEWS_TAG ? esc(NEWS_TAG.toUpperCase()) : 'EVERYTHING'} <span class="code">${shown.length}</span></h2>
      ${shown.length ? `<div class="rows">${shown.map(p => newsRow(p)).join('')}</div>`
        : `<p class="empty">Nothing tagged ${esc(NEWS_TAG)}.</p>`}
    </div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER: dispatch
   ══════════════════════════════════════════════════════════════════════════ */
function render(){
  for (const t of ['collection','sets','trade','decks','meta','next','legends','news','sync'])
    document.getElementById('v-' + t).classList.toggle('hide', TAB !== t);
  for (const b of document.querySelectorAll('.tab'))
    b.setAttribute('aria-selected', String(b.dataset.tab === TAB));

  if (TAB === 'collection') renderCollection(true);
  if (TAB === 'sets')  renderSets();
  if (TAB === 'trade') renderTrade();
  if (TAB === 'decks') renderDecks();
  if (TAB === 'meta')  renderMeta();
  if (TAB === 'next')  renderNext();
  if (TAB === 'legends') renderLegends();
  if (TAB === 'news')  renderNews();
  if (TAB === 'sync')  renderSync();

  // keep the badges honest even when their tab is closed
  if (TAB !== 'trade') renderTradeBadge();
  if (TAB !== 'decks') document.getElementById('tn-decks').textContent = S.decks.length || '';
  renderImportBadge();
  renderMirrorNote();
  renderFreshness();
  const nwb = document.getElementById('tn-news');
  if (nwb){
    // The badge counts only the posts that mean this app's own data is going stale —
    // a new set or a rules change — rather than every headline, which would sit there
    // permanently and stop meaning anything.
    const n = dataAlerts().length;
    nwb.textContent = n || '';
    nwb.style.color = n ? 'var(--maize)' : '';
  }
  const lb = document.getElementById('tn-legends');
  if (lb && CAT){
    // The badge counts champions whose legend is in hand but who have no unit to field
    // it, since that is the only state here that is quietly wrong rather than merely
    // incomplete: you own the card and cannot use it.
    const stuck = championRoster().filter(c => c.state === 'needUnit').length;
    lb.textContent = stuck || '';
    lb.style.color = stuck ? 'var(--bad)' : '';
  }
  // Meta carries no badge. It used to show a buildable-deck count, which measured across
  // five collection sizes is zero unless you own literally every printing — a permanent
  // untruth in the tab bar. Meta is a reference view now and has nothing to nag about.
  const nb = document.getElementById('tn-next');
  if (nb && DECKS){
    // Same pool the tabs use, or the badge would price a deck the tab refuses to show
    // because it is banned.
    //
    // scorePool rather than metaArchetypes, which is what the tabs call. Both agree on
    // every archetype's gap — the checks assert exactly that — but metaArchetypes also
    // evaluates bans and builds a representative row per list, and badges are refreshed
    // even when their own tab is shut, so this is deliberately the cheap path.
    const scored = scorePool(metaPool(), ownedIdentities());
    // The cheapest gap, not the fewest cards. Money is the default axis now, and "$1"
    // says more about whether to act than "+9" does. Unpriced gaps are skipped rather
    // than counted as free.
    const spends = scored.filter(g => g.short > 0 && g.unpriced === 0).map(g => g.spend);
    if (spends.length){
      const min = Math.min(...spends);
      nb.textContent = min < 1 ? `$${min.toFixed(2)}` : `$${Math.round(min)}`;
    } else {
      const gaps = scored.filter(g => g.short > 0).map(g => g.short);
      nb.textContent = gaps.length ? '+' + Math.min(...gaps) : '';
    }
    nb.style.color = '';
  }
}
// Normal and Foil are a mirror of riftbound.gg: every import replaces them, so a
// correction typed here is lost on the next pull, while Want and Trade exist only in
// this app and survive. That asymmetry is invisible in a row of four identical boxes,
// and it is only a trap for someone who actually imports, so the warning appears only
// once importing is in play rather than nagging a hand-entered collection.
function renderMirrorNote(){
  const el = document.getElementById('mirror-note');
  if (!el) return;
  const mirrored = !!(S.lastSyncAt || S.autoSync);
  el.classList.toggle('hide', !mirrored);
  if (!mirrored){ el.innerHTML = ''; return; }
  el.innerHTML = `<span class="note">Normal and Foil mirror riftbound.gg and are replaced on every
    import${S.lastSyncAt ? `, last pulled ${esc(String(S.lastSyncAt).slice(0, 16).replace('T', ' '))}` : ''};
    correct them there, not here. Want, Trade and On the way are only kept in this app${
    S.mirrorTradeWish ? ' but "Mirror trade and wishlist" is on, so they are overwritten too' : ''}.${(() => {
      const bad = foilOnlyProblems().length;
      return bad ? ` <b style="color:var(--warn)">${bad} printing${bad === 1 ? '' : 's'} hold a Normal
        count that cannot exist; see the Import tab.</b>` : '';
    })()}</span>`;
}

function renderImportBadge(){
  const el = document.getElementById('tn-sync');
  if (!el) return;
  const bad = lastImport && lastImport.error;
  el.textContent = bad ? '!' : '';
  el.style.color = bad ? 'var(--bad)' : '';
  el.title = bad ? 'Last import failed: ' + lastImport.error : '';
}
function renderTradeBadge(){
  const { haves, wants } = tradeLists();
  document.getElementById('tn-trade').textContent = (haves.length || wants.length)
    ? `${haves.length}/${wants.length}` : '';
}

/* ══════════════════════════════════════════════════════════════════════════
   FILTER UI
   ══════════════════════════════════════════════════════════════════════════ */
function buildFilterUI(){
  const opt = (v,l,sel) => `<option value="${esc(v)}" ${sel === v ? 'selected' : ''}>${esc(l)}</option>`;

  document.getElementById('f-set').innerHTML =
    opt('','All sets',F.set) + CAT.sets.map(s => opt(s.id, s.name, F.set)).join('');
  document.getElementById('f-type').innerHTML =
    opt('','All types',F.type) + TYPES.map(t => opt(t,t,F.type)).join('');
  document.getElementById('f-rarity').innerHTML =
    opt('','All rarities',F.rarity) + RARITIES.map(r => opt(r,r,F.rarity)).join('');
  document.getElementById('f-sort').value = F.sort;
  document.getElementById('q').value = F.q;

  // The tag filter only appears once an import has actually brought tags in.
  const tags = allTags();
  const tagSel = document.getElementById('f-tag');
  tagSel.classList.toggle('hide', !tags.length);
  tagSel.innerHTML = opt('','Any tag',F.tag) + tags.map(t => opt(t, t, F.tag)).join('');
  if (F.tag && !tags.includes(F.tag)) F.tag = '';

  document.getElementById('f-domain').innerHTML = DOMAINS.map(d =>
    `<button class="chip d-${d.toLowerCase()}" data-dom="${d}" aria-pressed="${F.domain.includes(d)}">${d}</button>`
  ).join(' ');

  document.getElementById('f-variant').innerHTML = VARIANTS.map(([v,l]) =>
    `<button class="chip" data-var="${v}" aria-pressed="${F.variant.includes(v)}">${l}</button>`
  ).join(' ');

  document.getElementById('f-have').innerHTML = [
    ['','Everything'],['own','Owned'],['missing','Missing'],['want','Wanted'],
    ['trade','For trade'],['coming','On the way'],['foil','Foils'],['banned','Banned'],
  ].map(([v,l]) => `<button class="chip" data-have="${v}" aria-pressed="${F.have === v}">${l}</button>`).join(' ');

  document.getElementById('f-view').textContent = F.view === 'grid' ? 'Table view' : 'Grid view';
}

/* ══════════════════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════════════════ */
function toast(msg){
  const t = document.getElementById('sync-txt');
  const old = t.textContent;
  t.textContent = msg;
  setTimeout(() => { t.textContent = old; }, 1600);
}
async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg || 'copied'); }
  catch { toast('copy blocked'); }
}

function wire(){
  // tabs
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    TAB = b.dataset.tab; render();
  });

  // filters
  const q = document.getElementById('q');
  let qt = null;
  q.addEventListener('input', () => {
    clearTimeout(qt);
    qt = setTimeout(() => { F.q = q.value.trim(); persistUI(); renderCollection(true); }, 180);
  });
  for (const [id,key] of [['f-set','set'],['f-type','type'],['f-rarity','rarity'],
                          ['f-sort','sort'],['f-tag','tag']]){
    document.getElementById(id).addEventListener('change', (e) => {
      F[key] = e.target.value; persistUI(); renderCollection(true);
    });
  }
  document.getElementById('f-view').addEventListener('click', () => {
    F.view = F.view === 'grid' ? 'table' : 'grid';
    document.getElementById('f-view').textContent = F.view === 'grid' ? 'Table view' : 'Grid view';
    persistUI(); renderCollection(true);
  });
  document.getElementById('f-clear').addEventListener('click', () => {
    Object.assign(F, { q:'', set:'', type:'', rarity:'', tag:'', domain:[], variant:[], have:'' });
    persistUI(); buildFilterUI(); renderCollection(true);
  });

  const toggleIn = (arr, v) => {
    const i = arr.indexOf(v);
    if (i < 0) arr.push(v); else arr.splice(i, 1);
  };
  document.getElementById('f-domain').addEventListener('click', (e) => {
    const b = e.target.closest('[data-dom]'); if (!b) return;
    toggleIn(F.domain, b.dataset.dom); persistUI(); buildFilterUI(); renderCollection(true);
  });
  document.getElementById('f-variant').addEventListener('click', (e) => {
    const b = e.target.closest('[data-var]'); if (!b) return;
    toggleIn(F.variant, b.dataset.var); persistUI(); buildFilterUI(); renderCollection(true);
  });
  document.getElementById('f-have').addEventListener('click', (e) => {
    const b = e.target.closest('[data-have]'); if (!b) return;
    F.have = F.have === b.dataset.have ? '' : b.dataset.have;
    persistUI(); buildFilterUI(); renderCollection(true);
  });

  // quantity edits, anywhere (delegated: 1189 rows means no per-input listeners)
  document.body.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.code && el.dataset.f){
      setQty(el.dataset.code, el.dataset.f, el.value);
      patchCard(el, el.dataset.code);
      renderTradeBadge();
      return;
    }
    // Source labels regroup the panel they live in, so this one does redraw.
    if (el.dataset.src){
      setSource(el.dataset.src, el.value);
      if (TAB === 'next') renderNext();
      return;
    }
    if (el.dataset.deckQty){
      const d = S.decks.find(x => x.id === el.dataset.deckQty);
      if (!d) return;
      d.cards = d.cards || {};
      const n = Math.max(0, Math.min(9, Math.floor(Number(el.value) || 0)));
      if (n) d.cards[el.dataset.code] = n; else delete d.cards[el.dataset.code];
      persist();
      return;
    }
    if (el.id === 'playset'){
      S.playset = Math.max(1, Math.min(9, Number(el.value) || 3));
      persist();
    }
    if (el.id === 'near-spend'){
      // Blank or 0 means "no budget" on Find my deck: show everything, rank by tier.
      // Persist quietly so the field keeps focus while typing; the panel redraws on commit.
      S.nearSpend = el.value.trim() === '' ? 0 : Math.max(0, Math.min(5000, Number(el.value) || 0));
      persist({ render: false });
    }
  });
  document.body.addEventListener('change', (e) => {
    if (e.target.id === 'near-spend' && TAB === 'next') renderNext();
  });

  // Re-render on qty change is heavy in the collection view, so patch in place instead.
  document.body.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.code && el.dataset.f) el.classList.toggle('set', !!Number(el.value));
  });

  // lightbox
  document.body.addEventListener('click', (e) => {
    const z = e.target.closest('[data-zoom]'); if (!z) return;
    const c = BY[z.dataset.zoom]; if (!c) return;
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.innerHTML = `<img src="${imgURL(c,744)}" alt="${esc(c.n)}">
      <div class="lb-info">${esc(c.n)} · ${esc(c.c)} · ${esc(c.r||'')} ${c.v ? '· ' + esc(vLabel(c.v)) : ''}
      ${c.x ? '<br>' + esc(c.x).replace(/\n/g,' / ') : ''}</div>`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.querySelectorAll('.lb').forEach(n => n.remove());
  });

  // backup / restore
  document.getElementById('btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ inv:S.inv, decks:S.decks, playset:S.playset }, null, 2)],
      { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `riftbound-collection-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  });
  document.getElementById('btn-import').addEventListener('click', () => {
    const f = document.createElement('input');
    f.type = 'file'; f.accept = 'application/json';
    f.onchange = async () => {
      try {
        const d = JSON.parse(await f.files[0].text());
        if (!confirm('Replace the current collection with this backup?')) return;
        S.inv = d.inv || {}; S.decks = d.decks || []; S.playset = d.playset || 3;
        persist(); toast('restored');
      } catch { alert('That file is not a collection backup.'); }
    };
    f.click();
  });

  // per-view buttons (delegated, since these views re-render)
  document.body.addEventListener('click', (e) => {
    const t = e.target;

    // ── spares and trade matching ────────────────────────────────────
    if (t.id === 'btn-spares-copy') copy(spareText(), 'spares copied');
    if (t.id === 'btn-spares-mark'){
      let n = 0;
      for (const s of spares()){
        // Attribute the surplus to the printings actually held, duplicates first.
        let left = s.surplus;
        const held = Object.entries(S.inv)
          .filter(([code]) => BY[code] && identityOf(BY[code]) === s.id)
          .sort((a, b) => owned(b[0]) - owned(a[0]));
        for (const [code] of held){
          if (left <= 0) break;
          const give = Math.min(left, owned(code));
          if (give > 0 && forTrade(code) !== give){ setQtyQuiet(code, 't', give); n++; }
          left -= give;
        }
      }
      persist();
      toast(n ? `${n} marked for trade` : 'already marked');
    }
    if (t.id === 'btn-partner-scan'){
      const u = (document.getElementById('partner-user').value || '').trim();
      if (!u) return toast('need a username');
      PARTNER_ERR = '';
      toast('scanning…');
      scanPartner(u).then(() => { PARTNER_ERR = ''; render(); })
                    .catch(e => { PARTNER = null; PARTNER_ERR = e.message; render(); });
    }
    if (t.id === 'btn-partner-clear'){ PARTNER = null; PARTNER_ERR = ''; render(); }
    if (t.id === 'btn-partner-copy') copy(tradeMatchText(), 'trade copied');

    // ── meta ─────────────────────────────────────────────────────────
    const mc = t.closest('[data-meta-copy]');
    if (mc){
      const d = (DECKS || []).find(x => x.s === mc.dataset.metaCopy);
      if (d) copy(metaDeckText(d), 'list copied');
    }
    const ms = t.closest('[data-meta-save]');
    if (ms){
      const d = (DECKS || []).find(x => x.s === ms.dataset.metaSave);
      if (d){
        const id = 'd' + Date.now().toString(36);
        S.decks.push({ id, name: d.ln ? `${d.ln} (meta)` : d.h.slice(0, 40), cards: deckCardsToLocal(d) });
        selDeck = id;
        persist();
        toast('saved to Decks');
      }
    }
    const mw = t.closest('[data-meta-want]');
    if (mw){
      const d = (DECKS || []).find(x => x.s === mw.dataset.metaWant);
      if (d){
        const ev = evalDeck(d, ownedIdentities());
        let n = 0;
        for (const m of ev.missing){
          // Want the full playset the list runs, not just the shortfall, so the
          // number still reads correctly once some copies arrive.
          if (m.need > want(m.card.c)){ setQtyQuiet(m.card.c, 'w', m.need); n++; }
        }
        persist();
        toast(n ? `${n} wants set` : 'nothing to add');
      }
    }
    if (t.id === 'meta-refresh-help') toast('run: node scripts/build-decks.mjs');

    // ── import / sync ────────────────────────────────────────────────
    if (t.id === 'btn-imp-file'){
      const f = document.createElement('input');
      f.type = 'file'; f.accept = '.csv,text/csv,text/plain';
      f.onchange = async () => {
        try {
          lastImport = { ...applyImport(await f.files[0].text()),
                         at: new Date().toISOString().slice(0,16).replace('T',' '),
                         via: f.files[0].name };
          S.lastSyncAt = lastImport.at;
          persist();
        } catch (err){ lastImport = { error: err.message, via: f.files[0].name }; render(); }
      };
      f.click();
    }
    if (t.id === 'btn-imp-paste'){
      document.getElementById('paste-box').focus();
      document.getElementById('paste-box').scrollIntoView({ behavior:'smooth', block:'center' });
    }
    if (t.id === 'btn-paste-go'){
      const txt = document.getElementById('paste-box').value;
      if (!txt.trim()) return toast('nothing pasted');
      try {
        lastImport = { ...applyImport(txt),
                       at: new Date().toISOString().slice(0,16).replace('T',' '), via: 'pasted CSV' };
        S.lastSyncAt = lastImport.at;
        persist();
      } catch (err){ lastImport = { error: err.message, via: 'pasted CSV' }; render(); }
    }
    if (t.id === 'btn-imp-now') syncFromDotgg();
    if (t.id === 'btn-sync-save'){
      S.syncUrl = document.getElementById('sync-url').value.trim();
      persist(); toast(S.syncUrl ? 'link saved' : 'link cleared');
    }
    if (t.id === 'btn-autosync'){ S.autoSync = !S.autoSync; persist(); }
    if (t.id === 'btn-mirror'){ S.mirrorTradeWish = !S.mirrorTradeWish; persist(); }
    if (t.id === 'btn-show-illegal'){ S.showIllegal = !S.showIllegal; persist(); }
    if (t.id === 'btn-own-legend'){ S.ownLegendOnly = !S.ownLegendOnly; persist(); }

    // Find my deck: click a chase card in a gap to blacklist it, click its chip to undo.
    const nb = t.closest('[data-nobuy-card]');
    if (nb){
      const name = nb.dataset.nobuyCard;
      S.noBuy = [...new Set([...(S.noBuy || []), name])];
      persist(); toast(`won't recommend decks needing ${name}`);
    }
    const ub = t.closest('[data-unban-card]');
    if (ub){
      S.noBuy = (S.noBuy || []).filter(n => n !== ub.dataset.unbanCard);
      persist();
    }

    const pby = t.closest('[data-plan-by]');
    if (pby){ S.planBy = pby.dataset.planBy; persist(); }

    // Next: the sort the deck table is asking, the deck pinned in it, and which of the
    // two buy lists is showing. All three are ordinary state, so persist() re-renders.
    const dsort = t.closest('[data-deck-sort]');
    if (dsort){ S.deckSort = dsort.dataset.deckSort; persist(); }
    const bfor = t.closest('[data-buy-for]');
    if (bfor){ S.buyFor = bfor.dataset.buyFor; persist(); }
    if (t.id === 'btn-pick-clear'){ S.pick = null; S.pickList = null; persist(); }
    if (t.id === 'btn-expand-all'){ S.expandAll = !S.expandAll; persist(); }

    // Open/close one archetype's list of individual builds.
    const exp = t.closest('[data-expand]');
    if (exp){
      const n = exp.dataset.expand;
      const set = new Set(S.expand || []);
      set.has(n) ? set.delete(n) : set.add(n);
      S.expand = [...set];
      persist();
    }
    // Pin one specific list from an expanded archetype. It also pins the archetype, so
    // the plan and the deck panel both follow.
    const plist = t.closest('[data-pick-list]');
    if (plist){
      const slug = plist.dataset.pickList;
      const d = DECKS.find(x => x.s === slug);
      S.pickList = S.pickList === slug ? null : slug;
      if (S.pickList && d) S.pick = archetypeName(d);
      persist();
    }

    const pick = t.closest('[data-pick]');
    // Not when the click was really meant for something inside the row — a link, a
    // chase card being blacklisted, the expand toggle, or a per-list pin button.
    if (pick && !t.closest('a') && !t.closest('[data-nobuy-card]') &&
        !t.closest('[data-expand]') && !t.closest('[data-pick-list]')){
      S.pick = S.pick === pick.dataset.pick ? null : pick.dataset.pick;
      S.pickList = null;   // a row-level pick uses the representative, dropping any list pin
      persist();
    }

    const ntag = t.closest('[data-news-tag]');
    if (ntag){ NEWS_TAG = ntag.dataset.newsTag || ''; renderNews(); }

    if (t.id === 'btn-foil-copy') copy(foilOnlyText(foilOnlyProblems()), 'list copied');
    if (t.id === 'btn-foil-fix'){
      // Move the impossible Normal count onto Foil rather than choosing a new total:
      // the copies exist, only the finish was wrong, and inventing a number would be a
      // guess about cards this app cannot see.
      const bad = foilOnlyProblems();
      let moved = 0;
      for (const p of bad){
        const e = { ...(S.inv[p.code] || {}) };
        const f = (e.f || 0) + p.normal;
        delete e.n;
        e.f = f;
        S.inv[p.code] = e;
        moved += p.normal;
      }
      persist();
      toast(moved ? `${moved} moved to foil` : 'nothing to fix');
    }

    if (t.id === 'btn-legend-copy') copy(legendText(legendRoster()), 'champion gaps copied');
    if (t.id === 'btn-legend-wants'){
      // The champions whose legend is in hand and whose units are not. A full playset
      // each, since a deck running the champion runs copies rather than a single card.
      let n = 0;
      for (const c of CH_NEED_UNIT)
        for (const u of c.units)
          if ((S.playset || 3) > want(u.card.c)){ setQtyQuiet(u.card.c, 'w', S.playset || 3); n++; }
      persist();
      toast(n ? `${n} unit wants set` : 'nothing to add');
    }
    if (t.id === 'btn-legend-wants-legends'){
      // The other half: units already in hand, only the legend missing. One copy, not a
      // playset, because a deck runs exactly one legend.
      let n = 0;
      for (const c of CH_NEED_LEGEND){
        const code = c.legendToGet && c.legendToGet.rep.c;
        if (code && want(code) < 1){ setQtyQuiet(code, 'w', 1); n++; }
      }
      persist();
      toast(n ? `${n} legend wants set` : 'nothing to add');
    }

    if (t.id === 'btn-next-copy') copy(pathText(NEXT_PLAN), 'plan copied');
    if (t.id === 'btn-hunt-copy') copy(huntText(HUNT_BANDS_NOW), 'list copied');
    if (t.id === 'btn-coming-copy') copy(comingText(COMING_NOW), 'list copied');
    if (t.id === 'btn-hunt-wants'){
      // The whole shortfall, not the plan's first few targets: this list exists to be
      // carried around, so the wants it sets should match what it shows.
      let n = 0;
      for (const b of (HUNT_BANDS_NOW || []))
        for (const r of b.rows){
          if (r.covered) continue;          // already on the way; wanting it again is noise
          const need = (owned(r.card.c) || 0) + r.buy;
          if (need > want(r.card.c)){ setQtyQuiet(r.card.c, 'w', need); n++; }
        }
      persist();
      toast(n ? `${n} wants set` : 'nothing to add');
    }
    if (t.id === 'btn-next-wants'){
      let n = 0;
      for (const s of NEXT_PLAN)
        if (s.need > want(s.card.c)){ setQtyQuiet(s.card.c, 'w', s.need); n++; }
      persist();
      toast(n ? `${n} wants set` : 'nothing to add');
    }

    if (t.id === 'btn-trade-copy') copy(tradeText(), 'list copied');
    if (t.id === 'btn-trade-link') copy(location.origin + location.pathname + '?view=trade', 'link copied');

    if (t.id === 'btn-deck-add'){
      const el = document.getElementById('deck-new');
      const name = el.value.trim(); if (!name) return;
      const id = 'd' + Date.now().toString(36);
      S.decks.push({ id, name, cards:{} });
      selDeck = id; persist();
    }
    const dn = t.closest('[data-deck]');
    if (dn){ selDeck = selDeck === dn.dataset.deck ? null : dn.dataset.deck; renderDecks(); }

    const del = t.closest('[data-deck-del]');
    if (del){
      const d = S.decks.find(x => x.id === del.dataset.deckDel);
      if (d && confirm(`Delete "${d.name}"?`)){
        S.decks = S.decks.filter(x => x.id !== d.id);
        if (selDeck === d.id) selDeck = null;
        persist();
      }
    }

    if (t.id === 'btn-deck-copy'){
      const d = S.decks.find(x => x.id === selDeck);
      if (d) copy(deckText(d), 'deck copied');
    }
    if (t.id === 'btn-deck-wants'){
      const d = S.decks.find(x => x.id === selDeck); if (!d) return;
      let n = 0;
      for (const [code,qty] of Object.entries(d.cards)){
        if (qty > want(code)){ setQtyQuiet(code, 'w', qty); n++; }
      }
      persist(); toast(n ? `${n} wants set` : 'nothing to add');
    }
  });

  // deck card autocomplete
  document.body.addEventListener('input', (e) => {
    if (e.target.id !== 'deck-search') return;
    deckQuery = e.target.value;
    drawDeckAC();
  });
  document.body.addEventListener('click', (e) => {
    const it = e.target.closest('[data-add]'); if (!it) return;
    const d = S.decks.find(x => x.id === selDeck); if (!d) return;
    const code = it.dataset.add;
    d.cards = d.cards || {};
    d.cards[code] = Math.min(9, (d.cards[code] || 0) + 1);
    persist();
    // renderDecks() rebuilt the search box, so put the query back and keep the
    // dropdown open: adding a whole deck means adding many cards in a row.
    const box = document.getElementById('deck-search');
    if (box){ box.value = deckQuery; box.focus(); drawDeckAC(); }
  });

  // infinite scroll
  new IntersectionObserver((ents) => {
    if (ents.some(x => x.isIntersecting)) drawMore();
  }, { rootMargin:'600px' }).observe(document.getElementById('sentinel'));
}

// like setQty but without the persist/render churn, for bulk edits
function setQtyQuiet(code, field, val){
  const v = Math.max(0, Math.min(999, Math.floor(Number(val) || 0)));
  const e = { ...(S.inv[code] || {}) };
  if (v) e[field] = v; else delete e[field];
  // A source label with nothing on the way is an orphan, and the panel would render
  // it as an empty group, so the two clear together.
  if (field === 'o' && !v) delete e.os;
  if (Object.keys(e).length) S.inv[code] = e; else delete S.inv[code];
}

// The label is a string rather than a count, so it needs its own setter; setQtyQuiet
// clamps to a number. Refuses to attach to a card with nothing inbound, which keeps
// comingList's grouping honest.
function setSource(code, label){
  const s = String(label || '').trim().slice(0, 40);
  const e = { ...(S.inv[code] || {}) };
  if (s && (e.o || 0) > 0) e.os = s; else delete e.os;
  if (Object.keys(e).length) S.inv[code] = e; else delete S.inv[code];
  persist({ render:false });
}

/* ══════════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════════ */
async function boot(){
  loadLocal();
  setDot('off');

  let cat;
  try {
    const r = await fetch('data/cards.json', { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status);
    cat = await r.json();
  } catch {
    document.getElementById('cards').innerHTML =
      '<div class="loading">Could not load data/cards.json. Run <code>node scripts/build-catalog.mjs</code>.</div>';
    return;
  }
  // Riot's gallery omits a handful of real printings (some tokens and basic runes).
  // data/extras.json fills those in, and drops any that Riot has started serving,
  // so the file self-heals instead of creating duplicates.
  try {
    const er = await fetch('data/extras.json', { cache:'no-cache' });
    if (er.ok){
      const have = new Set(cat.cards.map(c => c.c));
      const add = ((await er.json()).cards || []).filter(c => c.c && !have.has(c.c));
      cat.cards = cat.cards.concat(add);
      cat.extras = add.length;
    }
  } catch { /* the catalog is still usable without them */ }

  // Tournament decklists are optional: the app is fully usable without them.
  try {
    const dr = await fetch('data/decks.json', { cache:'no-cache' });
    if (dr.ok){
      const dd = await dr.json();
      DECKS = dd.decks || null;
      DECKS_AT = dd.generatedAt || null;
      DECKS_WINDOW = dd.window || null;
    }
  } catch { /* no meta snapshot */ }

  // News and the event archive, both optional in the same way. A missing file costs a
  // panel, never a working app.
  try {
    const nr = await fetch('data/news.json', { cache:'no-cache' });
    if (nr.ok){
      const nd = await nr.json();
      NEWS = Array.isArray(nd.posts) ? nd.posts : null;
      NEWS_AT = nd.generatedAt || null;
    }
  } catch { /* no news */ }
  try {
    const er2 = await fetch('data/events.json', { cache:'no-cache' });
    if (er2.ok){
      const ed = await er2.json();
      EVENTS = Array.isArray(ed.events) ? ed.events : null;
      EVENTS_AT = ed.generatedAt || null;
      EVENTS_COVER = ed.coverage || null;
    }
  } catch { /* no event archive */ }
  try {
    const tr = await fetch('data/tiers.json', { cache:'no-cache' });
    if (tr.ok){
      const td = await tr.json();
      TIERS = Array.isArray(td.tiers) && td.tiers.length ? td.tiers : null;
      TIERS_AT = td.generatedAt || null;
      TIERS_INFO = TIERS ? { set: td.set || null, report: td.report || null, week: td.week ?? null, source: td.source || null } : null;
    }
  } catch { /* no tier list */ }
  // The archive. Optional like the rest: without it every tab still answers "right
  // now", which is what it did before there was a recorder at all.
  try {
    const hr = await fetch('data/history.json', { cache:'no-cache' });
    if (hr.ok){
      const hd = await hr.json();
      HIST = Array.isArray(hd.days) && hd.days.length ? hd : null;
    }
  } catch { /* no archive */ }

  // Publish the catalog only once it is whole, so nothing can read a half-built one.
  CAT = cat;
  BY = Object.fromEntries(CAT.cards.map(c => [c.c, c]));
  MATCH = null;
  buildNameIndex();        // also drops every catalog-derived cache

  const baseTotal = CAT.cards.filter(c => !c.v).length;
  document.getElementById('sub').textContent =
    `${CAT.cards.length} printings across ${CAT.sets.length} sets · ${baseTotal} numbered base cards`;
  document.getElementById('foot-src').textContent =
    `card data from Riot's public gallery feed · catalog built ${CAT.generatedAt}` +
    (CAT.extras ? ` · plus ${CAT.extras} printings Riot does not publish` : '');

  if (READONLY){
    document.getElementById('tabs').classList.add('hide');
    document.getElementById('v-collection').classList.add('hide');
    for (const id of ['btn-export','btn-import']) document.getElementById(id).classList.add('hide');
  }

  try {
    const br = await fetch('data/banned.json', { cache:'no-cache' });
    if (br.ok) loadBans(await br.json());
  } catch { /* no ban list; nothing gets flagged */ }

  buildFilterUI();
  wire();
  render();

  // Remote wins on load, the same way the LSAT tracker behaves.
  if (await syncPull()) render();

  // Then riftbound.gg wins over that for owned counts, since it is where cards
  // get entered. Quiet on load: a failed pull must not clobber a working session.
  if (!READONLY && S.autoSync && S.syncUrl) await syncFromDotgg(true);
}
boot();
</script>
</body>
</html>
