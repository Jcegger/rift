/* ══════════════════════════════════════════════════════════════════════════
   SPARES AND TRADE MATCHING
   ══════════════════════════════════════════════════════════════════════════
   Built for standing in a shop. Two questions matter there: what can I give
   away without breaking a deck, and is a trade with this person worth doing.

   Everything works on card identity rather than printing, the same rule the
   meta view uses, so alt arts count as the base card and any Fury Rune is a
   Fury Rune.                                                                 */

// identity -> { card: representative printing, copies, codes: {code: n} }
function identityIndex(){
  const out = new Map();
  for (const code in S.inv){
    const n = owned(code);
    if (!n) continue;
    const card = BY[code];
    const id = identityOf(card);
    if (!id) continue;
    const e = out.get(id) || { card, copies:0, codes:{} };
    e.copies += n;
    e.codes[code] = n;
    // Prefer a base printing as the label; a spare is described by the card, not the art.
    if (card && !card.v && e.card && e.card.v) e.card = card;
    out.set(id, e);
  }
  return out;
}

// Copies past the playset target: tradeable without breaking anything.
// Runes are excluded, because lists routinely run nine of one and a "spare" rune
// is usually not spare at all.
function spares(){
  const idx = identityIndex();
  const keep = S.playset || 3;
  const out = [];
  for (const [id, e] of idx){
    if (e.card && (e.card.t === 'Rune' || e.card.v === 'rune')) continue;
    // Legends are left out for the same reason runes are, from the other direction. A
    // deck runs exactly one, so every copy past the first looks spare, and now that
    // printings fold, holding the base plus a signature plus an overnumber reads as
    // three copies of one card. Those extras are chase printings, not trade filler,
    // so offering them up automatically would be wrong.
    if (e.card && e.card.t === 'Legend') continue;
    const surplus = e.copies - keep;
    if (surplus > 0) out.push({ id, card: e.card, copies: e.copies, surplus });
  }
  return out.sort((a, b) => b.surplus - a.surplus || a.card.n.localeCompare(b.card.n));
}

// What you are short of. Explicit wants first, then the gap in the archetypes you
// are closest to, so this is useful before any want has been typed in.
function myNeeds(){
  const need = new Map();
  const bump = (card, qty, why) => {
    const id = identityOf(card);
    if (!id) return;
    const e = need.get(id);
    if (!e || qty > e.qty) need.set(id, { card, qty, why });
  };
  for (const code in S.inv){
    const short = need0(code);
    if (short > 0) bump(BY[code], short, 'want');
  }
  if (DECKS){
    const have = ownedIdentities();
    const arch = metaArchetypes()
      .filter(g => g.best.ev.missingCopies > 0)
      .sort((a, b) => a.best.ev.missingCopies - b.best.ev.missingCopies)
      .slice(0, 5);
    for (const g of arch)
      for (const m of g.best.ev.missing) bump(m.card, m.short, g.name);
  }
  return need;
}
function need0(code){ return Math.max(0, want(code) - owned(code)); }

// A partner's public riftbound.gg profile, reduced to identities.
let PARTNER = null;   // { user, at, offers: Map, wants: Map, raw }
function readPartner(user, payload){
  const list = (payload && payload.collection) || [];
  const keep = S.playset || 3;
  const byId = new Map();
  const int = (v) => { const n = Math.floor(Number(String(v ?? '').trim())); return Number.isFinite(n) && n > 0 ? n : 0; };
  for (const x of list){
    const hit = matchRow({ id: x.card ?? x.cardid ?? x.id ?? '' });
    if (!hit) continue;
    const id = identityOf(hit.card);
    const e = byId.get(id) || { card: hit.card, copies:0, trade:0, wish:0 };
    e.copies += int(x.standard ?? x.normal) + int(x.foil);
    e.trade  += int(x.trade) + int(x.trade_foil);
    e.wish   += int(x.wish) + int(x.wish_foil);
    if (hit.card && !hit.card.v && e.card && e.card.v) e.card = hit.card;
    byId.set(id, e);
  }
  const offers = new Map(), wants = new Map();
  for (const [id, e] of byId){
    // Most people never fill in a trade list, so fall back to their surplus.
    const isRune = e.card && (e.card.t === 'Rune' || e.card.v === 'rune');
    const give = e.trade || (isRune ? 0 : Math.max(0, e.copies - keep));
    if (give > 0) offers.set(id, { card: e.card, qty: give, explicit: !!e.trade, copies: e.copies });
    if (e.wish > 0) wants.set(id, { card: e.card, qty: e.wish, explicit: true });
  }
  return { user, at: new Date().toISOString().slice(0, 16).replace('T', ' '),
           offers, wants, rows: list.length };
}

// The two directions of a trade.
//
// "What of theirs do I need" used to mean my explicit wants plus the gaps in the
// five archetypes I was closest to. That undersells the scan badly: a card they are
// giving away can be the last piece of the sixth-closest deck, or sit in four
// shortfalls at once, and neither showed up. So the whole meta's leverage counts
// here, by the same measure the Next tab uses, and rows are ranked by what they
// unblock rather than by how many spare copies the partner happens to hold.
function tradeMatch(){
  if (!PARTNER) return null;
  const mine = myNeeds();
  const mySpares = new Map(spares().map(s => [s.id, s]));
  const lev = new Map();
  if (DECKS) for (const c of cardLeverage(metaArchetypes(metaPool()))) lev.set(c.id, c);

  const theyGive = [];
  for (const [id, o] of PARTNER.offers){
    const n = mine.get(id);
    const v = lev.get(id);
    if (!n && !v) continue;
    const youNeed = n ? n.qty : v.copies;
    theyGive.push({ card: o.card, qty: Math.min(o.qty, youNeed), theirs: o.qty,
                    youNeed, explicit: o.explicit,
                    why: n ? n.why : `${v.blocks.length} meta deck${v.blocks.length === 1 ? '' : 's'}`,
                    unlocks: v ? v.unlocks : [], reach: v ? v.reach : 0 });
  }
  const youGive = [];
  for (const [id, w] of PARTNER.wants){
    const s = mySpares.get(id);
    if (!s) continue;
    youGive.push({ card: s.card, qty: Math.min(w.qty, s.surplus), theirs: w.qty,
                   yourSpare: s.surplus });
  }
  const byQty = (a, b) => b.qty - a.qty || a.card.n.localeCompare(b.card.n);
  const byValue = (a, b) => b.unlocks.length - a.unlocks.length || b.reach - a.reach || byQty(a, b);
  return { theyGive: theyGive.sort(byValue), youGive: youGive.sort(byQty) };
}

async function scanPartner(user){
  const base = S.syncUrl || DEFAULT_SYNC_URL;
  if (!base) throw new Error('No sync URL configured, so there is nothing to ask.');
  const url = `${base}${base.includes('?') ? '&' : '?'}user=${encodeURIComponent(user)}`;
  const r = await fetch(url, { cache:'no-store' });
  const txt = await r.text();
  if (!r.ok) throw new Error(txt.trim().slice(0, 200) || `HTTP ${r.status}`);
  let payload;
  try { payload = JSON.parse(txt); } catch { throw new Error('That did not come back as JSON.'); }
  // An unknown name comes back as a normal-looking payload with user_id 0 and an
  // empty collection. Say so plainly, rather than showing "no trades" and letting a
  // typo look like a real answer.
  if (!payload.user || !Number(payload.user.user_id))
    throw new Error(`No public profile called "${user}". Check the spelling on their riftbound.gg page.`);
  if (!Array.isArray(payload.collection) || !payload.collection.length)
    throw new Error(`${payload.user.nickname || user} has no public collection to compare against.`);
  PARTNER = readPartner(user, payload);
  return PARTNER;
}

/* ══════════════════════════════════════════════════════════════════════════
   META: tournament decks, and what you can actually build
   ══════════════════════════════════════════════════════════════════════════
   data/decks.json is a snapshot of recent tournament entries from riftbound.gg,
   each with its event and the player's finish. Refresh with
   scripts/build-decks.mjs.

   Buildability is judged by card identity, not by printing, because a deck does
   not care which printing you own:
     - Alt arts, signatures and overnumbers all count as the base card, so a
       list citing UNL-113A is satisfied by owning UNL-113.
     - Basic runes count by name, since Fury Rune is Fury Rune whether it came
       from Origins, Unleashed or Vendetta. Tournament lists lean on this
       heavily: nine copies of one rune is normal.                             */

/* ── bans ─────────────────────────────────────────────────────────────────
   Riot bans outright, so there is no restricted list, and a ban covers the card
   rather than one printing of it. data/banned.json is keyed the same way
   identityOf() keys cards, but each ban is resolved through matchRow anyway so
   the two can never drift apart. Refresh with scripts/build-banned.mjs.        */
let BANNED = new Map();      // identity -> { name, type, formats: [] }
let BANNED_AT = null;

function loadBans(payload){
  BANNED = new Map();
  // Cached legality is keyed off this list, so it cannot outlive a reload of it.
  forgetDeckCaches();
  const add = (entry, format) => {
    const hit = matchRow({ id: entry.code });
    const id = hit ? identityOf(hit.card) : entry.key;
    if (!id) return;
    const e = BANNED.get(id) || { name: entry.name, type: entry.type, formats: [] };
    if (!e.formats.includes(format)) e.formats.push(format);
    BANNED.set(id, e);
  };
  for (const b of payload.constructed || []) add(b, 'constructed');
  for (const [fmt, list] of Object.entries(payload.byFormat || {}))
    for (const b of list) add(b, fmt);
  BANNED_AT = payload.generatedAt || null;
}

function banLabel(card){
  const b = banOf(card);
  if (!b) return '';
  return b.formats.includes('constructed')
    ? 'Banned in sanctioned Constructed'
    : `Banned in ${b.formats.join(' and ')} only`;
}

const banOf = (card) => (card ? BANNED.get(identityOf(card)) : null) || null;
// Banned outright in Constructed, as opposed to only in a side format like 2v2.
const bannedInConstructed = (card) => {
  const b = banOf(card);
  return !!b && b.formats.includes('constructed');
};

// Which banned cards a deck is running, and how many copies.
function deckBans(deck){
  const out = [];
  for (const [code, qty] of Object.entries(deck.cards || {})){
    const hit = matchRow({ id: code });
    if (!hit) continue;
    const b = banOf(hit.card);
    if (b) out.push({ card: hit.card, qty, ban: b });
  }
  return out.sort((a, b) => b.qty - a.qty);
}
const deckLegalForConstructed = (deck) =>
  !deckBansCached(deck).some((x) => x.ban.formats.includes('constructed'));

// A deck's archetype, which is its Legend's name folded through the dash naming. The
// Secret Garden promos are base-set legends under riftbound.gg's `Champion - Epithet`
// spelling, so without this fold Bashful Bloom and Lillia - Bashful Bloom are one
// legend counted as two archetypes, competing against each other for the same slot.
// metaArchetypes and scorePool must both group through this or they disagree.
function archetypeName(deck){
  const raw = deck.ln || '';
  if (!raw) return 'Unidentified';
  if (raw.includes(' - ')){
    const hit = matchRow({ id: deck.lg });
    if (hit && hit.card.t === 'Legend') return gameName(hit.card);
    const comma = raw.replace(' - ', ', ');
    if (NAMES.has(comma)) return comma;
    const tail = raw.slice(raw.indexOf(' - ') + 3);
    if (NAMES.has(tail)) return tail;
  }
  return raw;
}

// The pool every recommendation is drawn from. Sanctioned-legal by default, because
// recommending a deck that cannot be played is worse than recommending fewer. Meta
// and Next both read this, so the ban toggle can never mean two different things.
function metaPool(){
  return S.showIllegal === true ? (DECKS || []) : (DECKS || []).filter(deckLegalForConstructed);
}

/* ── the dash naming ───────────────────────────────────────────────────────
   riftbound.gg writes `Champion - Epithet` where Riot's gallery writes the two
   differently, and the same card therefore reaches this app under two names. The
   ban page already showed this — it writes `Draven - Vanquisher` where the card is
   `Draven, Vanquisher` — and the products Riot does not publish bring it into the
   catalog itself: all six Arcane Box Set units are cards that already exist under a
   comma name, and both Secret Garden legends are base-set legends with the champion
   prepended.

   Guessing from the shape of the name is not safe, because the same separator marks
   something else entirely. `Wuju Bladesman - Starter` is a real, distinct legend and
   a 3.9%-share archetype; stripping its prefix would delete it. So the fold is
   data-driven: try both readings and accept one only if it names a card that really
   exists. Verified over every dash-named card in the catalog, this merges exactly
   the eight it should and leaves all four `- Starter` legends alone.               */
let NAMES = new Set();          // every name in the catalog, for the fold below
let CANON = new Map();          // "type|foldedName" -> the card that name really means
let CHAMPS = new Set();         // every name a card is named after, to spot champion tags
function gameName(card){
  const n = card && card.n;
  if (!n || !n.includes(' - ')) return n || '';
  const comma = n.replace(' - ', ', ');     // Vi - Destructive -> Vi, Destructive
  if (NAMES.has(comma)) return comma;
  const tail = n.slice(n.indexOf(' - ') + 3);   // Lillia - Bashful Bloom -> Bashful Bloom
  if (NAMES.has(tail)) return tail;
  return n;
}

// Base printings win, so a folded name resolves to the real card rather than to
// whichever printing happened to be first.
// Rebuilt whenever the catalog is published, and the place every catalog-derived cache
// is dropped. Putting the invalidation here rather than at the call site means a future
// caller that republishes the catalog cannot forget to do it — which is exactly what
// went wrong first time round, when only boot() knew to clear them.
function buildNameIndex(){
  NAMES = new Set();
  CANON = new Map();
  CHAMPS = new Set();
  CHAMP_INDEX = null;
  COST_BY_ID = null;
  forgetDeckCaches();
  if (!CAT) return;
  for (const c of CAT.cards) NAMES.add(c.n);
  for (const c of CAT.cards){
    const k = c.t + '|' + c.n;
    const prev = CANON.get(k);
    if (!prev || (prev.v && !c.v)) CANON.set(k, c);
    // A champion is a name that cards are named *after*: "Jinx, Rebel" makes Jinx one,
    // while "Zaun" and "Yordle" never appear before a comma and so never qualify. Only
    // the prefix counts, not the whole name — a token is named plainly "Bird", and
    // admitting bare names let Bird pose as the champion of every Shurima bird unit.
    const m = /^(.+?)(?:,| - )/.exec(c.n || '');
    if (m) CHAMPS.add(m[1].trim());
  }
}

function identityOf(card){
  if (!card) return null;
  if (card.t === 'Rune' || card.v === 'rune') return 'rune:' + card.n;
  // Legends fold by name rather than by collector number. Alt arts sit next to their
  // base printing (066a beside 066) so the numeric fold reaches them, but a legend's
  // signature and overnumber are printed at a different number entirely — UNL-189 is
  // base Bashful Bloom and UNL-230* is its signature — so nothing numeric can join
  // them. Left unfolded, owning a legend failed to satisfy a deck citing another of
  // its printings, which inflated 74 of 490 decks by the one card a legend costs.
  if (card.t === 'Legend') return 'legend:' + gameName(card);
  // Anything else reaching us under the dash name is the comma-named card. CANON is
  // prebuilt so this stays a map lookup: identityOf runs per card per deck.
  const canon = gameName(card);
  if (canon !== card.n){
    const twin = CANON.get(card.t + '|' + canon);
    if (twin && twin.c !== card.c) return identityOf(twin);
  }
  const p = splitCode(card.c);
  if (!p) return 'code:' + card.c;
  const coll = normColl(p.seg);
  return `${p.set}|${baseColl(coll) || coll}`;
}

// identity -> copies owned, summed across every printing of that card.
function ownedIdentities(){
  const out = new Map();
  for (const code in S.inv){
    const n = owned(code);
    if (!n) continue;
    const id = identityOf(BY[code]);
    if (id) out.set(id, (out.get(id) || 0) + n);
  }
  return out;
}

// What a deck needs, and what you are short.
/* What a deck asks for, resolved to card identities. This depends only on the deck and
   the catalog, never on what is owned, so it is computed once per deck and kept.

   That caching is the difference between the Meta tab costing 121ms and costing a
   handful. Resolving a list means a matchRow call per card, and evalDeck was doing that
   afresh for all ~480 decks on every render of Meta and Next — and the cost grows
   linearly with the archive, so it was the thing that would eventually make the app
   unusable rather than merely slow. Measured at four times the current archive it was
   856ms a render.

   The cache is dropped whenever the catalog or the ban list is published, which are the
   only two things that can change the answer. */
let DECK_REQ = new Map();     // deck slug -> { needById, unknown }
function deckRequirements(deck){
  const key = deck && deck.s;
  const hit = key && DECK_REQ.get(key);
  if (hit) return hit;
  const needById = new Map();     // identity -> {qty, card}
  const unknown = [];
  for (const [code, qty] of Object.entries(deck.cards || {})){
    const row = matchRow({ id: code });
    if (!row){ unknown.push(code); continue; }
    const id = identityOf(row.card);
    const prev = needById.get(id);
    // A deck runs exactly one Legend, so two printings of it are one slot expressed
    // twice, not two copies to go and buy. Summing them told a list that names both
    // the base and the alt art that it needed two Blade Dancers.
    const one = row.card.t === 'Legend';
    if (prev) prev.qty = one ? Math.max(prev.qty, qty) : prev.qty + qty;
    else needById.set(id, { qty: one ? Math.min(qty, 1) : qty, card: row.card });
  }
  const out = { needById, unknown };
  if (key) DECK_REQ.set(key, out);
  return out;
}

// Which banned cards a deck runs. Also collection-independent, so also kept.
let DECK_BANS = new Map();
function deckBansCached(deck){
  const key = deck && deck.s;
  const hit = key && DECK_BANS.get(key);
  if (hit) return hit;
  const out = deckBans(deck);
  if (key) DECK_BANS.set(key, out);
  return out;
}

function forgetDeckCaches(){ DECK_REQ = new Map(); DECK_BANS = new Map(); ESTABLISHED = null; HIST_NAMES = null; MOVE_CACHE = undefined; }

function evalDeck(deck, have){
  const { needById, unknown } = deckRequirements(deck);
  const missing = [];
  let missingCopies = 0;
  for (const [id, need] of needById){
    const short = need.qty - (have.get(id) || 0);
    if (short > 0){
      missing.push({ card: need.card, need: need.qty, own: have.get(id) || 0, short });
      missingCopies += short;
    }
  }
  missing.sort((a, b) => b.short - a.short || a.card.n.localeCompare(b.card.n));
  return { missing, missingCopies, distinctMissing: missing.length, unknown,
           distinct: needById.size, needById };
}

// One entry per archetype, represented by whichever of its lists you are closest
// to finishing. 250 lists collapse into ~34 rows, which is the difference between
// a page you can read and a wall.
function metaArchetypes(pool){
  const have = ownedIdentities();
  const groups = new Map();
  for (const d of (pool || DECKS || [])){
    const key = archetypeName(d);
    const ev = evalDeck(d, have);
    const bans = deckBansCached(d);
    const illegal = bans.some((x) => x.ban.formats.includes('constructed'));
    const row = { deck: d, ev, bans, illegal };
    const g = groups.get(key);
    if (!g){
      groups.set(key, { name: key, legend: d.lg, lists: 1, tourLists: d.tour ? 1 : 0,
                        illegalLists: illegal ? 1 : 0, rows: [row],
                        best: row, bestPlace: d.pl ?? null, events: new Set([d.ev]) });
    } else {
      g.lists++;
      g.rows.push(row);
      if (d.tour) g.tourLists++;
      if (illegal) g.illegalLists++;
      g.events.add(d.ev);
      if (d.pl != null && (g.bestPlace == null || d.pl < g.bestPlace)) g.bestPlace = d.pl;
      // Closest wins, then the list more people looked at, then the cheaper one. This
      // view is about what you can build, so among lists you are equally close to the
      // representative should be the one others actually play — cheapest alone picked
      // the budget brew (Tier 1 Rengar stood for by a $204/7-view list over a
      // $268/100-view one). That tie is common and the spread inside it is large, so
      // this must match the tie-break in scorePool or the two views quote different
      // decks for the same archetype. Legality is handled by filtering the pool before
      // it gets here, so the "include banned" toggle surfaces those lists instead of
      // having them quietly outranked.
      if (row.ev.missingCopies < g.best.ev.missingCopies ||
          (row.ev.missingCopies === g.best.ev.missingCopies && (
            (d.vw || 0) > (g.best.deck.vw || 0) ||
            ((d.vw || 0) === (g.best.deck.vw || 0) &&
             (d.pr ?? Infinity) < (g.best.deck.pr ?? Infinity))))) g.best = row;
    }
  }
  const total = (DECKS || []).length || 1;
  return [...groups.values()].map((g) => ({ ...g, share: g.lists / total * 100, ...credibility(g), claim: claimedResults(g) }));
}

/* ── a legend's best builds, by lens ──────────────────────────────────────
   Card-similarity clustering was tried and does not produce "tourney / midrange /
   budget" — most legends are one big blob plus a scatter of one-offs. So this is
   three fixed lenses over the legend's lists, deduped by slug: the one people look
   at most, the best competitive finish, and the cheapest one that is not a list
   nobody has looked at.
   A legend with a single real build (or where all three land on it) returns one
   entry, and the caller shows the plain list instead.

   The competitive lens keeps the app's line between a record and a claim. A list
   upstream flagged or gave a place to wins the slot outright, ranked by that place;
   only if none exists does a title claim take it, and then the lens is labelled
   "claimed result", not "tournament", and ranked by the claimed place. A verified
   #28 therefore beats a claimed #1 — 20 of 24 of these are claims, and most name
   events this app's archive has never seen.

   The budget lens is the cheapest priced list *among the more-viewed half* — cutting
   at the median rather than an absolute view count so it scales with a niche legend
   as well as a popular one. Without it, "budget" landed on things like a 7-view
   Rengar brew: cheap, but nobody's word behind it. It only shows when it is at least
   15% under the most-played list; otherwise "budget" is a second row for a deck that
   costs the same.

   Legal lists win the shortlist; if the ban filter leaves none, fall back to all so
   the expansion is never empty. */
function legendPicks(g){
  const legal = (g.rows || []).filter((x) => !x.illegal);
  const pool = legal.length ? legal : (g.rows || []);
  const byV = (a, b) => (b.deck.vw || 0) - (a.deck.vw || 0) ||
                        (a.deck.pr ?? Infinity) - (b.deck.pr ?? Infinity);
  const out = new Map();     // slug -> { row, lenses: [] }
  const add = (x, lens) => {
    if (!x) return;
    const e = out.get(x.deck.s) || { row: x, lenses: [] };
    e.lenses.push(lens);
    out.set(x.deck.s, e);
  };
  const views = pool.map((x) => x.deck.vw || 0).sort((a, b) => a - b);
  const medianVw = views.length ? views[Math.floor((views.length - 1) / 2)] : 0;
  const mostPlayed = pool.slice().sort(byV)[0];
  add(mostPlayed, 'most played');
  const placed = pool.filter((x) => x.deck.tour || x.deck.pl != null)
                     .sort((a, b) => (a.deck.pl ?? 99) - (b.deck.pl ?? 99) || byV(a, b))[0];
  if (placed) add(placed, 'tournament');
  else add(pool.filter((x) => x.deck.cp != null || x.deck.ce)
               .sort((a, b) => (a.deck.cp ?? 99) - (b.deck.cp ?? 99) || byV(a, b))[0], 'claimed result');
  const budget = pool.filter((x) => x.deck.pr > 0 && (x.deck.vw || 0) >= medianVw)
                     .sort((a, b) => a.deck.pr - b.deck.pr || byV(a, b))[0];
  const mpPr = mostPlayed && mostPlayed.deck.pr;
  if (budget && (!(mpPr > 0) || budget.deck.pr <= 0.85 * mpPr)) add(budget, 'budget');
  return [...out.values()];
}

/* ── credibility ───────────────────────────────────────────────────────────
   A binary "was this a tournament deck" treated a 9-player local and a 433-player
   major as the same evidence, which is most of why the README calls the tournament
   half weak. Event sizes now ride on each deck as `ec`, so this can do better.

   Deliberately not a score. A weighted number would need a made-up exchange rate
   between players and recency, and an uninterpretable figure is worse than a crude
   one you can argue with — the same reason there is no per-card price anywhere in
   this app. Instead: how many distinct events the archetype turned up at, how many
   players sat behind them, and when the most recent was. Three numbers you can read.

   Players are summed over distinct events, not over decks. Three lists out of one
   433-player event are one event's worth of evidence, and summing per deck would
   claim 1,299 players of support for it.                                          */
function credibility(g){
  const byEvent = new Map();
  let newest = null;
  for (const row of (g.rows || [])){
    const d = row.deck;
    if (!d.tour || !d.ev) continue;
    if (!byEvent.has(d.ev)) byEvent.set(d.ev, Number(d.ec) || 0);
    if (d.dt && (!newest || d.dt > newest)) newest = d.dt;
  }
  let players = 0;
  for (const n of byEvent.values()) players += n;
  return { evCount: byEvent.size, evPlayers: players, evNewest: newest };
}

/* ── results the flag does not carry ──────────────────────────────────────
   Upstream's tournament flag covers 38 of 475 lists and every one is from July, before
   the Aspirant's Climb ban. Forty-nine more announce a result in their own title —
   "Ornn Wins Barcelona RQ", "Sivir Top 8 S4 Beijing City Challenge" — and not one is
   flagged, so a genuine Top 8 read here as an anonymous brew.

   This is deliberately a second, weaker class and never merged into the first. A claim
   is the author's word, so it is counted separately, labelled as a claim wherever it is
   shown, and given no player count: none of the 47 events named this way appear in the
   tournament archive, and inventing a field size to fill the column is exactly the
   made-up number the credibility figures above refuse to be. It buys one thing — the
   difference between "no evidence" and "says it Top 8'd, unverified" — which is the
   difference between a deck the ranking ignores and one it merely cannot rank. */
function claimedResults(g){
  const events = new Set();
  // Where the claims came from, read off the city in the event's own name. The archive
  // is North American and online, so an archetype claiming results in Asia and Europe
  // is winning somewhere this app can see nothing else about — which is worth saying
  // out loud, and is the whole reason the region is carried onto the deck at all.
  const regions = {};
  let best = null, newest = null, lists = 0, located = 0;
  for (const row of (g.rows || [])){
    const d = row.deck;
    if (d.tour || (d.cp == null && !d.ce)) continue;
    lists++;
    if (d.ce) events.add(d.ce);
    if (d.rg){ regions[d.rg] = (regions[d.rg] || 0) + 1; located++; }
    if (d.cp != null && (best == null || d.cp < best)) best = d.cp;
    if (d.dt && (!newest || d.dt > newest)) newest = d.dt;
  }
  return { lists, best, newest, events: [...events], regions, located };
}

/* North America first, then commonest. Not the raw ranking, deliberately: the archive
   this app can actually verify against is North American, so that is both the scene the
   reader is most likely to be playing in and the only one where a claim could have been
   checked and wasn't. The rest follow by weight. One comparator, used by every surface
   that prints a region, so the Meta note and the archetype rows can never disagree
   about the order. (North America here is the US and Canada — Vancouver and Ottawa both
   land in it.) */
const REGION_FIRST = 'North America';
const byRegionWeight = (a, b) =>
  (b[0] === REGION_FIRST) - (a[0] === REGION_FIRST) || b[1] - a[1];

// "North America 8, Asia 4". Empty when no claim named a place this knows, which is the
// online events and the bare series names.
function claimWhere(c){
  if (!c || !c.located) return '';
  return Object.entries(c.regions).sort(byRegionWeight).map(([r, n]) => `${r} ${n}`).join(', ');
}

// One phrase, so every surface says it the same way and none of them imply a record.
function claimText(c){
  if (!c || !c.lists) return '';
  const what = c.best === 1 ? 'a win' : c.best != null ? `top ${c.best}` : 'a result';
  // The region goes before the caveat, never after: check.mjs asserts this phrase ends
  // in "unverified" so nothing can trail off and soften it.
  const where = claimWhere(c);
  return `${c.lists} list${c.lists === 1 ? '' : 's'} claim${c.lists === 1 ? 's' : ''} ${what}` +
         `${c.events.length ? ` at ${c.events.slice(0, 2).map(esc).join(', ')}${
           c.events.length > 2 ? ` +${c.events.length - 2}` : ''}` : ''}` +
         `${where ? ` (${where})` : ''}, unverified`;
}

/* ── the tier list join ───────────────────────────────────────────────────
   data/tiers.json is riftbound.gg's curated weekly Tier 1-5 list, named by champion.
   This app names archetypes by epithet, so the join is champion -> archetype via the
   legend roster. Master Yi has two legends in two different tiers; the epithet parsed
   from the tier entry's guide slug picks the right one.

   Champion names are matched on their letters alone (Kai'Sa, Rek'Sai, Lee Sin), so a
   stray apostrophe or space in either source does not drop a row. Anything that still
   fails to resolve simply has no tier here — it is not an error, and the Meta tab
   shows the raw list regardless. */
const champKey = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function tierByArchetype(){
  const out = new Map();
  if (!TIERS || !CAT) return out;
  // Only legends someone is actually playing: the tier list ranks ~46 legends and a
  // dozen of them have no list in the snapshot at all, so mapping those would put a
  // key on the result that no consumer can use.
  const played = new Set((DECKS || []).map(archetypeName));
  const byChamp = new Map();                 // champKey -> [archetype name]
  for (const l of legendRoster()){
    if (!l.champ || !played.has(l.name)) continue;
    const k = champKey(l.champ);
    if (!byChamp.has(k)) byChamp.set(k, []);
    if (!byChamp.get(k).includes(l.name)) byChamp.get(k).push(l.name);
  }
  for (const t of TIERS){
    const names = byChamp.get(champKey(t.champion)) || [];
    let name = names[0] || null;
    if (names.length > 1 && t.epithet){
      const hint = t.epithet.toLowerCase();
      name = names.find(n => n.toLowerCase().includes(hint)) || name;
    }
    if (!name) continue;
    const prev = out.get(name);
    if (!prev || t.tier < prev.tier)
      out.set(name, { tier: t.tier, rank: t.rank, guide: t.guide || null, champion: t.champion });
  }
  return out;
}

const TIER_COLOUR = ['', 'var(--good)', 'var(--teal)', 'var(--maize)', 'var(--dimmer)', 'var(--dimmer)'];
const tierBadge = (n) => `<b style="color:${TIER_COLOUR[n] || 'var(--dimmer)'}">Tier ${n}</b>`;

function deckCardsToLocal(deck){
  const out = {};
  for (const [code, qty] of Object.entries(deck.cards || {})){
    const hit = matchRow({ id: code });
    if (hit) out[hit.card.c] = (out[hit.card.c] || 0) + qty;
  }
  return out;
}
function metaDeckText(deck){
  const have = ownedIdentities();
  const ev = evalDeck(deck, have);
  const lines = [deck.h, deck.ev ? `${deck.ev}${deck.pl ? ` · finished #${deck.pl}` : ''}` : '', ''];
  const byType = {};
  for (const [, need] of ev.needById){
    const t = need.card.t || 'Other';
    (byType[t] ??= []).push(need);
  }
  for (const t of TYPES.concat(['Other'])){
    const g = byType[t];
    if (!g) continue;
    lines.push(`${t.toUpperCase()} (${g.reduce((a, x) => a + x.qty, 0)})`);
    for (const x of g.sort((a, b) => a.card.n.localeCompare(b.card.n)))
      lines.push(`  ${x.qty}x ${x.card.n}  ${x.card.c}`);
    lines.push('');
  }
  if (ev.missing.length){
    lines.push(`STILL NEED (${ev.missingCopies})`);
    for (const m of ev.missing) lines.push(`  ${m.short}x ${m.card.n}  ${m.card.c}`);
  }
  return lines.join('\n').trim();
}

const MISSING_SHOWN = 12;
function missingBlock(ev){
  if (!ev.missing.length) return '';
  const shown = ev.missing.slice(0, MISSING_SHOWN);
  const rest = ev.missing.length - shown.length;
  return `<div class="rows" style="margin-top:8px">${shown.map(m => `
    <div class="row">
      ${m.card.i ? `<img class="thumb" loading="lazy" src="${imgURL(m.card, 60)}" alt="" data-zoom="${esc(m.card.c)}">` : ''}
      <span class="nm">${dchips(m.card)} ${esc(m.card.n)}
        <span class="code">${esc(m.card.c)} · ${esc(m.card.t || '')}</span></span>
      <span class="qty need">need ${m.short} of ${m.need}${m.own ? ` · own ${m.own}` : ''}</span>
    </div>`).join('')}</div>${rest > 0 ? `<p class="note" style="margin-top:6px">and ${rest} more
    distinct card${rest === 1 ? '' : 's'}; "Copy list" and "Add missing to wants" cover the whole
    gap.</p>` : ''}`;
}

  const d = (opts && opts.deck) || g.best.deck;

      <a class="ghost" style="text-decoration:none" target="_blank" rel="noopener"
         href="https://riftbound.gg/decks/${esc(d.s)}">View on riftbound.gg</a>

}

            ? `${g.evPlayers.toLocaleString('en-US')}-player field<span class="code"> · last ${

            : g.claim.lists
              ? `<span style="color:var(--maize)">${g.claim.best === 1 ? 'claims a win'
                  : g.claim.best != null ? `claims top ${g.claim.best}` : 'claims a result'}</span><span class="code"> · unverified${
                  claimWhere(g.claim) ? ` · ${esc(claimWhere(g.claim))}` : ''}${
