}

/* ══════════════════════════════════════════════════════════════════════════
   NEXT: what to acquire, and in what order
   ══════════════════════════════════════════════════════════════════════════
   The Meta tab answers "what can I build?". This answers "what do I do next?",
   which is the question riftbound.gg structurally cannot: it knows the cards and
   it knows the decks, but not both at once.

   Everything here turns on overlap. The naive shopping list is the shortfall of
   the single closest deck, which is what the Close section already shows. It is
   usually the wrong list, because a card sitting in six archetypes' shortfalls is
   worth more than a card sitting in one, even when that one deck is closer. So the
   unit of value is not "cards I am missing" but "meta share this card stands in
   front of".                                                                    */

// A deck's requirements do not depend on what you own, so resolve each list once
// and score it against a hypothetical collection as often as the search needs.
// Without this cache the greedy path below re-parses 450 lists on every step.
function reqOf(d){ return deckRequirements(d).needById; }

// Archetypes scored against a hypothetical collection. Same rules as
// metaArchetypes: grouped by Legend, represented by whichever list is closest to
// done. Cheap enough to call once per search step, which metaArchetypes is not.
function scorePool(pool, have){
  const groups = new Map();
  for (const d of pool){
    const key = archetypeName(d);
    let short = 0, distinct = 0, spend = 0, unpriced = 0;
    const costs = costIndex();
    for (const [id, need] of reqOf(d)){
      const s = need.qty - (have.get(id) || 0);
      if (s > 0){
        short += s; distinct++;
        const each = costs.get(id);
        if (each === undefined) unpriced += s; else spend += each * s;
      }
    }
    const g = groups.get(key);
    if (!g) groups.set(key, { name:key, lists:1, short, distinct, deck:d, spend, unpriced });
    else {
      g.lists++;
      // Closest wins, then the more-viewed list, then the cheaper one. Kept identical
      // to metaArchetypes' tie-break: the two must pick the same list per archetype or
      // the Next badge (from here) and the tab (from there) disagree.
      if (short < g.short || (short === g.short && (
            (d.vw || 0) > (g.deck.vw || 0) ||
            ((d.vw || 0) === (g.deck.vw || 0) && (d.pr ?? Infinity) < (g.deck.pr ?? Infinity))))){
        g.short = short; g.distinct = distinct; g.deck = d; g.spend = spend; g.unpriced = unpriced;
      }
    }
  }
  const total = (DECKS || []).length || 1;
  return [...groups.values()].map(g => ({ ...g, share: g.lists / total * 100 }));
}

/* ── what a card costs ─────────────────────────────────────────────────────
   The catalog carries `mp` per printing: what that printing costs in the cheapest
   finish it comes in. Buildability goes by card rather than by printing, though — a
   deck asking for Blade Dancer is satisfied by any printing of it — so the price of a
   *card* is the cheapest of its printings. Which is also the honest answer to "what
   will this cost me", since that is the one you would buy.

   Taking a minimum has a useful side effect. Their foil listings contain obvious junk,
   a Calm Rune priced at $8,888 among it, and a nonsense high price can never win a
   minimum. So no threshold is needed to keep bad data out of the total.

   124 of 1,189 printings carry no price at all. A total covering one of those is a
   floor rather than an estimate, and anything quoting a total says which it is.        */
let COST_BY_ID = null;
function costIndex(){
  if (COST_BY_ID) return COST_BY_ID;
  COST_BY_ID = new Map();
  if (!CAT) return COST_BY_ID;
  for (const c of CAT.cards){
    if (!(c.mp > 0)) continue;
    const id = identityOf(c);
    if (!id) continue;
    const prev = COST_BY_ID.get(id);
    if (prev === undefined || c.mp < prev) COST_BY_ID.set(id, c.mp);
  }
  return COST_BY_ID;
}

const cardCost = (card) => { const id = identityOf(card); return id ? costIndex().get(id) : undefined; };

// The cost of a shortfall, and how much of it is actually priced. Callers need both:
// a total is only as good as its coverage, and saying "$34" while silently skipping
// four unpriced cards would be the kind of confident wrongness this app tries to avoid.
function gapCost(missing){
  let total = 0, priced = 0, unpriced = 0;
  for (const m of (missing || [])){
    const each = cardCost(m.card);
    const n = m.short ?? m.copies ?? 0;
    if (each === undefined){ unpriced += n; continue; }
    total += each * n;
    priced += n;
  }
  return { total, priced, unpriced, complete: unpriced === 0 };
}

// "$34" or "$34+" when part of the gap has no listing, so the plus sign carries the
// caveat instead of a footnote nobody reads.
const cost = (g) => g.priced === 0 && g.unpriced > 0 ? 'no prices'
  : `$${g.total < 10 ? g.total.toFixed(2) : Math.round(g.total).toLocaleString('en-US')}${g.complete ? '' : '+'}`;

const readyShareOf = (scored) => scored.reduce((a, g) => a + (g.short === 0 ? g.share : 0), 0);

/* Which deck to go after next, and there is no single right answer.

   For a long time this was fewest-cards-short first, with the price of the whole list
   as a tie-break. That was the best available: cards short was the only real quantity,
   and list price stood in for what the gap would cost. Per-card prices exist now, so
   the gap can be costed directly, and the substitution changed the answer — badly. On
   one collection the old ordering picked a nine-card gap costing $55 over a fourteen-card
   gap costing $4. Five more cards for fifty-one fewer dollars.

   So neither axis dominates: money is the real constraint, but fifty-six cards is
   fifty-six things to find even if they are commons, and there is no honest exchange
   rate between dollars and that friction. Rather than invent one, both orderings are
   offered and both numbers are always on screen. Cheapest is the default because it is
   the axis you cannot argue with.

   byCost and byCards stay honest: cheapest gap first, or fewest cards first, full stop.
   That is what "within reach for the price I put in" has to mean. The compounding and
   redundancy tie-breaks and the fringe gate live in byPlanTarget, which only the plan
   uses — steering which deck to *commit* to is a different question from listing what a
   budget can afford. */
const byTarget = (a, b) => (S.planBy === 'cards' ? byCards(a, b) : byCost(a, b));

const gapSpend = (x) => x.spend ?? (x.gap ? x.gap.total : 0);
// An unpriced card sorts last within its own bracket rather than counting as free.
const gapUnpriced = (x) => x.unpriced ?? (x.gap ? x.gap.unpriced : 0);

const byCost = (a, b) =>
  gapSpend(a) - gapSpend(b) ||
  gapUnpriced(a) - gapUnpriced(b) ||
  a.short - b.short ||
  b.share - a.share ||
  a.name.localeCompare(b.name);

const byCards = (a, b) =>
  a.short - b.short ||
  gapSpend(a) - gapSpend(b) ||
  b.share - a.share ||
  a.distinct - b.distinct ||
  a.name.localeCompare(b.name);

// The plan's target order, and only the plan's. Near-ties on the chosen axis are broken
// by compounding, not by a dollar or two: within a COST_BRACKET-wide price band (or, in
// cards mode, an exact card count) the archetype whose missing cards other open decks
// also need comes first, since that money does double duty. A deck that mostly reprints
// one you can already build sinks. Everything falls back to byCost / byCards.
const COST_BRACKET = 5;
const costBucketOf = (x) => x.costBucket ?? (gapUnpriced(x) > 0 ? Infinity : Math.round(gapSpend(x) / COST_BRACKET));
const overlapCreditOf = (x) => x.overlapCredit ?? 0;
const isRedundant = (x) => (x.redundantOf ? 1 : 0);

const byPlanTarget = (a, b) => {
  const tier = S.planBy === 'cards'
    ? a.short - b.short
    : costBucketOf(a) - costBucketOf(b);
  return tier ||
    isRedundant(a) - isRedundant(b) ||
    overlapCreditOf(b) - overlapCreditOf(a) ||
    (S.planBy === 'cards' ? byCards(a, b) : byCost(a, b));
};

/* ── established vs fringe ─────────────────────────────────────────────────
   The plan is prescriptive — it tells you to spend money completing a named deck — so
   it must not point at someone's two-list pet brew just because the brew is cheap.

   The obvious gate would be "played recently", but the deck snapshot is a rolling
   60-day window rebuilt daily, so every archetype in it was last seen yesterday and
   recency separates nothing. Tournament recency does separate, but only 9 of 47
   archetypes have any tournament record at all, far too sparse to gate on. What is
   left, and what actually distinguishes a known deck from an experiment, is how many
   distinct lists it has. Four is the knee in the current distribution: 42 archetypes
   clear it, the 5 that do not are starter decks and one-offs (Grandmaster at Arms,
   Blind Monk, The Boss, Keeper of the Hammer, Might of Demacia - Starter).

   Counts every list in the snapshot, banned ones included — "is this a real deck" is a
   property of the archetype, and legality is already handled by the pool filter. So it
   is collection- and pool-independent, cached, and dropped in forgetDeckCaches. */
const ESTABLISHED_MIN_LISTS = 4;
let ESTABLISHED = null;
function establishedArchetypes(){
  if (ESTABLISHED) return ESTABLISHED;
  ESTABLISHED = new Set();
  const lists = new Map(), tour = new Map();
  for (const d of (DECKS || [])){
    const k = archetypeName(d);
    lists.set(k, (lists.get(k) || 0) + 1);
    if (d.tour) tour.set(k, (tour.get(k) || 0) + 1);
  }
  for (const [k, n] of lists)
    if (n >= ESTABLISHED_MIN_LISTS || tour.get(k)) ESTABLISHED.add(k);
  return ESTABLISHED;
}
const isEstablished = (name) => establishedArchetypes().has(name);

/* ── compounding and redundancy ───────────────────────────────────────────
   Annotates each candidate in place with:

   - costBucket    which COST_BRACKET-wide price band its gap falls in
   - overlapCredit the dollar value of its gap cards that at least one *other* candidate
                   is also short of — money that does double duty
   - redundantOf   the name of an archetype you can already build whose list this one
                   mostly reprints (>= REDUNDANT_FRAC of this deck's distinct cards), or null

   `have` is the owned-identity map. `buildable` is the already-finished archetypes to
   test redundancy against; pass none to skip that test. Candidates carry a `deck` (the
   representative list) either way, so this works for both renderNext's rows and the
   planner's. */
const REDUNDANT_FRAC = 0.6;
function annotateCompounding(cands, have, buildable){
  const short = (deck) => {
    const out = [];
    for (const [id, need] of reqOf(deck)){
      const n = need.qty - (have.get(id) || 0);
      if (n > 0) out.push({ id, card: need.card, n });
    }
    return out;
  };
  const gaps = cands.map((c) => short(c.deck));
  const inGaps = new Map();
  for (const g of gaps) for (const m of g) inGaps.set(m.id, (inGaps.get(m.id) || 0) + 1);

  const builtIds = (buildable || []).map((b) => {
    const s = new Set();
    for (const [id] of reqOf(b.deck)) s.add(id);
    return { name: b.name, ids: s };
  });

  cands.forEach((c, i) => {
    let credit = 0;
    for (const m of gaps[i]){
      if ((inGaps.get(m.id) || 0) < 2) continue;
      const each = cardCost(m.card);
      if (each != null) credit += each * m.n;
    }
    c.overlapCredit = credit;
    c.costBucket = gapUnpriced(c) > 0 ? Infinity : Math.round(gapSpend(c) / COST_BRACKET);

    c.redundantOf = null;
    if (builtIds.length){
      const ids = new Set();
      for (const [id] of reqOf(c.deck)) ids.add(id);
      let bestName = null, bestFrac = 0;
      for (const b of builtIds){
        let shared = 0;
        for (const id of ids) if (b.ids.has(id)) shared++;
        const frac = ids.size ? shared / ids.size : 0;
        if (frac > bestFrac){ bestFrac = frac; bestName = b.name; }
      }
      c.redundantFrac = bestFrac;
      if (bestFrac >= REDUNDANT_FRAC) c.redundantOf = bestName;
    }
  });
  return cands;
}

const money = (n) => n == null ? 'price unknown' : '$' + n.toLocaleString('en-US');

// Every card standing between the collection and a deck, with what it costs and
// what it is in the way of. `copies` is the most any one archetype is short, since
// buying that many satisfies all of them at once.
function cardLeverage(arch){
  const out = new Map();
  for (const g of arch){
    if (g.best.ev.missingCopies === 0) continue;
    const sole = g.best.ev.distinctMissing === 1;   // this card is all that is left
    for (const m of g.best.ev.missing){
      const id = identityOf(m.card);
      if (!id) continue;
      const e = out.get(id) || { id, card:m.card, blocks:[], copies:0, reach:0, unlocks:[] };
      e.blocks.push({ name:g.name, share:g.share, short:m.short, gap:g.best.ev.missingCopies });
      e.copies = Math.max(e.copies, m.short);
      e.reach += g.share;
      if (sole) e.unlocks.push(g.name);
      out.set(id, e);
    }
  }
  // Finishing a deck outright ranks first. After that it is how many archetypes are
  // short of the card, not the share they represent: in a meta this flat, "wanted by
  // nine decks" is a real signal and "wanted by 4.3% instead of 3.3%" is noise.
  return [...out.values()].sort((a, b) =>
    b.unlocks.length - a.unlocks.length ||
    b.blocks.length - a.blocks.length ||
    b.reach - a.reach ||
    a.copies - b.copies ||
    a.card.n.localeCompare(b.card.n));
}

/* ── what is already on the way ───────────────────────────────────────────
   The panel form of the same idea, grouped by where a card is coming from. Reads
   against the leverage index so a row can say what it lands, which is the whole
   reason to look at this list rather than at an order confirmation email.       */
function comingList(lev){
  const groups = new Map();
  for (const code in S.inv){
    const q = coming(code);
    if (!q) continue;
    const card = BY[code];
    if (!card) continue;                    // printing left the feed; ignore quietly
    const key = comingFrom(code);
    const g = groups.get(key) || { source: key, rows: [], copies: 0, total: 0, unpriced: 0 };
    const each = cardCost(card);
    const id = identityOf(card);
    const v = lev && id ? lev.get(id) : null;
    g.rows.push({ code, card, qty: q, each,
                  unlocks: v ? v.unlocks : [], blocks: v ? v.blocks : [] });
    g.copies += q;
    if (each === undefined) g.unpriced += q; else g.total += each * q;
    groups.set(key, g);
  }
  for (const g of groups.values())
    g.rows.sort((a, b) => a.card.n.localeCompare(b.card.n) || a.code.localeCompare(b.code));
  // Named sources alphabetically, the unlabelled group last: it is the one you have
  // not got round to naming, so it reads as the loose pile it is.
  return [...groups.values()].sort((a, b) =>
    (a.source ? 0 : 1) - (b.source ? 0 : 1) || a.source.localeCompare(b.source));
}

function comingText(groups){
  if (!groups || !groups.length) return 'ON THE WAY\n\n(nothing on the way)';
  const lines = ['ON THE WAY', ''];
  for (const g of groups){
    lines.push(`── ${(g.source || 'NO SOURCE GIVEN').toUpperCase()}  (${g.rows.length} card${
      g.rows.length === 1 ? '' : 's'}, ${g.copies} cop${g.copies === 1 ? 'y' : 'ies'}${
      g.total ? `, $${g.total.toFixed(2)}${g.unpriced ? '+' : ''}` : ''})`);
    for (const r of g.rows)
      lines.push(`  ${r.qty}x ${r.card.n}  ${r.card.c}` +
                 (r.each !== undefined ? `   $${(r.each * r.qty).toFixed(2)}` : '   (no price)') +
                 (r.unlocks.length ? `   (finishes ${r.unlocks.join(', ')})`
                   : r.blocks.length > 1 ? `   (${r.blocks.length} decks)` : ''));
    lines.push('');
  }
  const copies = groups.reduce((a, g) => a + g.copies, 0);
  const total = groups.reduce((a, g) => a + g.total, 0);
  const unpriced = groups.reduce((a, g) => a + g.unpriced, 0);
  lines.push(`${copies} cop${copies === 1 ? 'y' : 'ies'} across ${
    groups.reduce((a, g) => a + g.rows.length, 0)} distinct cards, $${total.toFixed(2)}${
    unpriced ? ` plus ${unpriced} with no listing` : ''}.`);
  return lines.join('\n');
}

// The screen is not the artefact, the same split the hunt list makes: a phone cannot
// show forty rows across a dozen orders, and "Copy the list" carries every one of them.
// Both caps are layout constants, so this panel's height is fixed by the design rather
// than by how big the parcel was. Overflow is reported as a label in the heading, never
// as another paragraph — the tab is held to a word budget and counts belong in labels.
const COMING_SOURCES_SHOWN = 6;
const COMING_ROWS_SHOWN = 10;

let COMING_NOW = null;
function renderComing(levArr){
  const lev = new Map();
  for (const c of levArr || []) lev.set(c.id, c);
  const groups = comingList(lev);
  COMING_NOW = groups;
  if (!groups.length) return '';
  const copies = groups.reduce((a, g) => a + g.copies, 0);
  const cards = groups.reduce((a, g) => a + g.rows.length, 0);
  const total = groups.reduce((a, g) => a + g.total, 0);
  const unpriced = groups.reduce((a, g) => a + g.unpriced, 0);
  const finishes = [...new Set(groups.flatMap(g => g.rows.flatMap(r => r.unlocks)))];
  return `<div class="panel">
    <h2>ON THE WAY <span class="code">${copies} cop${copies === 1 ? 'y' : 'ies'} · ${
      cards} card${cards === 1 ? '' : 's'} · ${groups.length} source${groups.length === 1 ? '' : 's'}${
      groups.length > COMING_SOURCES_SHOWN ? ` · ${groups.length - COMING_SOURCES_SHOWN} not listed` : ''}</span></h2>
    <p class="note">Already paid for or agreed to, and cleared automatically when an import
      shows them as owned.${total || unpriced ? ` ${cost({ total, priced: copies - unpriced,
        unpriced, complete: !unpriced })} in transit.` : ''}${
      finishes.length ? ` <b style="color:var(--good)">Lands ${esc(finishes.slice(0, 3).join(', '))}${
        finishes.length > 3 ? ` +${finishes.length - 3}` : ''}</b>.` : ''}</p>
    ${(() => { let budget = COMING_ROWS_SHOWN;
      return groups.slice(0, COMING_SOURCES_SHOWN).map(g => {
      const show = g.rows.slice(0, Math.max(0, budget));
      budget -= show.length;
      return `
      <h3 style="margin-top:14px">${g.source ? esc(g.source) : 'No source given'}
        <span class="code">${g.rows.length} card${g.rows.length === 1 ? '' : 's'} · ${g.copies} cop${
          g.copies === 1 ? 'y' : 'ies'}${g.total || g.unpriced ? ` · ${cost({ total: g.total,
          priced: g.copies - g.unpriced, unpriced: g.unpriced, complete: !g.unpriced })}` : ''}${
          g.rows.length > show.length ? ` · ${g.rows.length - show.length} not listed` : ''}</span></h3>
      <div class="rows">${show.map(r => `
        <div class="row">
          ${r.card.i ? `<img class="thumb" loading="lazy" src="${imgURL(r.card, 60)}" alt="" data-zoom="${esc(r.code)}">` : ''}
          <span class="nm">${dchips(r.card)} <b>${r.qty}x</b> ${esc(r.card.n)}
            <span class="code">${esc(r.code)}</span>
            ${r.unlocks.length ? `<span class="code" style="color:var(--good)">finishes ${
              esc(r.unlocks.slice(0, 2).join(', '))}${r.unlocks.length > 2 ? ` +${r.unlocks.length - 2}` : ''}</span>`
              : r.blocks.length > 1 ? `<span class="code">${r.blocks.length} decks want it</span>` : ''}
          </span>
          <input class="src" value="${esc(comingFrom(r.code))}" placeholder="source"
            maxlength="40" data-src="${esc(r.code)}"${READONLY ? ' disabled' : ''}>
          <span class="qty way">${r.each !== undefined
            ? `$${(r.each * r.qty).toFixed(2)}` : 'no price'}</span>
        </div>`).join('')}</div>`; }).join(''); })()}
    <div class="bar-row" style="margin-top:12px">
      <button class="ghost" id="btn-coming-copy">Copy the list</button>
    </div>
  </div>`;
}

/* ── the hunt list ────────────────────────────────────────────────────────
   A different question from "what do I buy next", and it wants a different shape.
   Standing over a bulk box you are not choosing what to acquire, you are looking a
   card up: this one is in my hand, is it on the list. Same when someone posts a
   sale in Discord. That reverses the ordering — leverage is the right rank for a
   shopping list and the wrong one for a lookup, because you cannot scan for a name
   in a list sorted by how many decks want it.

   So: banded by price, alphabetical inside each band. The bands are the useful cut
   because they map onto where a card is actually found. A bulk box is full of the
   under-a-dollar band and will never contain the $20-plus one, so knowing which
   band a name sits in tells you whether to keep looking.

   Everything the collection is short of appears, not the top N. The screen caps each
   band because a phone cannot show four hundred rows, but the copy export does not:
   that is the artefact you paste into Discord or read off in a shop.               */
const HUNT_BANDS = [
  { k: 'bulk', label: 'Under $1',   lo: 0,  hi: 1,        hint: 'what bulk boxes are full of' },
  { k: 'low',  label: '$1 to $5',   lo: 1,  hi: 5,        hint: 'cheap singles' },
  { k: 'mid',  label: '$5 to $20',  lo: 5,  hi: 20,       hint: 'worth asking after' },
  { k: 'high', label: '$20 and up', lo: 20, hi: Infinity, hint: 'chase cards, not bulk' },
  { k: 'none', label: 'No listing', lo: null, hi: null,   hint: 'no market price to compare against' },
];

// cardLeverage ranked by leverage; this re-cuts the same rows by price and name.
function huntList(lev){
  const bands = HUNT_BANDS.map(b => ({ ...b, rows: [], copies: 0, total: 0, unpriced: 0 }));
  const byKey = Object.fromEntries(bands.map(b => [b.k, b]));
  for (const c of lev || []){
    const each = cardCost(c.card);
    const band = each === undefined ? byKey.none
      : byKey[(HUNT_BANDS.find(b => b.lo !== null && each >= b.lo && each < b.hi) || HUNT_BANDS[3]).k];
    // Copies already on the way are not shopping. The row stays visible, because
    // seeing "2 on the way" against a name is exactly what stops you buying it twice,
    // but it does not count towards the band's copies or its total, and a row fully
    // covered never reaches the copy export.
    const inflight = Math.min(comingFor(c.id), c.copies);
    const buy = c.copies - inflight;
    band.rows.push({ ...c, each, inflight, buy, covered: buy === 0 });
    band.copies += buy;
    band.coming = (band.coming || 0) + inflight;
    if (each === undefined) band.unpriced += buy; else band.total += each * buy;
  }
  // Alphabetical, because the lookup is by name. Copies break a tie only so the order
  // is stable between renders.
  for (const b of bands)
    b.rows.sort((x, y) => x.card.n.localeCompare(y.card.n) || y.copies - x.copies);
  return bands.filter(b => b.rows.length);
}

// The artefact you actually take shopping: every card, no screen cap, plain text.
function huntText(bands){
  // This is the artefact you read in a shop, so anything already on the way is left
  // off it entirely rather than listed with a note nobody reads standing over a
  // bulk box. The tally at the end says how many were held back.
  const live = (bands || []).map(b => ({ ...b, rows: b.rows.filter(r => !r.covered) }))
                            .filter(b => b.rows.length);
  const held = (bands || []).reduce((a, b) => a + b.rows.filter(r => r.covered).length, 0);
  if (!live.length) return `CARDS TO GET\n\n(${held
    ? 'everything missing is already on the way' : 'nothing missing'})`;
  const lines = ['CARDS TO GET', ''];
  for (const b of live){
    lines.push(`── ${b.label.toUpperCase()}  (${b.rows.length} card${b.rows.length === 1 ? '' : 's'}, ${
      b.copies} cop${b.copies === 1 ? 'y' : 'ies'}${b.total ? `, ${cost({ total: b.total, priced: 1, unpriced: b.unpriced, complete: !b.unpriced })}` : ''})`);
    for (const r of b.rows)
      lines.push(`  ${String(r.buy)}x ${r.card.n}  ${r.card.c}` +
                 (r.each !== undefined ? `   $${(r.each * r.buy).toFixed(2)}` : '   (no price)') +
                 (r.blocks.length > 1 ? `   (${r.blocks.length} decks)` : ''));
    lines.push('');
  }
  const copies = live.reduce((a, b) => a + b.copies, 0);
  const total = live.reduce((a, b) => a + b.total, 0);
  const unpriced = live.reduce((a, b) => a + b.unpriced, 0);
  lines.push(`${copies} copies across ${live.reduce((a, b) => a + b.rows.length, 0)} distinct cards, ` +
             `$${total.toFixed(2)}${unpriced ? ` plus ${unpriced} with no listing` : ''}.`);
  if (held) lines.push(`${held} more already on the way, left off this list.`);
  return lines.join('\n');
}

// The order to buy in: pick a deck to finish, buy its shortfall, re-score, repeat.
//
// The obvious design is one greedy pass over cards, scoring each by the meta share
// it unblocks. It does not work, and the way it fails is instructive. Any aggregate
// score prefers breadth: a card wanted by eight half-built decks always outscores
// the last card of one. Against the real snapshot that path spent 29 cards without
// finishing a single deck, because "unblocks a deck outright" only becomes a nonzero
// signal at the very last card, far too late to steer anything. Naming a target
// first makes convergence structural rather than something to hope for.
//
// Targeting is by cards short, then by what the list costs, and only then by share.
// Share is last because this meta is flat: 48 archetypes splitting 1-4% of lists
// each, so "most played" separates almost nothing while "cards short" spans 10 to
// 54. Price is second because ties on cards short are not rare, they are the normal
// case, and within a tie price is the axis that actually differs. Against a
// staples-only collection, 15 archetypes tied at exactly 38 cards short, spanning
// $63 to $1352 while their shares spanned 0.4% to 3.9%. Ranking that tie by share
// picked the most expensive deck in it. If a dominant deck ever emerges, share
// becomes worth weighting again and this ranking should be revisited.
//
// What price cannot do is cost the gap itself, because there is no per-card price in
// any of the feeds, only a total per list. Deriving one by decomposing 490 deck
// totals over ~600 unknown cards would produce numbers with error bars far too wide
// to spend money on, so the app quotes the whole list's price and says so. It is
// still the right signal for a tie: an expensive list is expensive because of a few
// chase rares, and those are exactly the cards a partial collection is missing.
//
// Overlap still pays, and now in two places. Between targets: the ordering prefers an
// archetype whose gap other open decks also share (annotateCompounding), so the first
// deck the plan finishes leaves the collection best placed for the next. Within a
// target: the cards that other open archetypes also want come first, so a plan
// abandoned halfway still beats a flat shortfall list.
//
// The plan will not target a fringe brew. Established archetypes are preferred; the
// gate only lifts if nothing established is open, so the plan is never empty when a
// deck could be built.
// `pin` names an archetype the reader chose on the Decks table; it leads the plan and
// the planner picks the rounds after it. `pinDeck` goes one finer — a specific list the
// reader pinned from an archetype's expanded options — and leads round one against that
// exact list's gap rather than the archetype's representative. Without either nothing
// changes, which is what every other caller relies on.
function acquisitionPath(pool, maxDecks, maxSteps, pin, pinDeck){
  const have = new Map(ownedIdentities());
  let scored = scorePool(pool, have);
  let ready = new Set(scored.filter(g => g.short === 0).map(g => g.name));
  const steps = [], targets = [];
  const bought = new Set();     // a later target can want a copy beyond an earlier one
  let cum = 0, truncated = false;

  for (let round = 0; round < (maxDecks || 3); round++){
    const built = scored.filter(g => g.short === 0);
    const allOpen = scored.filter(g => g.short > 0);
    if (!allOpen.length) break;
    const establishedOpen = allOpen.filter(g => isEstablished(g.name));
    const open = establishedOpen.length ? establishedOpen : allOpen;
    annotateCompounding(open, have, built);
    // A pinned list leads round one against its own gap. Built as a target-shaped
    // object rather than one of `open`'s groups, so the identity checks below fall
    // back to a name match.
    let target;
    if (round === 0 && pinDeck){
      let short = 0, distinct = 0;
      for (const [id, need] of reqOf(pinDeck)){
        const s = need.qty - (have.get(id) || 0);
        if (s > 0){ short += s; distinct++; }
      }
      const nm = archetypeName(pinDeck);
      const g0 = scored.find(g => g.name === nm);
      target = { name: nm, deck: pinDeck, short, distinct,
                 share: g0 ? g0.share : 0, lists: g0 ? g0.lists : 1 };
    } else {
      target = (round === 0 && pin && open.find(g => g.name === pin)) ||
               open.slice().sort(byPlanTarget)[0];
    }
    if (!target || !target.short) break;

    const gap = [];
    for (const [id, need] of reqOf(target.deck)){
      const s = need.qty - (have.get(id) || 0);
      if (s > 0) gap.push({ id, card:need.card, copies:s, reach:0, blocks:0 });
    }
    // How many other open archetypes are short of the same card.
    for (const c of gap)
      for (const g of open){
        if (g === target || g.name === target.name) continue;
        const n = reqOf(g.deck).get(c.id);
        if (n && n.qty - (have.get(c.id) || 0) > 0){ c.reach += g.share; c.blocks++; }
      }
    gap.sort((a, b) => b.blocks - a.blocks || b.reach - a.reach || b.copies - a.copies ||
                       a.card.n.localeCompare(b.card.n));

    targets.push({ name:target.name, share:target.share, lists:target.lists,
                   short:target.short, distinct:target.distinct, deck:target.deck,
                   price:target.deck.pr ?? null, steps:gap.length });

    for (const c of gap){
      if (steps.length >= (maxSteps || 24)){ truncated = true; break; }
      // The total that list wants, not just the shortfall, so "add to wants" still
      // reads correctly once some of the copies arrive.
      const need = (have.get(c.id) || 0) + c.copies;
      have.set(c.id, need);
      cum += c.copies;
      scored = scorePool(pool, have);
      const now = new Set(scored.filter(g => g.short === 0).map(g => g.name));
      const gained = [...now].filter(n => !ready.has(n));
      steps.push({ id:c.id, card:c.card, copies:c.copies, need, cum, target:target.name,
                   each: cardCost(c.card),
                   again: bought.has(c.id), blocks:c.blocks, reach:c.reach, unlocked:gained,
                   readyShare: readyShareOf(scored) });
      bought.add(c.id);
      ready = now;
    }
    if (truncated) break;
  }
  return { steps, targets, truncated };
}

// The union of what a set of archetypes is short, which is the number that matters
// when deciding how far three decks really are: their shortfalls overlap heavily,
// so summing them badly overstates the cost.
function unionGap(archs){
  const need = new Map();
  for (const g of archs)
    for (const m of g.best.ev.missing){
      const id = identityOf(m.card);
      if (id) need.set(id, Math.max(need.get(id) || 0, m.short));
    }
  let copies = 0;
  for (const n of need.values()) copies += n;
  return { copies, distinct: need.size, need };
}

function pathText(steps){
  if (!steps || !steps.length) return 'ACQUISITION PLAN\n\n(nothing to buy)';
  const lines = ['ACQUISITION PLAN', ''];
  let target = null;
  for (const s of steps){
    if (s.target !== target){
      target = s.target;
      const t = NEXT_PLAN_TARGETS.find(x => x.name === target);
      lines.push(`── toward ${target}${t ? `  (${t.short} cards short, ${money(t.price)} list)` : ''}`);
    }
    lines.push(`  ${s.copies}x ${s.again ? 'more ' : ''}${s.card.n}  ${s.card.c}` +
               (s.each !== undefined ? `   $${(s.each * s.copies).toFixed(2)}` : '   (no price)') +
               (s.again ? `   (${s.need} in total)` : '') +
               (s.blocks ? `   (${s.blocks} other deck${s.blocks === 1 ? ' wants' : 's want'} it)` : ''));
    if (s.unlocked.length) lines.push(`     -> completes ${s.unlocked.join(', ')}`);
  }
  const g = gapCost(steps.map(x => ({ card: x.card, short: x.copies })));
  lines.push('', `${steps[steps.length - 1].cum} cards, ${cost(g)} in total` +
    (g.complete ? '.' : `, plus ${g.unpriced} card${g.unpriced === 1 ? '' : 's'} with no listing.`));
  return lines.join('\n');
}

// The last plan rendered, so the buttons under it act on exactly what is on screen.
let NEXT_PLAN = [], NEXT_PLAN_TARGETS = [];
let HUNT_BANDS_NOW = null;

/* ══════════════════════════════════════════════════════════════════════════
   NEXT: pick a deck, then buy for it
   ══════════════════════════════════════════════════════════════════════════
   This tab used to answer "which deck next" four times over — a headline target by
   cheapest gap, a tier ranking, a cost ranking, and whatever the plan committed to —
   and then spent two hundred words explaining why the four disagreed. Measured against
   the rest of the app that was 894 words of prose to carry 62 rows; Legends does 97
   rows in 185. The rankings were never wrong, there were just four of them in four
   panels, so the reader had to arbitrate.

   One ranking now, re-sorted rather than repeated: every archetype is one row in one
   table, and the sort control says which question you are asking of it. Tier is "what
   is the best deck", cost is "what is cheapest to finish", closest is "what is nearest
   to done", ready is "what can I play tonight". They still disagree — that was the
   honest part — but disagreeing orderings of one list is a sort, not four panels.

   Picking a row pins the plan to that deck, so the buy list underneath is for the deck
   you chose rather than the one the planner would have. That is the whole loop this
   tab exists for: pick, see the gap, buy it down.                                     */
function renderNext(){
  const host = document.getElementById('v-next');
  if (!DECKS){
    host.innerHTML = `<div class="panel"><h2>BUILD NEXT</h2><p class="note">No deck snapshot yet, so there is
      nothing to plan against. Run <code>node scripts/build-decks.mjs</code>.</p></div>`;
    return;
  }
  const pool = metaPool();
  const arch = metaArchetypes(pool);
  const have = new Map(ownedIdentities());
  const tierMap = tierByArchetype();
  const noBuy = new Set(S.noBuy || []);
  const heldLegends = new Set(legendRoster().filter(l => l.held).map(l => l.name));
  const budget = Number(S.nearSpend) > 0 ? Number(S.nearSpend) : null;

  const keptMissing = (missing) => (missing || []).filter(m => !noBuy.has(m.card.n));
  const gapExcl = (missing) => {
    const kept = keptMissing(missing);
    const g = gapCost(kept);
    return { ...g, short: kept.reduce((a, m) => a + (m.short ?? m.copies ?? 0), 0),
             cut: (missing || []).length - kept.length };
  };
  // Where the money is: the cheap bulk and the spikes, so a $150 gap that is $130 of
  // one card reads as exactly that. Clicking a spike blacklists it.
  const gapBreak = (missing) => {
    const kept = keptMissing(missing).map(m => ({ n: m.card.n, q: m.short ?? m.copies ?? 0, p: cardCost(m.card) }))
      .filter(x => x.q > 0);
    const spikes = kept.filter(x => x.p != null && x.p >= 8).sort((a, b) => b.p * b.q - a.p * a.q);
    const rest = kept.filter(x => !(x.p != null && x.p >= 8));
    const restCost = rest.reduce((a, x) => a + (x.p || 0) * x.q, 0);
    const restUnpriced = rest.reduce((a, x) => a + (x.p == null ? x.q : 0), 0);
    const bits = [];
    if (rest.length) bits.push(`${money(Math.round(restCost))}${restUnpriced ? '+' : ''} in ${rest.length} cheap card${rest.length === 1 ? '' : 's'}`);
    for (const s of spikes.slice(0, 2))
      bits.push(`<span data-nobuy-card="${esc(s.n)}" style="cursor:pointer;text-decoration:underline dotted" title="never recommend a deck needing this">${esc(s.n)}${s.q > 1 ? ` ×${s.q}` : ''} @ ${money(Math.round(s.p))}</span>`);
    return bits.join(' + ');
  };
  const compTag = (deck) => {
    const by = { Unit: 0, Spell: 0, Gear: 0 }; let n = 0;
    for (const [, need] of reqOf(deck)){ if (need.card.t in by){ by[need.card.t] += need.qty; n += need.qty; } }
    if (!n) return '';
    if (by.Gear / n >= 0.22) return 'gear engine';
    if (by.Spell / n >= 0.45) return 'spell combo-tempo';
    if (by.Unit / n >= 0.55) return 'unit midrange';
    return 'mixed';
  };

  /* ── one row per archetype ────────────────────────────────────────────────
     Tiered and untiered together, because the split into "on the tier list" and
     "everything else" was two tables for one question. An archetype nobody has
     ranked still has a gap and a price, and hiding it behind a sentence at the
     bottom of a panel made it invisible rather than deprioritised.                  */
  const pickList = S.pickList || null;
  let rows = arch.map(g => {
    const t = tierMap.get(g.name) || null;
    // A list pinned from this archetype's expanded options overrides its representative
    // for the whole row — the gap, the price, the shape, the buy plan below.
    const chosen = (pickList && g.rows.find(x => x.deck.s === pickList)) || g.best;
    const ev = chosen.ev;
    const gap = gapExcl(ev.missing);
    return {
      g, name: g.name, deck: chosen.deck, chosenEv: ev,
      pinnedList: chosen !== g.best ? chosen.deck.s : null,
      champion: t ? t.champion : null, tier: t ? t.tier : null,
      rank: t ? t.rank : 99, guide: t ? t.guide : null,
      gap, short: gap.short, buildable: gap.short === 0 && gap.unpriced === 0,
      distinct: ev.distinctMissing, breakdown: gapBreak(ev.missing), shape: compTag(chosen.deck),
      ownLegend: heldLegends.has(g.name), listPrice: chosen.deck.pr ?? null,
      bestPlace: g.bestPlace, claim: g.claim, lists: g.lists, share: g.share,
      established: isEstablished(g.name),
      fits: !budget || (gap.unpriced === 0 && gap.total <= budget) || gap.short === 0,
    };
  });
  if (S.ownLegendOnly) rows = rows.filter(r => r.ownLegend);

  // The compounding credit and the redundancy flag, computed on the open archetypes and
  // mapped back on, so a row can say a gap does double duty without a second table.
  const openCand = rows.filter(r => r.short > 0).map(r => ({
    name: r.name, short: r.short, distinct: r.distinct, share: r.share, lists: r.lists,
    deck: r.deck, gap: gapCost(r.chosenEv.missing), established: r.established,
  }));
  annotateCompounding(openCand, have, rows.filter(r => r.buildable).map(r => ({ name: r.name, deck: r.deck })));
  const compBy = new Map(openCand.map(c => [c.name, c]));
  for (const r of rows){
    const c = compBy.get(r.name);
    r.overlapCredit = c ? c.overlapCredit : 0;
    r.redundantOf = c ? c.redundantOf : null;
  }

  /* ── the four questions, as sorts ─────────────────────────────────────────
     Unpriced gaps sort after priced ones everywhere: a figure that is a floor cannot
     be compared against one that is not, so it goes last rather than pretending to a
     position it has not earned.                                                      */
  const SORTS = {
    tier:    (a, b) => (a.tier ?? 99) - (b.tier ?? 99) || a.gap.unpriced - b.gap.unpriced ||
                       a.gap.total - b.gap.total || a.rank - b.rank || a.name.localeCompare(b.name),
    cost:    (a, b) => a.gap.unpriced - b.gap.unpriced || a.gap.total - b.gap.total ||
                       a.short - b.short || a.name.localeCompare(b.name),
    closest: (a, b) => a.short - b.short || a.gap.unpriced - b.gap.unpriced ||
                       a.gap.total - b.gap.total || a.name.localeCompare(b.name),
    ready:   (a, b) => (a.buildable ? 0 : 1) - (b.buildable ? 0 : 1) || (a.tier ?? 99) - (b.tier ?? 99) ||
                       a.gap.total - b.gap.total || a.name.localeCompare(b.name),
  };
  const SORT_LABEL = { tier: 'best deck', cost: 'cheapest gap', closest: 'fewest cards', ready: 'ready now' };
  const sortKey = SORTS[S.deckSort] ? S.deckSort : 'tier';
  rows.sort(SORTS[sortKey]);

  /* ── the deck this tab is about ───────────────────────────────────────────
     The reader's pick if they made one, otherwise the planner's. Pinning it into
     acquisitionPath is what makes the buy list below belong to this deck rather than
     to whichever deck the planner would have chosen on its own.                      */
  const pickedRow = (pickList && rows.find(r => r.pinnedList === pickList))
                 || (S.pick && rows.find(r => r.name === S.pick)) || null;
  const plan = acquisitionPath(pool, 3, 24,
    pickedRow && !pickedRow.buildable ? pickedRow.name : null,
    pickedRow && pickedRow.pinnedList && !pickedRow.buildable ? pickedRow.deck : null);
  const steps = plan.steps;
  NEXT_PLAN = steps;
  NEXT_PLAN_TARGETS = plan.targets;
  const target = pickedRow ||
    (plan.targets[0] && rows.find(r => r.name === plan.targets[0].name)) ||
    rows.find(r => !r.buildable) || rows[0] || null;

  const buildableAll = rows.filter(r => r.buildable);
  const lev = cardLeverage(arch);
  const LEV_SHOWN = 14;
  // Sorting is the point of this table, so it has to be long enough that re-sorting
  // visibly moves things. The overflow is a count and a few names, not a priced
  // comma-run: thirty-five decks on one line was data nobody could read.
  const ROWS_SHOWN = 20;
  const shown = rows.slice(0, ROWS_SHOWN);
  const rest = rows.slice(ROWS_SHOWN);

  const buyFor = ['anyway', 'hunt'].includes(S.buyFor) ? S.buyFor : 'deck';
  const hunt = buyFor === 'hunt' ? huntList(lev) : null;
  HUNT_BANDS_NOW = hunt;
  const HUNT_PER_BAND = 10;
  const mySteps = target ? steps.filter(s => s.target === target.name) : [];
  const offers = PARTNER ? PARTNER.offers : null;
  const gettable = offers ? steps.filter(s => offers.has(s.id)) : [];
  const mustBuy  = offers ? steps.filter(s => !offers.has(s.id)) : [];

  const levRow = (c) => `
    <div class="row">
      ${c.card.i ? `<img class="thumb" loading="lazy" src="${imgURL(c.card, 60)}" alt="" data-zoom="${esc(c.card.c)}">` : ''}
      <span class="nm">${dchips(c.card)} ${esc(c.card.n)}
        <span class="code">${esc(c.card.c)} · need ${c.copies}</span>
        ${c.unlocks.length ? `<span class="code" style="color:var(--good)">
          finishes ${esc(c.unlocks.slice(0, 2).join(', '))}${c.unlocks.length > 2 ? ` +${c.unlocks.length - 2}` : ''}</span>` : ''}
        ${offers && offers.has(c.id) ? `<span class="code" style="color:var(--teal)">${esc(PARTNER.user)} has ${offers.get(c.id).qty}</span>` : ''}
      </span>
      <span class="qty${c.unlocks.length ? '' : ' need'}">${
        cardCost(c.card) !== undefined ? `$${(cardCost(c.card) * c.copies).toFixed(2)}` : 'no price'
      }<span class="code"> · ${c.blocks.length} deck${c.blocks.length === 1 ? '' : 's'}</span></span>
    </div>`;

  const stepRow = (s, i) => `
    <div class="row">
      <span class="code" style="width:22px;flex:none;text-align:right">${i + 1}</span>
      ${s.card.i ? `<img class="thumb" loading="lazy" src="${imgURL(s.card, 60)}" alt="" data-zoom="${esc(s.card.c)}">` : ''}
      <span class="nm">${dchips(s.card)} <b>${s.copies}x</b>${s.again ? ' more' : ''} ${esc(s.card.n)}
        <span class="code">${esc(s.card.c)}${s.again ? ` · ${s.need} in total` : ''}</span>
        ${s.unlocked.length
          ? `<span class="code" style="color:var(--good)">completes ${esc(s.unlocked.join(', '))}</span>`
          : s.blocks ? `<span class="code">${s.blocks} other deck${s.blocks === 1 ? ' wants' : 's want'} it</span>`
          : `<span class="code">this deck only</span>`}
        ${offers && offers.has(s.id) ? `<span class="code" style="color:var(--teal)">tradeable from ${esc(PARTNER.user)}</span>` : ''}
      </span>
      <span class="qty${s.unlocked.length ? '' : ' need'}">${
        s.each !== undefined ? `$${(s.each * s.copies).toFixed(2)}` : 'no price'}<span class="code"> · ${
        s.cum} cards in</span></span>
    </div>`;

  // How many of a legend's lists an expansion shows. A row opened on its own shows the
  // lot (capped); "expand all" opens every row at once, so it shows fewer each to keep
  // the page from becoming a wall.
  const EXP_CAP = 12, EXP_CAP_ALL = 6;
  const expanded = (name) => !!S.expandAll || (S.expand || []).includes(name);

  // A deck someone re-entered from another player's list — the slug carries the "copy"
  // dotgg stamps on it. riftbound.gg often has no public page for these, so the link
  // is flagged rather than trusted.
  const fanCopy = (s) => /-copy(-|$)/.test(s || '');

  // One line for a list inside an expansion — used for the named picks and for the
  // full roll below them. `label` set marks it a pick; unset, it is a roll row and
  // gets the "default" marker if it is the archetype's representative.
  const listLine = (x, best, pinSlug, label) => {
    const d = x.deck, isPin = d.s === pinSlug, copy = fanCopy(d.s);
    return `<div class="row" style="${isPin ? 'background:var(--panel2);' : ''}">
      <span class="nm">${label ? `<b style="color:var(--maize)">${label}</b> ` : ''}${esc(d.h || d.s)}
        <span class="code">${d.vw || 0} view${d.vw === 1 ? '' : 's'} · ${
          d.pr ? money(d.pr) : 'no price'} · ${x.ev.missingCopies === 0
            ? '<b style="color:var(--good)">ready</b>' : `${x.ev.missingCopies} short`}${
          d.pl != null ? ` · #${d.pl}` : d.cp != null ? ` · top ${d.cp} claimed` : ''}${
          !label && d.s === best ? ' · default' : ''}${
          copy ? ' · <span title="re-entered from another player\'s list; riftbound.gg may have no page for it">fan copy</span>' : ''}${
          x.illegal ? ' · <span style="color:var(--bad)">not legal</span>' : ''}</span>
        <a href="https://riftbound.gg/decks/${esc(d.s)}" target="_blank" rel="noopener" class="code" style="color:${
          copy ? 'var(--dim)' : 'var(--teal)'}">list ↗</a>
      </span>
      <span class="qty"><button class="chip" data-pick-list="${esc(d.s)}" aria-pressed="${isPin}">${
        isPin ? 'pinned ✕' : 'pin'}</button></span>
    </div>`;
  };

  const listBlock = (r) => {
    const cap = S.expandAll ? EXP_CAP_ALL : EXP_CAP;
    const best = r.g.best.deck.s, pin = S.pickList || '';
    const picks = legendPicks(r.g);
    const lists = r.g.rows.slice().sort((a, b) => (b.deck.vw || 0) - (a.deck.vw || 0) ||
      (a.deck.pr ?? Infinity) - (b.deck.pr ?? Infinity) || (a.deck.s || '').localeCompare(b.deck.s || ''));
    return `<div data-expand-for="${esc(r.name)}" class="rows"
        style="margin:1px 0 8px 20px;border-left:2px solid var(--line2);padding-left:10px">
      ${picks.length > 1 ? picks.map(p => listLine(p.row, best, pin, p.lenses.join(' · '))).join('')
        + `<p class="note" style="margin:3px 0">— every list, most viewed first —</p>` : ''}
      ${lists.slice(0, cap).map(x => listLine(x, best, pin, null)).join('')}
      ${lists.length > cap ? `<p class="note" style="margin:4px 0 0">+${lists.length - cap} more,
        fewer views — <a href="https://riftbound.gg/decks/" target="_blank" rel="noopener" style="color:var(--teal)">browse on riftbound.gg</a></p>` : ''}
    </div>`;
  };

  // One row per archetype. Everything that used to be a sentence under a panel is a
  // column or a tooltip here, so the table carries the detail without the prose.
  const deckRow = (r) => `
    <div class="row" data-pick="${esc(r.name)}" style="cursor:pointer;${r.fits ? '' : 'opacity:.5;'}${
        target && r.name === target.name ? 'background:var(--panel2)' : ''}">
      <span class="nm">${target && r.name === target.name
          ? '<b style="color:var(--good)">&#9656;</b> ' : '<span style="display:inline-block;width:0.9em"></span>'
        }${r.ownLegend ? '<b style="color:var(--good)" title="you own the legend">●</b> ' : ''}${
        r.tier ? tierBadge(r.tier) : '<span class="code" title="not on the tier list">untiered</span>'}
        <b style="color:var(--cream)">${esc(r.champion || r.name)}</b>${moveChip(r.name)}
        <span class="code">${r.champion ? `${esc(r.name)} · ` : ''}${r.shape}${
          r.bestPlace != null ? ` · best #${r.bestPlace}` : ''} · <span data-expand="${esc(r.name)}"
            style="cursor:pointer;text-decoration:underline dotted" title="most-played, tournament and budget builds, then every list">${
            (() => { const p = legendPicks(r.g).length;
              return p > 1 ? `${p} picks in ${r.lists} lists` : `${r.lists} list${r.lists === 1 ? '' : 's'}`; })()
            } ${expanded(r.name) ? '▾' : '▸'}</span>${
          r.established ? '' : ' · fringe'}${
          !r.g.evCount && !(r.claim && r.claim.best != null) ? ' · no tournament record' : ''}${
          r.pinnedList ? ' · <span style="color:var(--good)">list pinned</span>' : ''}</span>${
        r.bestPlace == null && r.claim && r.claim.best != null
          ? ` <span class="code" style="color:var(--maize)" title="${esc(claimText(r.claim))}">claims ${
