<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound Collection — Jay Egger</title>
<meta name="description" content="A personal Riftbound TCG collection manager: owned counts by finish, set completion, trade haves and wants, and deck lists checked against the collection.">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111822'/%3E%3Cpath d='M16 4l9 6v12l-9 6-9-6V10z' fill='none' stroke='%233caea3' stroke-width='2.5'/%3E%3C/svg%3E">

<style>
@font-face{font-family:'Press Start 2P';src:url('fonts/press-start-2p.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Syne Mono';src:url('fonts/syne-mono.woff2') format('woff2');font-display:swap}

:root{
  --bg:#111822; --bg2:#0c121a; --panel:#18212e; --panel2:#1e2937;
  --line:#2a3646; --line2:#374556;
  --ink:#e8edf4; --dim:#93a1b3; --dimmer:#6a7787;
  --cream:#f6f0e9; --burnt:#bf5700; --teal:#3caea3; --maize:#f7c948; --inflight:#a78bfa;
  --good:#4ade80; --warn:#fcd34d; --bad:#f87171;
  --fury:#e5484d; --calm:#48c78e; --mind:#4cb3e5;
  --body:#d9a05b; --chaos:#a87fe0; --order:#f7c948; --colorless:#8a93a0;
  --pixel:'Press Start 2P',monospace; --head:'Syne Mono',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--teal)}

.wrap{max-width:1400px;margin:0 auto;padding:0 16px 80px}

/* ── masthead ─────────────────────────────────────────── */
.mast{padding:26px 0 14px;border-bottom:1px solid var(--line)}
.mast-top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--pixel);font-size:15px;line-height:1.6;margin:0;color:var(--cream)}
h1 .rb{color:var(--teal)}
.sub{font-family:var(--head);color:var(--dim);font-size:13px;margin:6px 0 0}
.mast-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);font-family:var(--head)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dimmer);flex:none}

.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim);border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--head)}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.ghost.on{border-color:var(--teal);color:var(--bg);background:var(--teal)}

/* ── tabs ─────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;margin:16px 0 0;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;
  padding:8px 16px;font-family:var(--pixel);font-size:10px;color:var(--dim);position:relative;top:1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--panel);color:var(--maize);border-color:var(--line2)}
.tab .n{color:var(--dimmer);font-size:9px;margin-left:6px}

/* ── filter bar ───────────────────────────────────────── */
.bar{background:var(--panel);border:1px solid var(--line2);border-top:none;border-radius:0 0 8px 8px;
  padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:8px 11px}
.search:focus{outline:none;border-color:var(--teal)}
select{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:13px}
select:focus{outline:none;border-color:var(--teal)}
.lbl{font-family:var(--head);font-size:11px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.08em}

.chip{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--dim)}
.chip:hover{border-color:var(--dim);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--panel2);color:var(--ink);border-color:currentColor}
.chip.d-fury[aria-pressed=true]{color:var(--fury)} .chip.d-calm[aria-pressed=true]{color:var(--calm)}
.chip.d-mind[aria-pressed=true]{color:var(--mind)} .chip.d-body[aria-pressed=true]{color:var(--body)}
.chip.d-chaos[aria-pressed=true]{color:var(--chaos)} .chip.d-order[aria-pressed=true]{color:var(--order)}
.chip.d-colorless[aria-pressed=true]{color:var(--colorless)}

.count-line{font-family:var(--head);font-size:12px;color:var(--dim)}
.count-line b{color:var(--maize);font-weight:normal}

/* ── card grid ────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .12s}
.card.has{border-color:#2f5c56}
.card.want{box-shadow:inset 3px 0 0 var(--maize)}
.card-img{position:relative;aspect-ratio:744/1039;background:var(--bg2);cursor:zoom-in}
.card-img.land{aspect-ratio:1039/744}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:5px;right:5px;background:rgba(8,12,18,.9);color:var(--teal);
  border:1px solid var(--teal);border-radius:11px;font-family:var(--head);font-size:11px;padding:1px 7px}
.vtag{display:inline-block;border-radius:4px;font-family:var(--head);font-size:9px;
  padding:1px 5px;text-transform:uppercase;letter-spacing:.06em;background:rgba(8,12,18,.9);border:1px solid;
  white-space:nowrap;vertical-align:1px}
.card-img .vtag{position:absolute;top:5px;left:5px}
.v-alt{color:var(--mind);border-color:var(--mind)} .v-sig{color:var(--maize);border-color:var(--maize)}
.v-over{color:var(--burnt);border-color:var(--burnt)} .v-token,.v-rune,.v-promo{color:var(--dim);border-color:var(--line2)}
.v-ban{color:var(--bad);border-color:var(--bad)}
.card-body{padding:7px 8px 8px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-name{font-family:var(--head);font-size:12.5px;line-height:1.25;color:var(--cream);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{font-size:10px;color:var(--dimmer);font-family:var(--head);display:flex;gap:5px;flex-wrap:wrap}
.ttag{display:inline-block;font-family:var(--head);font-size:9px;padding:1px 5px;border-radius:3px;
  background:#2b2140;color:#c9b2ee;border:1px solid #47376a;white-space:nowrap;vertical-align:1px}
.dchip{width:9px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px}

/* steppers */
.qs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:auto}
.q{display:flex;flex-direction:column;align-items:center;gap:1px}
.q span{font-family:var(--head);font-size:8.5px;color:var(--dimmer);text-transform:uppercase}
.q input{width:100%;text-align:center;background:var(--bg2);border:1px solid var(--line);
  border-radius:4px;padding:3px 1px;font-size:12px;font-family:var(--head);-moz-appearance:textfield}
.q input::-webkit-outer-spin-button,.q input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.q input:focus{outline:none;border-color:var(--teal)}
.q input.set{border-color:var(--teal);color:var(--teal)}
.q.w input.set{border-color:var(--maize);color:var(--maize)}
.q.t input.set{border-color:var(--burnt);color:#e58a3c}
.q.o input.set{border-color:var(--inflight);color:var(--inflight)}
.row input.src{width:118px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;
  padding:3px 6px;font-family:var(--head);font-size:10.5px;color:var(--ink)}
.row input.src:focus{outline:none;border-color:var(--inflight)}
.row input.src::placeholder{color:var(--dimmer)}
.row .qty.way{color:var(--inflight)}
.row.covered{opacity:.55}
.row.covered .nm{text-decoration:line-through}

/* ── table view ───────────────────────────────────────── */
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th{background:var(--panel2);font-family:var(--head);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--dim);text-align:left;padding:8px 9px;position:sticky;top:0;z-index:2}
td{padding:5px 9px;border-top:1px solid var(--line)}
tbody tr:hover{background:var(--panel)}
td.num{text-align:center;width:56px}
td .qi{width:46px;text-align:center;background:var(--bg2);border:1px solid var(--line);
  border-radius:4px;padding:3px;font-family:var(--head);-moz-appearance:textfield}
td .qi::-webkit-outer-spin-button,td .qi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
td .qi:focus{outline:none;border-color:var(--teal)}
td .qi.set{border-color:var(--teal);color:var(--teal)}
.code{font-family:var(--head);font-size:11.5px;color:var(--dimmer);white-space:nowrap}
.thumb{width:30px;height:42px;object-fit:cover;border-radius:3px;background:var(--bg2);cursor:zoom-in;display:block}

/* ── panels / meters ──────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:14px}
.panel h2{font-family:var(--pixel);font-size:11px;margin:0 0 12px;color:var(--maize);line-height:1.6}
.panel h3{font-family:var(--head);font-size:14px;margin:0 0 8px;color:var(--cream)}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.meter{margin-bottom:14px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.meter-name{font-family:var(--head);font-size:13px;color:var(--cream)}
.meter-val{font-family:var(--head);font-size:12px;color:var(--dim)}
.meter-val b{color:var(--teal);font-weight:normal}
.track{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--maize));border-radius:5px;transition:width .3s}
.meter-sub{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-family:var(--head);font-size:10.5px;color:var(--dimmer)}
.meter-sub b{color:var(--dim);font-weight:normal}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.stat .v{font-family:var(--pixel);font-size:16px;color:var(--teal);line-height:1.4}
.stat .k{font-family:var(--head);font-size:10.5px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ── lists (trade / decks) ────────────────────────────── */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:9px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.row:first-child{border-top:none}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .qty{font-family:var(--head);color:var(--teal);white-space:nowrap}
.row .qty.need{color:var(--maize)}
.empty{color:var(--dimmer);font-size:13px;font-style:italic;padding:8px 0}
.setgroup{font-family:var(--head);font-size:11px;color:var(--burnt);text-transform:uppercase;
  letter-spacing:.08em;margin:14px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--line2)}
.setgroup:first-child{margin-top:0}

.deck-list{display:flex;flex-direction:column;gap:8px}
.deck-item{display:flex;gap:9px;align-items:center;background:var(--bg2);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px}
.deck-item.sel{border-color:var(--teal)}
.deck-item .dn{flex:1;font-family:var(--head);font-size:13.5px;color:var(--cream);cursor:pointer;min-width:0}
.deck-item .dm{font-family:var(--head);font-size:11px;color:var(--dimmer)}
.txt{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;
  font-family:var(--head);font-size:12.5px;color:var(--ink);resize:vertical;min-height:64px}
.pre{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:11px;
  font-family:var(--head);font-size:12px;white-space:pre-wrap;color:var(--dim);max-height:340px;overflow:auto}

.ac{position:relative}
.ac-out{position:absolute;left:0;right:0;top:calc(100% + 3px);background:var(--panel2);border:1px solid var(--line2);
  border-radius:7px;z-index:30;max-height:280px;overflow:auto;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.ac-item{display:flex;gap:8px;align-items:center;padding:6px 9px;cursor:pointer;border-top:1px solid var(--line)}
.ac-item:first-child{border-top:none}
.ac-item:hover,.ac-item.cur{background:var(--panel)}
.ac-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}

/* ── lightbox ─────────────────────────────────────────── */
.lb{position:fixed;inset:0;background:rgba(6,9,13,.93);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:22px;cursor:zoom-out}
.lb img{max-width:min(94vw,560px);max-height:92vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.lb-info{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-family:var(--head);
  font-size:12px;color:var(--dim);padding:0 20px}

.sentinel{height:1px}
.loading{padding:70px 0;text-align:center;font-family:var(--head);color:var(--dim)}
.note{font-size:12px;color:var(--dimmer);font-family:var(--head);line-height:1.6}
.hide{display:none !important}
footer{border-top:1px solid var(--line);margin-top:30px;padding:16px 0;font-family:var(--head);
  font-size:11px;color:var(--dimmer);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}

/* Nothing may push the page wider than the phone it is being read on. The filter
   row is the usual offender: a search input with a min-width plus four selects
   that refuse to shrink. */
body{overflow-x:hidden}
@media(max-width:640px){
  .wrap{padding:0 10px 70px}
  h1{font-size:11px;letter-spacing:-.02em}
  .sub{font-size:11.5px}
  .tab{padding:7px 9px;font-size:9px}
  .tabs{gap:1px}

  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
  .panel{padding:12px}
  .bar{padding:10px;gap:8px}
  .bar-row{gap:6px}
  .search{min-width:0;flex:1 1 100%}
  select{flex:1 1 44%;min-width:0;font-size:12.5px}
  #f-view{flex:1 1 100%}
  .count-line{flex:1 1 auto}

  .cols{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px}
  .stat{padding:9px 10px}
  .stat .v{font-size:13px}
  .stat .k{font-size:9.5px}

  .qs{gap:2px}
  .q span{font-size:7.5px}
  .q input{font-size:13px;padding:4px 1px}   /* stays tappable */
  .row{padding:7px 0}
  .row .qty{font-size:11.5px;text-align:right}
  .meter-sub{gap:8px;font-size:10px}
  table{min-width:560px}
  .pre{font-size:11px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="mast-top">
      <div>
        <h1><span class="rb">RIFTBOUND</span> COLLECTION</h1>
        <p class="sub" id="sub">loading catalog…</p>
      </div>
      <div class="mast-tools">
        <span class="sync" id="fresh" title=""><span class="dot" id="fresh-dot"></span><span id="fresh-txt"></span></span>
        <span class="sync"><span class="dot" id="dot"></span><span id="sync-txt">local</span></span>
        <button class="ghost" id="btn-export">Backup</button>
        <button class="ghost" id="btn-import">Restore</button>
      </div>
    </div>

    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="collection" aria-selected="true">Collection</button>
      <button class="tab" role="tab" data-tab="sets" aria-selected="false">Sets</button>
      <button class="tab" role="tab" data-tab="trade" aria-selected="false">Trade<span class="n" id="tn-trade"></span></button>
      <button class="tab" role="tab" data-tab="decks" aria-selected="false">Decks<span class="n" id="tn-decks"></span></button>
      <button class="tab" role="tab" data-tab="meta" aria-selected="false">Meta<span class="n" id="tn-meta"></span></button>
      <button class="tab" role="tab" data-tab="next" aria-selected="false">Next<span class="n" id="tn-next"></span></button>
      <button class="tab" role="tab" data-tab="legends" aria-selected="false">Legends<span class="n" id="tn-legends"></span></button>
      <button class="tab" role="tab" data-tab="news" aria-selected="false">News<span class="n" id="tn-news"></span></button>
      <button class="tab" role="tab" data-tab="sync" aria-selected="false">Import<span class="n" id="tn-sync"></span></button>
    </nav>
  </header>

  <!-- ══ COLLECTION ══════════════════════════════════ -->
  <section id="v-collection">
    <div class="bar">
      <div class="bar-row">
        <input class="search" id="q" type="search" placeholder="Search name, code, ability text, tag, artist…" autocomplete="off">
        <select id="f-set"></select>
        <select id="f-type"></select>
        <select id="f-rarity"></select>
        <select id="f-tag" class="hide"></select>
        <select id="f-sort">
          <option value="setnum">Set &amp; number</option>
          <option value="name">Name</option>
          <option value="energy">Energy</option>
          <option value="might">Might</option>
          <option value="owned">Most owned</option>
        </select>
        <button class="ghost" id="f-view">Table view</button>
      </div>
      <div class="bar-row">
        <span class="lbl">Domain</span>
        <span id="f-domain"></span>
        <span class="lbl" style="margin-left:6px">Printing</span>
        <span id="f-variant"></span>
      </div>
      <div class="bar-row">
        <span class="lbl">Show</span>
        <span id="f-have"></span>
        <span style="flex:1"></span>
        <span class="count-line" id="shown"></span>
        <button class="ghost" id="f-clear">Clear filters</button>
      </div>
      <div class="bar-row hide" id="mirror-note"></div>
    </div>
    <div id="cards"><div class="loading">loading catalog…</div></div>
    <div class="sentinel" id="sentinel"></div>
  </section>

  <!-- ══ SETS ════════════════════════════════════════ -->
  <section id="v-sets" class="hide"></section>

  <!-- ══ TRADE ═══════════════════════════════════════ -->
  <section id="v-trade" class="hide"></section>

  <!-- ══ DECKS ═══════════════════════════════════════ -->
  <section id="v-decks" class="hide"></section>

  <!-- ══ META ════════════════════════════════════════ -->
  <section id="v-meta" class="hide"></section>

  <!-- ══ NEXT ════════════════════════════════════════ -->
  <section id="v-next" class="hide"></section>

  <!-- ══ LEGENDS ═════════════════════════════════════ -->
  <section id="v-legends" class="hide"></section>

  <!-- ══ NEWS ════════════════════════════════════════ -->
  <section id="v-news" class="hide"></section>

  <!-- ══ IMPORT / SYNC ═══════════════════════════════ -->
  <section id="v-sync" class="hide"></section>

  <footer>
    <span id="foot-src">card data from Riot's public gallery feed</span>
    <span>not affiliated with Riot Games</span>
  </footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════════════════ */
// Same Supabase project as the LSAT + reading trackers, its own table.
// The publishable key is meant to be public; row-level security is what guards
// writes. See schema.sql for the table and policies.
const SUPA_URL   = 'https://gnujcqoyjovhqkquwapd.supabase.co';
const SUPA_KEY   = 'sb_publishable_U9pC2YEA9YB2KxPog6t3SA_T03Jid1g';
const SUPA_TABLE = 'riftbound';
const SUPA_ID    = 'jay';

// The deployed proxy in front of the public riftbound.gg profile. Preconfigured so a
// fresh device pulls the collection with nothing to paste in. Overridable in Import.
const DEFAULT_SYNC_URL = 'https://rift-sync.jcegger.workers.dev';

const DOMAINS  = ['Fury','Calm','Mind','Body','Chaos','Order','Colorless'];
const VARIANTS = [['','Base'],['alt','Alt art'],['sig','Signature'],['over','Overnumber'],
                  ['token','Token'],['rune','Basic rune'],['promo','Promo']];
const TYPES    = ['Legend','Unit','Spell','Gear','Battlefield','Rune'];
const RARITIES = ['Common','Uncommon','Rare','Epic','Showcase'];

/* ══════════════════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════════════════ */
// Read-only share mode: rift.jayegger.com/?view=trade
const READONLY = new URLSearchParams(location.search).get('view') === 'trade';

let CAT = null;            // { generatedAt, imagePrefix, sets[], cards[] }
let DECKS = null;          // tournament decklists from data/decks.json
let DECKS_AT = null;       // when that snapshot was taken
let DECKS_WINDOW = null;   // { from, to, days } the snapshot covers
let NEWS = null;           // riftbound.gg posts from data/news.json
let NEWS_AT = null;
let EVENTS = null;         // the tournament archive from data/events.json
let EVENTS_AT = null;
let EVENTS_COVER = null;   // how much of that archive the deck snapshot can see
let TIERS = null;          // riftbound.gg's weekly tier list from data/tiers.json: [{champion,tier,rank,guide,epithet}]
let TIERS_AT = null;
let TIERS_INFO = null;     // { set, report, week, source }
let HIST = null;           // the daily archive from data/history.json: { legends, days, weeks }
let BY  = {};              // publicCode -> card
// Opens on Next, not Collection. The collection is a mirror of riftbound.gg and
// browsing it is the one thing that site already does better; what it cannot do is
// tell you what to acquire, so that is what the app should say first.
let TAB = READONLY ? 'trade' : 'next';

// Synced state. inv: code -> { n:normal owned, f:foil owned, w:wanted, t:for trade }
const S = {
  inv: {},
  decks: [],
  playset: 3,             // copies of one card a deck may run; drives "playset done"
  planBy: 'cost',         // 'cost' = cheapest gap first, 'cards' = fewest cards first
  nearSpend: 25,          // dollars: soft budget on Next's "Find my deck". 0/blank = no budget
  ownLegendOnly: false,   // Find my deck: restrict to archetypes whose legend you hold
  noBuy: [],              // card names the tool must never recommend a deck for
};

// Local-only UI state.
const F = {
  q:'', set:'', type:'', rarity:'', tag:'', sort:'setnum',
  domain:[], variant:[], have:'', view:'grid',
};

const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function loadLocal(){
  Object.assign(S, lsGet('rb_state', {}) || {});
  S.inv   = S.inv   || {};
  S.decks = S.decks || [];
  S.tags  = S.tags  || {};
  S.playset = S.playset || 3;
  if (S.syncUrl === undefined) S.syncUrl = DEFAULT_SYNC_URL;
  if (S.autoSync === undefined) S.autoSync = true;
  Object.assign(F, lsGet('rb_ui', {}) || {});
}
// Everything that belongs on every device, which is all of it apart from filters.
// closeThreshold is deliberately absent: it held a card count for "close decks", which is
// now a dollar figure under a new name. Reinterpreting a stored 5 as $5 would silently
// select almost nothing, so the old value is left behind rather than migrated.
const SYNCED = ['inv','decks','tags','playset','nearSpend','ownLegendOnly','noBuy','showIllegal','planBy','syncUrl','autoSync','mirrorTradeWish','lastSyncAt'];
// Saving must not blow away the collection stream: typing counts into 1189 cards
// would reset scroll and focus on every keystroke. Views that show derived totals
// re-render; the collection view patches the one card that changed instead.
function persist(opts){
  lsSet('rb_state', S);
  syncPush();
  if (!opts || opts.render !== false) render();
}
function persistUI(){ lsSet('rb_ui', F); }

/* ══════════════════════════════════════════════════════════════════════════
   SUPABASE SYNC  (same single-row pattern as lsat.jayegger.com)
   ══════════════════════════════════════════════════════════════════════════ */
function setDot(state, msg){
  const d = document.getElementById('dot'), t = document.getElementById('sync-txt');
  const c = { syncing:'var(--warn)', ok:'var(--good)', err:'var(--bad)', off:'var(--dimmer)' };
  d.style.background = c[state] || c.off;
  t.textContent = msg || ({ syncing:'syncing', ok:'synced', err:'local only', off:'local' })[state];
  d.title = state === 'err' ? 'Could not reach Supabase. Changes are saved in this browser.' : t.textContent;
}
/* ══════════════════════════════════════════════════════════════════════════
   FRESHNESS
   ══════════════════════════════════════════════════════════════════════════
   Every recommendation this app makes is a claim about the current meta, and it is
   only as good as the snapshot behind it. That snapshot used to be regenerated by
   hand, and the app printed the date it was taken without ever working out how long
   ago that was. A three-month-old file recommended a dead meta with total confidence.
   A daily workflow now refreshes the data, which makes this more important rather
   than less: a cron that quietly stops is worse than no cron, because nothing on the
   page would look any different.

   Thresholds are keyed to how fast each thing actually moves. riftbound.gg publishes
   a meta tier list weekly, so the deck snapshot's shelf life is days: warn past ten,
   shout past twenty-one. The card catalog only changes when a set drops, so it gets a
   much longer leash and would otherwise cry wolf every fortnight.                  */

const FRESH_LIMITS = {
  decks:   { warn: 10, bad: 21, label: 'deck snapshot' },
  tiers:   { warn: 10, bad: 21, label: 'tier list' },
  banned:  { warn: 30, bad: 60, label: 'ban list' },
  news:    { warn: 14, bad: 30, label: 'news' },
  events:  { warn: 21, bad: 45, label: 'event list' },
  catalog: { warn: 60, bad: 120, label: 'card catalog' },
};

// Whole days between an ISO date and today. Returns null for anything unparseable, so
// a missing or malformed generatedAt reads as "unknown" rather than as day zero.
function daysSince(iso){
  if (!iso) return null;
  const t = Date.parse(String(iso).slice(0, 10));
  if (!Number.isFinite(t)) return null;
  const d = Math.floor((Date.now() - t) / 86400000);
  return d < 0 ? 0 : d;     // a clock skewed behind the build must not read as stale
}

// One row per data file: how old it is and whether that is a problem yet.
function dataAge(){
  const src = {
    decks:   DECKS_AT,
    tiers:   TIERS_AT,
    banned:  BANNED_AT,
    news:    NEWS_AT,
    events:  EVENTS_AT,
    catalog: CAT && CAT.generatedAt,
  };
  const out = [];
  for (const [key, limits] of Object.entries(FRESH_LIMITS)){
    const at = src[key] || null;
    const days = daysSince(at);
    const state = days == null ? 'unknown'
      : days >= limits.bad ? 'bad'
      : days >= limits.warn ? 'warn' : 'ok';
    out.push({ key, at, days, state, ...limits });
  }
  return out;
}

const AGE_COLOUR = { ok:'var(--good)', warn:'var(--warn)', bad:'var(--bad)', unknown:'var(--dimmer)' };
const ageOf = (key) => dataAge().find(a => a.key === key) || null;
const agePhrase = (a) => !a ? 'age unknown'
  : a.days == null ? 'age unknown'
  : a.days === 0 ? 'built today'
  : a.days === 1 ? 'built yesterday'
  : `${a.days} days old`;

// The masthead indicator reports the worst of them, because one stale file is enough
// to make the answers wrong and burying it behind an average would hide exactly that.
function renderFreshness(){
  const host = document.getElementById('fresh');
  if (!host) return;
  const ages = dataAge().filter(a => a.key !== 'catalog' || a.at);
  const rank = { ok:0, unknown:1, warn:2, bad:3 };
  const worst = ages.slice().sort((x, y) => rank[y.state] - rank[x.state] ||
                                            (y.days ?? -1) - (x.days ?? -1))[0];
  if (!worst){ host.classList.add('hide'); return; }
  host.classList.remove('hide');
  document.getElementById('fresh-dot').style.background = AGE_COLOUR[worst.state];
  document.getElementById('fresh-txt').textContent =
    worst.state === 'ok' ? 'data current' : `${worst.label} ${agePhrase(worst)}`;
  host.title = dataAge().map(a => `${a.label}: ${a.at || 'missing'} (${agePhrase(a)})`).join('\n') +
    (worst.state === 'ok' ? '' : '\n\nRefresh with the scripts in scripts/, or check the daily workflow.');
}

// A line for the tabs whose output is worthless when the snapshot is old. Returns ''
// while everything is current, so it costs nothing to call.
function staleNote(key, what){
  const a = ageOf(key);
  if (!a || a.state === 'ok') return '';
  const colour = AGE_COLOUR[a.state];
  return `<p class="note" style="margin-top:8px;color:${colour}">The ${a.label} is
    ${agePhrase(a)}${a.at ? ` (${esc(a.at)})` : ''}, and ${what} is computed entirely from it. The meta
    moves weekly, so treat this as history rather than advice until it refreshes${
    a.state === 'bad' ? '. Run <code>node scripts/build-decks.mjs</code>, or check that the daily workflow is still running' : ''}.</p>`;
}

/* ── movement, which is the only thing here that remembers ────────────────────
   Every other view answers "right now". That was honest while the data was refreshed
   by hand, but the daily workflow now writes a dated snapshot every morning, and
   scripts/build-history.mjs records each one. Find my deck can rank a Tier 1 deck three
   hundred dollars away and say nothing about whether it is climbing or dying, which is
   half of the decision to start saving for it.

   Two rules, both there to stop this measuring its own construction. Only days built
   with the same deck window are compared, because the archive's early rows hold 250
   decks against today's 475 and diffing across that says Blade Dancer fell ten points
   when the sample merely doubled. And the two days must be MOVE_MIN_DAYS apart, because
   a snapshot is a sample of what people happened to post and yesterday-to-today is
   noise, not a trend.

   History stores legend codes, never archetype names, so the fold happens here against
   the current catalog. That is deliberate: the fold has changed twice, and a file
   holding names would have frozen whichever version was current the day it was written. */

const MOVE_MIN_DAYS = 5;    // below this, two snapshots are the same week
const MOVE_TARGET   = 7;    // aim for week-on-week; take the nearest row to it
const MOVE_MIN_PP   = 0.5;  // percentage points; smaller is a sample wobble
const MOVE_SHOWN    = 6;    // rows per direction, so the panel is fixed by layout

// Only rows sharing the newest row's window, since that is what makes them comparable.
function historyDays(){
  const rows = (HIST && Array.isArray(HIST.days)) ? HIST.days : [];
  if (!rows.length) return [];
  const w = rows[rows.length - 1].w;
  return rows.filter(r => r.w === w && Array.isArray(r.c));
}

// legend index -> archetype name, folded against the live catalog. Cached with the
// other catalog-derived caches, since a republished catalog can change the answer.
let HIST_NAMES = null;
function historyNames(){
  if (HIST_NAMES) return HIST_NAMES;
  const codes = (HIST && HIST.legends) || [];
  HIST_NAMES = codes.map(code => {
    const hit = matchRow({ id: code });
    return hit && hit.card.t === 'Legend' ? gameName(hit.card) : null;
  });
  return HIST_NAMES;
}

// Share of that day's snapshot, summed over every legend printing folding to a name.
function sharesOn(row){
  const names = historyNames();
  const out = new Map();
  if (!row || !row.n) return out;
  for (let i = 0; i < names.length; i++){
    const n = names[i];
    if (!n) continue;
    const c = row.c[i] || 0;
    if (c) out.set(n, (out.get(n) || 0) + c);
  }
  for (const [n, c] of out) out.set(n, c / row.n * 100);
  return out;
}

// The two rows to compare, or null while the archive is too short or too bunched.
function movementPair(){
  const rows = historyDays();
  if (rows.length < 2) return null;
  const now = rows[rows.length - 1];
  const nowT = Date.parse(now.d);
  let best = null;
  for (const r of rows.slice(0, -1)){
    const gap = Math.round((nowT - Date.parse(r.d)) / 86400000);
    if (!Number.isFinite(gap) || gap < MOVE_MIN_DAYS) continue;
    if (!best || Math.abs(gap - MOVE_TARGET) < Math.abs(best.gap - MOVE_TARGET)) best = { row: r, gap };
  }
  return best ? { then: best.row, now, gap: best.gap } : null;
}

// Rising and falling archetypes between those two days. Shares, not counts, because
// the snapshot size moves on its own and counts would report that as meta movement.
let MOVE_CACHE;
function metaMovement(){
  if (MOVE_CACHE !== undefined) return MOVE_CACHE;
  return (MOVE_CACHE = computeMovement());
}
function computeMovement(){
  const pair = movementPair();
  if (!pair) return null;
  const a = sharesOn(pair.then), b = sharesOn(pair.now);
  const rows = [...new Set([...a.keys(), ...b.keys()])].map(name => {
    const was = a.get(name) || 0, is = b.get(name) || 0;
    return { name, was, is, delta: is - was };
  }).filter(r => Math.abs(r.delta) >= MOVE_MIN_PP)
    .sort((x, y) => y.delta - x.delta);
  return {
    from: pair.then.d, to: pair.now.d, gap: pair.gap,
    fromN: pair.then.n, toN: pair.now.n,
    rising: rows.filter(r => r.delta > 0),
    falling: rows.filter(r => r.delta < 0).reverse(),
  };
}

// One archetype's line, for the tabs that rank archetypes one per row.
function movementFor(name){
  const m = metaMovement();
  if (!m) return null;
  return [...m.rising, ...m.falling].find(r => r.name === name) || null;
}

// A compact rise/fall marker for the tabs that list one archetype per row. Inline on
// purpose: the density rule here is that panels are fixed by layout and only rows grow
// with the data, so a trend earns a chip inside an existing row, never a row of its own.
function moveChip(name){
  const m = metaMovement();
  const r = m && movementFor(name);
  if (!r) return '';
  const up = r.delta > 0;
  return ` <span class="code" style="color:${up ? 'var(--good)' : 'var(--bad)'}" title="${
    r.was.toFixed(1)}% of lists on ${esc(m.from)}, ${r.is.toFixed(1)}% on ${esc(m.to)} — ${m.gap} days">${
    up ? '↑' : '↓'}${Math.abs(r.delta).toFixed(1)}</span>`;
}

// Tier changes between the two most recent lists riftbound.gg actually published.
// Keyed by champion and epithet, which is how the tier list names itself.
function tierMovement(){
  const w = (HIST && Array.isArray(HIST.weeks)) ? HIST.weeks : [];
  if (w.length < 2) return null;
  const prev = w[w.length - 2], last = w[w.length - 1];
  const key = (t) => `${t[0]}|${t[1] || ''}`;
  const was = new Map(prev.tiers.map(t => [key(t), t[2]]));
  const moves = [];
  for (const t of last.tiers){
    const before = was.get(key(t));
    if (before != null && before !== t[2])
      moves.push({ champion: t[0], epithet: t[1], from: before, to: t[2] });
  }
  // Improvements first: a climb to Tier 1 is the one worth reading.
  moves.sort((x, y) => (x.to - x.from) - (y.to - y.from) || x.champion.localeCompare(y.champion));
  return { from: prev.d, to: last.d, fromWeek: prev.week, toWeek: last.week, moves };
}

// What to say while the archive is still filling. A recorder that has not yet earned
// the right to draw a conclusion should say so, not render an empty panel.
function movementPending(){
  const rows = historyDays();
  if (!rows.length) return 'Nothing recorded yet. The daily refresh writes a row each morning.';
  const first = rows[0].d, days = rows.length;
  const span = Math.round((Date.parse(rows[rows.length - 1].d) - Date.parse(first)) / 86400000);
  return `Recording since ${esc(first)} — ${days} day${days === 1 ? '' : 's'}, ` +
         `spanning ${span}. Movement appears once two of them are ${MOVE_MIN_DAYS} days apart.`;
}

const SUPA_HEAD = { apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json' };

let pushTimer = null;
function syncPush(){
  if (READONLY) return;
  clearTimeout(pushTimer);
  setDot('syncing');
  // Debounce: typing "12" in a qty field is two keystrokes, not two round trips.
  pushTimer = setTimeout(async () => {
    try {
      const data = {};
      for (const k of SYNCED) if (S[k] !== undefined) data[k] = S[k];
      const r = await fetch(`${SUPA_URL}/rest/v1/${SUPA_TABLE}`, {
        method:'POST',
        headers:{ ...SUPA_HEAD, Prefer:'resolution=merge-duplicates' },
        body: JSON.stringify({ id:SUPA_ID, data }),
      });
      setDot(r.ok ? 'ok' : 'err');
    } catch { setDot('err'); }
  }, 700);
}
async function syncPull(){
  setDot('syncing');
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${SUPA_TABLE}?id=eq.${SUPA_ID}&select=data`, { headers:SUPA_HEAD });
    if (!r.ok) throw new Error(r.status);
    const rows = await r.json();
    const d = rows[0] && rows[0].data;
    if (d){
      for (const k of SYNCED) if (d[k] !== undefined) S[k] = d[k];
      S.inv = S.inv || {}; S.decks = S.decks || []; S.tags = S.tags || {};
      lsSet('rb_state', S);
    }
    setDot('ok');
    return true;
  } catch { setDot('err'); return false; }
}

/* ══════════════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════════════ */
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const inv   = (code) => S.inv[code] || {};
const owned = (code) => { const e = inv(code); return (e.n||0) + (e.f||0); };
const want  = (code) => inv(code).w || 0;
const forTrade = (code) => inv(code).t || 0;
const need  = (code) => Math.max(0, want(code) - owned(code));

/* ── on the way ───────────────────────────────────────────────────────────
   Copies already paid for or agreed to, but not yet in hand: a TCGplayer order,
   a trade someone has posted, a preorder.

   Local state, and it has to be. riftbound.gg has no notion of it, and import
   replaces owned counts on every pull, so this lives beside Want and Trade —
   the two fields a pull deliberately leaves alone — rather than anywhere near
   `n` and `f`. It rides Supabase sync because `inv` already does.

   The source label is free text and is never parsed. It groups the panel and
   nothing else, so no format has to be taught and a blank one still works.     */
const coming     = (code) => inv(code).o  || 0;
const comingFrom = (code) => inv(code).os || '';

// Recorded per printing; the deck maths and the hunt list work by card identity,
// so fold printings the same way ownedIdentities does. Uncached for the same
// reason that one is: it is cheap, and a stale copy would quietly overstate what
// is covered right after an edit.
function comingIdentities(){
  const out = new Map();
  for (const code in S.inv){
    const q = coming(code);
    if (!q) continue;
    const id = identityOf(BY[code]);
    if (id) out.set(id, (out.get(id) || 0) + q);
  }
  return out;
}
const comingFor = (id) => comingIdentities().get(id) || 0;

function setQty(code, field, val){
  setQtyQuiet(code, field, val);
  persist({ render:false });
}

// Repaint one grid card's derived bits (owned badge, owned/wanted borders) after an edit.
function patchCard(el, code){
  const art = el.closest('.card');
  if (!art) return;
  const o = owned(code);
  art.classList.toggle('has', !!o);
  art.classList.toggle('want', !!need(code));
  const img = art.querySelector('.card-img');
  let b = img && img.querySelector('.badge');
  if (o){
    if (!b){ b = document.createElement('span'); b.className = 'badge'; img.appendChild(b); }
    b.textContent = o;
  } else if (b) b.remove();
}

function imgURL(card, w){
  if (!card.i) return '';
  if (/^https?:/.test(card.i)) return card.i;
  return `${CAT.imagePrefix}${card.i}?w=${w}&fm=webp&accountingTag=RB`;
}
const setName = (id) => (CAT.sets.find(s => s.id === id) || {}).name || id;
const vLabel  = (v) => (VARIANTS.find(x => x[0] === (v || '')) || ['','Base'])[1];

function dchips(card){
  return (card.d || []).map(d =>
    `<span class="dchip" style="background:var(--${d.toLowerCase()})" title="${esc(d)}"></span>`).join('');
}

// Custom tags come across on import ("jinx starter"), so a card carries the label
// for where it came from.
const tagsOf = (code) => (S.tags && S.tags[code]) || [];
const allTags = () => [...new Set(Object.values(S.tags || {}).flat())].sort();
function ttags(code){
  return tagsOf(code).map(t =>
    `<span class="ttag" title="${esc(t)}">${esc(t)}</span>`).join('');
}

/* ══════════════════════════════════════════════════════════════════════════
   FILTERING
   ══════════════════════════════════════════════════════════════════════════ */
function matches(c){
  if (F.set    && c.s !== F.set) return false;
  if (F.type   && c.t !== F.type) return false;
  if (F.rarity && c.r !== F.rarity) return false;
  if (F.domain.length && !(c.d || []).some(d => F.domain.includes(d))) return false;
  if (F.variant.length && !F.variant.includes(c.v || '')) return false;
  if (F.tag && !tagsOf(c.c).includes(F.tag)) return false;

  const o = owned(c.c);
  if (F.have === 'own'     && !o) return false;
  if (F.have === 'missing' && o) return false;
  if (F.have === 'want'    && !need(c.c)) return false;
  if (F.have === 'trade'   && !forTrade(c.c)) return false;
  if (F.have === 'coming'  && !coming(c.c)) return false;
  if (F.have === 'foil'    && !inv(c.c).f) return false;
  if (F.have === 'banned'  && !banOf(c)) return false;

  if (F.q){
    const q = F.q.toLowerCase();
    const hay = [c.n, c.c, c.x, (c.g||[]).join(' '), (c.a||[]).join(' '), c.t, c.r]
      .filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

const RARITY_ORD = Object.fromEntries(RARITIES.map((r,i) => [r,i]));
function sortCards(list){
  const by = {
    setnum: (a,b) => a.s.localeCompare(b.s) || (a.no - b.no) || a.c.localeCompare(b.c),
    name:   (a,b) => a.n.localeCompare(b.n) || a.c.localeCompare(b.c),
    energy: (a,b) => (a.e ?? 99) - (b.e ?? 99) || a.n.localeCompare(b.n),
    might:  (a,b) => (b.m ?? -1) - (a.m ?? -1) || a.n.localeCompare(b.n),
    owned:  (a,b) => owned(b.c) - owned(a.c) || a.n.localeCompare(b.n),
  };
  return list.slice().sort(by[F.sort] || by.setnum);
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER: collection
   ══════════════════════════════════════════════════════════════════════════ */
const CHUNK = 120;
let filtered = [], drawn = 0;

function renderCollection(reset){
  if (reset){ filtered = sortCards(CAT.cards.filter(matches)); drawn = 0; }

  const host = document.getElementById('cards');
  const total = CAT.cards.length;
  document.getElementById('shown').innerHTML =
    `<b>${filtered.length}</b> of ${total} printings`;

  if (reset){
    host.innerHTML = filtered.length
      ? (F.view === 'grid'
          ? '<div class="grid" id="stream"></div>'
          : '<div class="tbl-scroll"><table><thead><tr>' +
            '<th></th><th>Card</th><th>Code</th><th>Type</th><th>Rarity</th>' +
            '<th class="num">Norm</th><th class="num">Foil</th><th class="num">Want</th><th class="num">Trade</th>' +
            '<th class="num">Way</th>' +
            '</tr></thead><tbody id="stream"></tbody></table></div>')
      : '<div class="loading">No printings match these filters.</div>';
  }
  drawMore();
}

function drawMore(){
  const stream = document.getElementById('stream');
  if (!stream || drawn >= filtered.length) return;
  const slice = filtered.slice(drawn, drawn + CHUNK);
  stream.insertAdjacentHTML('beforeend',
    slice.map(F.view === 'grid' ? cardHTML : rowHTML).join(''));
  drawn += slice.length;

  // IntersectionObserver only fires on a change in intersection, so if the sentinel
  // is still on screen after this chunk it would never fire again. Keep going here.
  if (drawn < filtered.length){
    const r = document.getElementById('sentinel').getBoundingClientRect();
    if (r.top < window.innerHeight + 600) requestAnimationFrame(drawMore);
  }
}

function qbox(code, field, cls, label){
  const v = inv(code)[field] || '';
  return `<label class="q ${cls}"><span>${label}</span>` +
    `<input type="number" min="0" max="999" inputmode="numeric" value="${v}" ` +
    `class="${v ? 'set' : ''}" data-code="${esc(code)}" data-f="${field}" ${READONLY ? 'disabled' : ''}></label>`;
}

function cardHTML(c){

    <div class="card-img ${c.o === 'landscape' ? 'land' : ''}" data-zoom="${esc(c.c)}">
      ${c.i ? `<img loading="lazy" src="${imgURL(c,240)}" alt="${esc(c.n)}">` : ''}
      ${o ? `<span class="badge">${o}</span>` : ''}
      ${c.v ? `<span class="vtag v-${c.v}">${esc(vLabel(c.v))}</span>` : ''}

    </div>

        ${ttags(c.c)}</div>
      <div class="qs">
        ${qbox(c.c,'n','n','Norm')}${qbox(c.c,'f','f','Foil')}

}

function tq(code, field){
  const v = inv(code)[field] || '';
  return `<td class="num"><input type="number" min="0" max="999" inputmode="numeric" value="${v}" ` +
    `class="qi ${v ? 'set' : ''}" data-code="${esc(code)}" data-f="${field}" ${READONLY ? 'disabled' : ''}></td>`;
}
function rowHTML(c){
  return `<tr>
    <td>${c.i ? `<img class="thumb" loading="lazy" src="${imgURL(c,60)}" alt="" data-zoom="${esc(c.c)}">` : ''}</td>
    <td>${dchips(c)} ${esc(c.n)}${c.v ? ` <span class="vtag v-${c.v}">${esc(vLabel(c.v))}</span>` : ''}${
      banOf(c) ? ` <span class="vtag v-ban" title="${esc(banLabel(c))}">Banned</span>` : ''} ${ttags(c.c)}</td>
    <td class="code">${esc(c.c)}</td>
    <td class="code">${esc(c.t || '—')}</td>
    <td class="code">${esc(c.r || '')}</td>
    ${tq(c.c,'n')}${tq(c.c,'f')}${tq(c.c,'w')}${tq(c.c,'t')}${tq(c.c,'o')}
  </tr>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER: sets
   ══════════════════════════════════════════════════════════════════════════ */
function renderSets(){
  const totals = { printings:0, cards:0, copies:0, foils:0 };
  for (const c of CAT.cards){
    const e = inv(c.c), o = (e.n||0) + (e.f||0);
    if (o){ totals.printings++; totals.copies += o; totals.foils += (e.f||0); }
  }
  const distinctNames = new Set(CAT.cards.filter(c => owned(c.c)).map(c => c.n)).size;

  let html = `<div class="panel">
    <h2>WHERE THE COLLECTION STANDS</h2>
    <div class="stats">
      <div class="stat"><div class="v">${totals.copies}</div><div class="k">cards held</div></div>
      <div class="stat"><div class="v">${totals.printings}</div><div class="k">distinct printings</div></div>
      <div class="stat"><div class="v">${distinctNames}</div><div class="k">unique names</div></div>
      <div class="stat"><div class="v">${totals.foils}</div><div class="k">foils</div></div>
    </div>
    <p class="note">Base-set completion counts only the numbered cards in each set, so alt arts,
    signatures, overnumbers, tokens and basic runes never inflate the denominator. A printing counts
    as owned at one copy in any finish. Playset target is
    <input type="number" min="1" max="9" value="${S.playset}" id="playset"
      style="width:44px;text-align:center;background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:2px"
      ${READONLY ? 'disabled' : ''}> copies.</p>
  </div>`;

  for (const s of CAT.sets){
    const mine = CAT.cards.filter(c => c.s === s.id);
    const base = mine.filter(c => !c.v);
    const baseHave = base.filter(c => owned(c.c)).length;
    const playHave = base.filter(c => owned(c.c) >= S.playset).length;
    const pct = base.length ? (baseHave / base.length * 100) : 0;

    const byR = RARITIES.map(r => {
      const g = base.filter(c => c.r === r);
      return g.length ? `<span><b>${g.filter(c => owned(c.c)).length}/${g.length}</b> ${r.toLowerCase()}</span>` : '';
    }).filter(Boolean).join('');

    const byV = VARIANTS.slice(1).map(([v,lab]) => {
      const g = mine.filter(c => (c.v||'') === v);
      return g.length ? `<span><b>${g.filter(c => owned(c.c)).length}/${g.length}</b> ${lab.toLowerCase()}</span>` : '';
    }).filter(Boolean).join('');

    html += `<div class="panel">
      <div class="meter" style="margin:0">
        <div class="meter-top">
          <span class="meter-name">${esc(s.name)} <span class="code">${esc(s.id)}</span></span>
          <span class="meter-val"><b>${baseHave}</b> / ${base.length} base &nbsp;·&nbsp; ${pct.toFixed(1)}%</span>
        </div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <div class="meter-sub">${byR}</div>
        <div class="meter-sub"><span><b>${playHave}/${base.length}</b> at ${S.playset}-of playset</span>${byV}</div>
      </div>
    </div>`;
  }
  document.getElementById('v-sets').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════════════

function tradeLists(){
  const haves = [], wants = [];
  for (const code in S.inv){
    const c = BY[code];
    if (!c) continue;                       // printing left the feed; ignore quietly
    if (forTrade(code)) haves.push({ c, q: forTrade(code) });
    const d = need(code);
    if (d) wants.push({ c, q: d });
  }
  const ord = (a,b) => a.c.s.localeCompare(b.c.s) || a.c.no - b.c.no;
  return { haves: haves.sort(ord), wants: wants.sort(ord) };
}

function groupBySet(items){
  if (!items.length) return '<p class="empty">Nothing here yet.</p>';
  let out = '', cur = '';
  for (const it of items){
    if (it.c.s !== cur){ cur = it.c.s; out += `<div class="setgroup">${esc(setName(cur))}</div>`; }
    out += `<div class="row">
      ${it.c.i ? `<img class="thumb" loading="lazy" src="${imgURL(it.c,60)}" alt="" data-zoom="${esc(it.c.c)}">` : ''}
      <span class="nm">${dchips(it.c)} ${esc(it.c.n)}
        ${it.c.v ? `<span class="vtag v-${it.c.v}">${esc(vLabel(it.c.v))}</span>` : ''}
        <span class="code">${esc(it.c.c)}</span></span>
      <span class="qty">x${it.q}</span>
    </div>`;
  }
  return out;
}

function tradeText(){
  const { haves, wants } = tradeLists();
  const fmt = (it) => `${it.c.c}  ${it.c.n}${it.c.v ? ` (${vLabel(it.c.v)})` : ''}  x${it.q}`;
  const lines = ['HAVE FOR TRADE', ...(haves.length ? haves.map(fmt) : ['(nothing listed)']),
                 '', 'LOOKING FOR', ...(wants.length ? wants.map(fmt) : ['(nothing listed)'])];
  return lines.join('\n');
}

function cardRow(card, right, cls){

    `YOU TAKE (${m.theyGive.length})`,

function drawDeckAC(){
  const out = document.getElementById('deck-ac');

const deckCards = (d) => Object.entries(d.cards || {})
  .map(([code,q]) => ({ c: BY[code], q }))
  .filter(x => x.c)
  .sort((a,b) => (TYPES.indexOf(a.c.t) - TYPES.indexOf(b.c.t)) || a.c.n.localeCompare(b.c.n));

function deckStats(d){
  const items = deckCards(d);
  let copies = 0, missing = 0;
  for (const it of items){ copies += it.q; missing += Math.max(0, it.q - owned(it.c.c)); }
  return { items, copies, missing, distinct: items.length };
}

        return `<p class="note" style="color:var(--bad);margin:-6px 0 14px">Not legal in sanctioned

      ${READONLY ? '' : `<div class="ac" style="margin-bottom:14px">

        <div id="deck-ac"></div>
      </div>`}

      <div class="rows">
        ${st.items.length ? st.items.map(it => {
          const short = Math.max(0, it.q - owned(it.c.c));

            ${it.c.i ? `<img class="thumb" loading="lazy" src="${imgURL(it.c,60)}" alt="" data-zoom="${esc(it.c.c)}">` : ''}

              data-deck-qty="${esc(d.id)}" data-code="${esc(it.c.c)}" style="width:46px;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:3px">`}
          </div>`;
        }).join('') : '<p class="empty">Nothing in this deck yet.</p>'}
      </div>

      ${READONLY ? '' : `<div class="bar-row" style="margin-top:14px">
        <button class="ghost" id="btn-deck-copy">Copy deck list</button>
        <button class="ghost" id="btn-deck-wants">Add shortfall to wants</button>

      <p class="note" style="margin-top:8px">“Add shortfall to wants” raises each card's Want count to
      the number this deck needs, so the missing cards show up on the trade list.</p>`}
    </div>`;
  }
  host.innerHTML = html;
}

function deckText(d){
  const st = deckStats(d);
  const out = [d.name, ''];
  for (const t of TYPES){
    const g = st.items.filter(i => i.c.t === t);
    if (!g.length) continue;
    out.push(`${t.toUpperCase()} (${g.reduce((a,i) => a + i.q, 0)})`);
    for (const i of g) out.push(`  ${i.q}x ${i.c.n}  ${i.c.c}`);
    out.push('');
  }
  return out.join('\n').trim();
}

/* ══════════════════════════════════════════════════════════════════════════
   IMPORT from riftbound.gg
   ══════════════════════════════════════════════════════════════════════════
   riftbound.gg is where cards get entered, because its scanner beats typing.
   This pulls that collection in and mirrors it: owned counts are replaced from
   the file so a correction over there propagates here, while Want and Trade are
   left alone because they only exist in this tool.

   Their export is CSV. Column names vary by source, so match on whatever the
   file actually carries, most specific key first, and report what did not land
   rather than silently dropping it.                                           */

// Minimal RFC4180 parser: quoted fields, escaped quotes, CRLF, trailing newline.
function parseCSV(text){
  const rows = [];
  let row = [], field = '', q = false;
  const s = text.replace(/^﻿/, '');           // strip BOM
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (q){
      if (ch === '"'){
        if (s[i+1] === '"'){ field += '"'; i++; }
        else q = false;
      } else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ','){ row.push(field); field = ''; }
    else if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch !== '\r') field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

// The same column aliases riftbound.gg's own importer accepts, plus the ones its
// export and a TCGplayer export use.
const COLS = {
  id:     ['cardid','card id','id','card','id_normal','idnormal'],
  name:   ['name','cardname','card name','productname','product name'],
  set:    ['set','setid','set id','setcode','set code','edition'],
  number: ['number','cardnumber','card number','collectornumber','collector number','no','#'],
  normal: ['normal','standard','count','qty','quantity','amount','owned','nonfoil','non-foil'],
  foil:   ['foil','foils','foilqty','foil quantity'],
};
function mapHeader(header){
  const norm = header.map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
  const out = {};
  for (const key in COLS){
    const i = norm.findIndex(h => COLS[key].includes(h));
    if (i >= 0) out[key] = i;
  }
  return out;
}

// Normalize a collector segment. It is not always "digits then maybe a letter":
// tokens and basic runes are letter-prefixed (T03, R01, SP1) and carry their own
// suffixes (T04s, R02a), so the prefix has to survive normalization while the
// zero-padding does not.
//
//   "001" -> "1"      "066a" -> "66A"     "304*" / "304-star" -> "304*"
//   "T03" -> "T3"     "T04s" -> "T4S"     "R02a" -> "R2A"      "SP1" -> "SP1"
function normColl(seg){
  let s = String(seg ?? '').replace(/\s+/g, '');
  if (!s) return null;
  // Deck lists carry printing markers the gallery does not: "-P" for a promo
  // printing and "-STAR" spelled out for a signature. A promo Annie is still
  // Annie, so the marker is dropped and the card resolves to its base printing.
  s = s.replace(/[-_]P$/i, '');
  s = s.replace(/\/\d+$/, '');
  const star = /\*/.test(s) || /star$/i.test(s);
  s = s.replace(/\*/g, '').replace(/[-_]?star$/i, '');
  s = s.replace(/[-_]/g, '');   // "263-a" is just "263a"
  const m = /^([A-Za-z]*)0*(\d+)([A-Za-z]*)$/.exec(s);
  if (!m) return null;
  return `${m[1].toUpperCase()}${Number(m[2])}${m[3].toUpperCase()}${star ? '*' : ''}`;
}

// Drop a trailing letter suffix, keeping any prefix: "T4S" -> "T4", "66A" -> "66".
// Used only as a fallback, for printings Riot's gallery does not publish.
function baseColl(norm){
  const m = /^([A-Za-z]*\d+)[A-Za-z]+(\*?)$/.exec(String(norm || ''));
  return m ? m[1] + m[2] : null;
}

function collKey(setId, number){
  const n = normColl(number);
  return setId && n ? `${String(setId).toUpperCase().trim()}|${n}` : null;
}

// Split a full code into set + collector segment. Handles the public code
// ("OGN-066a/298", "UNL-T01", "VEN-SP1/006") and Riot's id ("ogn-299-star-298").
function splitCode(code){
  const m = /^([A-Za-z]{2,5})[-\s]+(.+)$/.exec(String(code ?? '').trim());
  if (!m) return null;
  const seg = m[2]
    .replace(/\/\d+$/, '')        // "066a/298" -> "066a"
    .replace(/[-_]star\b/i, '*')  // riot id star form
    .replace(/[-_]\d+$/, '');     // riot id trailing set size
  return { set: m[1].toUpperCase(), seg };
}
function keyFromCode(code){
  const p = splitCode(code);
  return p ? collKey(p.set, p.seg) : null;
}

let MATCH = null;
function buildMatchIndex(){
  MATCH = { byId: new Map(), byCode: new Map(), byColl: new Map(), byName: new Map() };
  for (const c of CAT.cards){
    if (c.ri) MATCH.byId.set(c.ri.toLowerCase(), c);
    MATCH.byCode.set(c.c.toLowerCase(), c);
    const k = keyFromCode(c.c);
    if (k && !MATCH.byColl.has(k)) MATCH.byColl.set(k, c);
    // Name maps to base printings only, so a bare name never resolves to a chase card.
    const nk = c.n.toLowerCase();
    if (!c.v && !MATCH.byName.has(nk)) MATCH.byName.set(nk, c);
  }
}

// Returns {card, exact}. exact:false means the specific printing is not in Riot's
// gallery and the copies were attributed to the base printing instead, which is
// reported rather than hidden.
function matchRow(r){
  // Built lazily: the meta view resolves deck codes through here too, and it can be
  // the first thing opened, before any import has run.
  if (!MATCH) buildMatchIndex();
  const keys = [];
  if (r.id){
    const id = String(r.id).toLowerCase().trim();
    const hit = MATCH.byId.get(id) || MATCH.byCode.get(id);
    if (hit) return { card: hit, exact: true };
    keys.push(keyFromCode(r.id));
  }
  if (r.set && r.number) keys.push(collKey(r.set, r.number));
  if (r.number) keys.push(keyFromCode(r.number));

  for (const k of keys){
    if (k && MATCH.byColl.has(k)) return { card: MATCH.byColl.get(k), exact: true };
  }
  // Fall back to the base printing of the same number: "UNL-T04s" -> "UNL-T04".
  for (const k of keys){
    if (!k) continue;
    const [set, coll] = k.split('|');
    const base = baseColl(coll);
    const hit = base && MATCH.byColl.get(`${set}|${base}`);
    if (hit) return { card: hit, exact: false };
  }
  if (r.name){
    const hit = MATCH.byName.get(String(r.name).toLowerCase().trim());
    if (hit) return { card: hit, exact: true };
  }
  return null;
}

// riftbound.gg's own shape, straight off /cgfw/getuserdata. Richer than its CSV:
// it carries trade and wishlist counts per finish, and the custom tags used to
// label where a card came from ("jinx starter").
function readCollectionJSON(text){
  const d = JSON.parse(text);
  const list = Array.isArray(d) ? d : (d.collection || d.cards || d.data);
  if (!Array.isArray(list)) throw new Error('No collection array in that JSON.');
  const int = (v) => {
    const n = Math.floor(Number(String(v ?? '').trim()));
    return Number.isFinite(n) && n > 0 ? Math.min(999, n) : 0;
  };
  const rows = list.map((x) => ({
    id:   x.card ?? x.cardid ?? x.card_id ?? x.id ?? '',
    name: x.name ?? '',
    set:  x.set ?? x.setId ?? '',
    number: x.number ?? '',
    n: int(x.standard ?? x.normal ?? x.qty ?? x.quantity),
    f: int(x.foil),
    t: int(x.trade) + int(x.trade_foil),
    w: int(x.wish) + int(x.wish_foil) + int(x.wishlist),
    tags: ((x.extra_data || {}).customTags || []).map((t) => t && t.name).filter(Boolean),
    bare: false,
  }));
  return { rows, cols: ['card','standard','foil','trade','wish','customTags'], kind:'json' };
}

// Read a CSV into {rows, cols} of normalized records.
function readCollectionCSV(text){
  const grid = parseCSV(text);
  if (!grid.length) throw new Error('That file has no rows in it.');
  const cols = mapHeader(grid[0]);
  // Compare against null, not truthiness: column index 0 is a perfectly good match
  // and "cardid" being the first column is the likely case.
  if (cols.id == null && cols.name == null && cols.number == null)
    throw new Error('No card column found. Expected one of: cardid, name, or number.');
  const num = (v) => {
    const n = Math.floor(Number(String(v ?? '').trim()));
    return Number.isFinite(n) && n > 0 ? Math.min(999, n) : 0;
  };
  const rows = grid.slice(1).map((cells) => ({
    id:     cols.id     != null ? cells[cols.id]     : '',
    name:   cols.name   != null ? cells[cols.name]   : '',
    set:    cols.set    != null ? cells[cols.set]    : '',
    number: cols.number != null ? cells[cols.number] : '',
    n:      cols.normal != null ? num(cells[cols.normal]) : 0,
    f:      cols.foil   != null ? num(cells[cols.foil])   : 0,
    // A file with no quantity column at all means one copy per listed row.
    bare:   cols.normal == null && cols.foil == null,
  }));
  return { rows, cols };
}

// Mirror owned counts from an import. Want and Trade survive untouched unless
// mirrorTradeWish is on, since riftbound.gg tracks those too.
function applyImport(text){
  if (!MATCH) buildMatchIndex();
  const trimmed = String(text).trim();
  const isJSON = trimmed.startsWith('{') || trimmed.startsWith('[');
  const { rows, cols, kind } = isJSON ? readCollectionJSON(trimmed) : readCollectionCSV(trimmed);
  const mirror = !!S.mirrorTradeWish && kind === 'json';

  const owned = new Map();   // code -> {n, f, t, w}
  const tags = {};
  const unmatched = [], approx = [];
  for (const r of rows){
    const hit = matchRow(r);
    if (!hit){
      const label = [r.name, r.id, r.set && r.number ? `${r.set} ${r.number}` : r.number]
        .filter(Boolean).join(' · ');
      if (label) unmatched.push(label);
      continue;
    }
    const { card, exact } = hit;
    if (!exact) approx.push(`${r.id || r.number} → ${card.c}`);
    const prev = owned.get(card.c) || { n:0, f:0, t:0, w:0 };
    // Duplicate rows for one printing (one per finish, say) add up rather than clobber.
    owned.set(card.c, {
      n: prev.n + (r.bare ? 1 : r.n), f: prev.f + r.f,
      t: prev.t + (r.t || 0),         w: prev.w + (r.w || 0),
    });
    if (r.tags && r.tags.length) tags[card.c] = [...new Set([...(tags[card.c] || []), ...r.tags])];
  }
  S.tags = tags;

  let added = 0, changed = 0, cleared = 0;
  const before = new Map(Object.keys(S.inv).map(c => [c, owned0(c)]));

  // A full-catalog export lists every card including the ones held at zero, so a
  // matched row is not the same thing as an owned printing. Fold the zero rows in
  // with the cards the file omits entirely: both mean "no longer owned".
  const zeroed = new Set();
  for (const [code, q] of owned) if (!q.n && !q.f) zeroed.add(code);

  const drop = (code) => {
    const e = S.inv[code];
    if (!e) return;
    if (e.n || e.f) cleared++;
    delete e.n; delete e.f;
    if (!Object.keys(e).length) delete S.inv[code];
  };

  // Replace every owned count, so a card removed on riftbound.gg drops to zero here.
  for (const code of Object.keys(S.inv)) if (!owned.has(code) || zeroed.has(code)) drop(code);

  for (const [code, q] of owned){
    if (zeroed.has(code) && !(mirror && (q.t || q.w))) continue;
    const had = before.get(code);
    const e = { ...(S.inv[code] || {}) };
    e.n = q.n; e.f = q.f;
    if (mirror){ e.t = q.t; e.w = q.w; }
    for (const k of ['n','f','t','w']) if (!e[k]) delete e[k];
    if (Object.keys(e).length) S.inv[code] = e; else delete S.inv[code];
    if (zeroed.has(code)) continue;
    // An entry that existed only to hold a Want counts as newly owned, not changed.
    if (!had || (!had.n && !had.f)) added++;
    else if (had.n !== q.n || had.f !== q.f) changed++;
  }

  // Copies that have landed. Owned counts are authoritative and were just replaced, so
  // a rise against `before` is something arriving, and the inbound record retires
  // itself by that much. This is what keeps "on the way" from being a list that only
  // ever grows: nothing here is ticked off by hand, and a card bought outside the app
  // still clears once riftbound.gg knows about it.
  let arrived = 0;
  for (const code of Object.keys(S.inv)){
    const e = S.inv[code];
    const q = e.o || 0;
    if (!q) continue;
    const had = before.get(code);
    const rise = ((e.n || 0) + (e.f || 0)) - (had ? had.n + had.f : 0);
    if (rise <= 0) continue;
    const left = Math.max(0, q - rise);
    arrived += q - left;
    if (left) e.o = left; else { delete e.o; delete e.os; }
    if (!Object.keys(e).length) delete S.inv[code];
  }

  const copies = [...owned.values()].reduce((a, q) => a + q.n + q.f, 0);
  return { rows: rows.length, matched: owned.size - zeroed.size, copies, mirror,
           added, changed, cleared, unmatched, approx, arrived,
           cols: Array.isArray(cols) ? cols : Object.keys(cols) };
}
function owned0(code){ const e = S.inv[code] || {}; return { n: e.n || 0, f: e.f || 0 }; }

let lastImport = null;

// Pull through the proxy Worker. Direct fetch cannot work: api.dotgg.gg echoes
// Access-Control-Allow-Origin only for riftbound.gg, so the browser blocks us.
// See worker/README.md.
async function syncFromDotgg(quiet){
  if (!S.syncUrl) return false;
  try {
    const r = await fetch(S.syncUrl, { cache:'no-store' });
    const body = await r.text();
    if (!r.ok) throw new Error(body.trim().slice(0, 200) || `HTTP ${r.status}`);
    lastImport = { ...applyImport(body), at: new Date().toISOString().slice(0, 16).replace('T', ' '),
                   via: 'riftbound.gg' };
    S.lastSyncAt = lastImport.at;
    persist();
    if (!quiet) toast(`imported ${lastImport.copies} cards`);
    return true;
  } catch (e) {
    // Deliberately does not touch the sync dot: that reports Supabase, and a failed
    // import must not read as "your edits are not saving". The Import tab owns this.
    lastImport = { error: e.message, via: 'riftbound.gg' };
    renderImportBadge();
    if (!quiet){ toast('import failed'); render(); }
    return false;
  }
}

/* ── foil-only printings ───────────────────────────────────────────────────
   Riot does not publish finishes, so the catalog carries `fo` on printings that
   riftbound.gg's database says come in foil and only foil, and only where their own
   price data agrees. 512 of 1,189 printings qualify, which is most of the interesting
   half of the game: champion cards, signatures, showcases and alt arts.

   A Normal count on one of those is not a card, it is a typo, and it comes in through
   the import because that is where owned counts come from. Nothing is corrected
   automatically: import replaces owned counts on every pull, so a local fix would be
   silently undone on the next one and the app would quietly disagree with its own
   source forever. The honest move is to name the rows so they can be fixed at
   riftbound.gg, and offer a local correction that holds until the next pull.         */
function foilOnlyProblems(){
  const out = [];
  for (const code in S.inv){
    const card = BY[code];
    if (!card || !card.fo) continue;
    const e = S.inv[code] || {};
    const n = e.n || 0;
    if (n > 0) out.push({ code, card, normal: n, foil: e.f || 0 });
  }
  return out.sort((a, b) => b.normal - a.normal || a.card.n.localeCompare(b.card.n));
}

function foilOnlyText(list){
  return ['FOIL-ONLY PRINTINGS RECORDED AS NORMAL', '',
    'Fix these on riftbound.gg; they come back on every import until you do.', '',
    ...list.map(p => `${p.code}  ${p.card.n}  normal ${p.normal}${p.foil ? `, foil ${p.foil}` : ''}`),
  ].join('\n');
}

function renderFoilOnly(){
  if (!CAT) return '';
  const flagged = CAT.cards.filter(c => c.fo).length;
  if (!flagged) return '';        // no finish data this catalog build; claim nothing
  const bad = foilOnlyProblems();
  if (!bad.length) return '';
  const copies = bad.reduce((a, p) => a + p.normal, 0);
  return `<div class="panel" style="border-color:var(--warn)">
    <h2 style="color:var(--warn)">RECORDED IN A FINISH THAT DOES NOT EXIST <span class="code">${bad.length}</span></h2>
    <p class="note">${bad.length} printing${bad.length === 1 ? '' : 's'} hold${bad.length === 1 ? 's' : ''}
    ${copies} cop${copies === 1 ? 'y' : 'ies'} marked Normal, but ${bad.length === 1 ? 'it comes' : 'they come'}
    only in foil. Almost always a quick-add on riftbound.gg that defaulted to Normal.</p>
    <p class="note" style="margin-top:6px">Fix them over there rather than here: every import replaces
    owned counts, so a correction made in this app is undone on the next pull. "Record as foil" is
    available anyway, for when you want the numbers right in the meantime.</p>
    <div class="rows" style="margin-top:8px">${bad.map(p => `
      <div class="row">
        ${p.card.i ? `<img class="thumb" loading="lazy" src="${imgURL(p.card, 60)}" alt="" data-zoom="${esc(p.card.c)}">` : ''}
        <span class="nm">${dchips(p.card)} ${esc(p.card.n)}
          <span class="code">${esc(p.code)}${p.card.v ? ` · ${esc(vLabel(p.card.v))}` : ''}</span></span>
        <span class="qty need">${p.normal} normal${p.foil ? ` · ${p.foil} foil` : ''}</span>
      </div>`).join('')}</div>
    <div class="bar-row" style="margin-top:12px">
      <button class="ghost" id="btn-foil-copy">Copy the list</button>
      <button class="ghost" id="btn-foil-fix">Record ${copies} as foil</button>
    </div>
  </div>`;
}
