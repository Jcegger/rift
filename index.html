}
async function importText(text, via) {
  try {
    let rep;
    await write((d) => { rep = applyImport(d, text, MATCH); d.lastSyncAt = stamp(); });
    LAST = { ...rep, via, at: new Date() };
    toast(`Imported ${rep.copies} cards`);
  } catch (err) { toast(`Import failed: ${err.message}`); }
  KEEP_SCROLL = true; route();
}
function wireImport() {
  const f = $("#impfile");
  if (f) f.onchange = async () => { const file = f.files[0]; if (file) importText(await file.text(), file.name); };
  const u = document.querySelector("[data-syncurl]");
  if (u) u.onsubmit = async (e) => {
    e.preventDefault();
    const v = $("#syncurl").value.trim();
    try { await write((d) => { d.syncUrl = v || DEFAULT_SYNC_URL; }); toast("Saved"); } catch (err) { toast(`Not saved: ${err.message}`); }
  };
}
document.addEventListener("change", async (e) => {
  const k = e.target.dataset?.setting;
  if (!k) return;
  const on = e.target.checked;
  try { await write((d) => { d[k] = on; }); toast("Saved"); KEEP_SCROLL = true; route(); }
  catch (err) { e.target.checked = !on; toast(`Not saved: ${err.message}`); }
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-imp]");
  if (!b) return;
  const k = b.dataset.imp;
  if (k === "pa-file") download(`piltover-merge-${today()}.csv`, newqCSV(newqRows(ROW, IDX.BY)), "text/csv");
  else if (k === "pa-copy") copyText(newqText(newqRows(ROW, IDX.BY)), "List");
  else if (k === "pa-clear") {
    if (!confirm("Clear the Piltover list? Only do this once the file is merged in.")) return;
    try { await write((d) => { d.newq = {}; }); toast("Cleared"); KEEP_SCROLL = true; route(); } catch (err) { toast(`Not cleared: ${err.message}`); }
  } else if (k === "typo-copy") copyText(["FOIL-ONLY PRINTINGS RECORDED AS NORMAL", "", ...foilOnlyProblems(ROW.inv, IDX.BY).map((p) => `${p.code}  ${p.card.n}  normal ${p.normal}${p.foil ? `, foil ${p.foil}` : ""}`)].join("\n"), "List");
  else if (k === "paste") { const t = $("#imptext").value; if (t.trim()) importText(t, "pasted text"); else toast("Paste something first"); }
  else if (k === "backup") download(`rift-backup-${today()}.json`, JSON.stringify(ROW, null, 1), "application/json");
});

/* ══ Guides ══════════════════════════════════════════════════════════════ */
function viewGuides() {
  const gs = GUIDES?.guides || [];
  const deckG = gs.filter((g) => g.legend), ref = gs.filter((g) => !g.legend);
  const item = (g) => `<a class="panel" href="#/guide/${encodeURIComponent(g.slug)}" style="text-decoration:none;color:inherit;gap:6px">
    <span class="lbl">${esc(g.kicker || (g.legend ? `${g.legend}${g.champion ? " · " + g.champion : ""}` : "Guide"))}</span>
    <h3 style="font-size:24px">${esc(g.title)}</h3><span class="small dim">${esc(g.subtitle || "")}</span>
    <span class="tiny dim">${esc(g.date || "")} · ${Math.round((g.words || 0) / 230)} min read</span></a>`;
  return `<h1>Guides</h1>
    <h2>Your decks</h2><div class="mgrid">${deckG.map(item).join("")}</div>
    <h2>Every deck</h2><div class="mgrid">${ref.map(item).join("")}</div>`;
}
async function viewGuide(slug) {
  const g = (GUIDES?.guides || []).find((x) => x.slug === slug);
  const v = $("#view");
  if (!g) { v.innerHTML = `<div class="banner bad">No guide called ${esc(slug)}.</div>`; return; }
  let md;
  try { const r = await fetch(g.file); if (!r.ok) throw new Error(r.status); md = await r.text(); }
  catch (e) { v.innerHTML = `<div class="banner bad">Couldn't load ${esc(g.file)}: ${esc(e.message)}</div>`; return; }
  const linkFor = (u) => {
    const base = u.split("#")[0].split("/").pop();
    const hit = (GUIDES.guides || []).find((x) => x.file.split("/").pop() === base);
    return hit ? `#/guide/${encodeURIComponent(hit.slug)}` : null;
  };
  const html = mdToHtml(md, { linkFor });
  const toc = (g.sections || []).map((s) => `<a href="#/guide/${encodeURIComponent(slug)}?at=${slugify(s)}">${esc(s)}</a>`).join("");
  v.innerHTML = `<div class="cols">
    <article class="panel wide guide"><a class="small" href="#/guides">‹ Guides</a><h1>${esc(g.title)}</h1>
      ${g.subtitle ? `<p class="dim">${esc(g.subtitle)}</p>` : ""}${html}</article>
    <aside class="side hide-sm" style="position:sticky;top:88px"><section class="panel"><span class="lbl">Sections</span><div class="toc">${toc}</div></section></aside></div>`;
  const at = new URLSearchParams(location.hash.split("?")[1] || "").get("at");
  if (at) document.getElementById(at)?.scrollIntoView({ block: "start" });
}

/* ══ News ════════════════════════════════════════════════════════════════
   Three sources in one list: Riot's own news (the only place bans, errata and rules
   updates are announced), Riot's RQ results articles, and riftbound.gg's posts (titles
   only; their feed carries no text). "For you" pulls out what changes how you play:
   recent rules/ban/errata posts, and anything naming a champion from your decks. */
// "FAQ" alone is not enough: Riot's merch-drawing page is a FAQ too.
const RULESY = /\b(rules?|errata|bans?|banned|patch notes|changelog|legality)\b|rules faq|faq.*rules/i;
const normUrl = (u) => String(u || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "").toLowerCase();
const apos = (t) => String(t).replace(/[’‘]/g, "'").toLowerCase();
function newsItems() {
  const seen = new Set(), out = [];
  const add = (p) => { const k = normUrl(p.url); if (!k || seen.has(k)) return; seen.add(k); out.push(p); };
  for (const p of NEWS?.riot || []) add({ ...p, src: "Riot", kind: /top decks/i.test(p.title) ? "results" : RULESY.test(p.title) ? "rules" : "riot" });
  for (const e of TOP?.events || []) add({ title: e.title.replace(/’/g, "'"), dt: e.published, url: e.url, tags: ["Organized Play"], desc: e.summary || null, src: "Riot", kind: "results" });
  for (const p of NEWS?.posts || []) add({ ...p, src: "riftbound.gg", kind: (p.tags || []).includes("Metagame") ? "meta" : (p.tags || []).some((t) => /guide|legend/i.test(t)) ? "guides" : RULESY.test(p.title) ? "rules" : "news" });
  return out.sort((a, b) => String(b.dt).localeCompare(String(a.dt)));
}
// The champions your decks are built on, by legend; a title naming one is about you.
function myChampions() {
  const out = new Map();
  for (const d of decks()) {
    const L = deckStats(d, IDX, ROW?.inv || {}).legend;
    const ch = L && IDX.championOf(L);
    if (ch) out.set(apos(ch), ch);
  }
  return out;
}
const aboutMe = (p, champs) => [...champs].filter(([k]) => apos(p.title).includes(k)).map(([, v]) => v);
// Per-viewer: when you last opened News, so new posts can be marked. Read once a
// session, then moved to today, so a reload mid-session keeps the marks.
let NEWS_SEEN;
function newsSeen() {
  if (NEWS_SEEN === undefined) {
    NEWS_SEEN = ls.get("rift-app-news-seen", null);
    ls.set("rift-app-news-seen", today());
  }
  return NEWS_SEEN;
}
function newsBadge() {
  const prev = NEWS_SEEN !== undefined ? NEWS_SEEN : ls.get("rift-app-news-seen", null);
  if (!prev || !NEWS) return 0;
  return newsItems().filter((p) => p.dt > prev).length;
}
const NF = { k: ls.get("rift-app-news-filter", "all") };
const NEWS_FILTERS = [["all", "Everything"], ["mine", "Your decks"], ["rules", "Rules & bans"], ["riot", "Riot"], ["results", "Results"], ["meta", "Meta"], ["guides", "Guides"]];
function viewNews() {
  const prev = newsSeen();
  const items = newsItems();
  const champs = myChampions();
  const recent = (p, days) => p.dt && (Date.now() - Date.parse(p.dt)) / 86400000 <= days;
  const forYou = items.filter((p) => recent(p, 30) && ((p.src === "Riot" && p.kind === "rules") || aboutMe(p, champs).length)).slice(0, 8);
  const pick = (p) => NF.k === "all" ? true : NF.k === "mine" ? aboutMe(p, champs).length > 0
    : NF.k === "riot" ? p.src === "Riot" : p.kind === NF.k;
  const shown = items.filter(pick).slice(0, 80);
  const fresh = prev ? items.filter((p) => p.dt > prev).length : 0;
  const row = (p) => {
    const mine = aboutMe(p, champs);
    const isNew = prev && p.dt > prev;
    const ext = !/playriftbound\.com|riftbound\.gg/.test(p.url);
    return `<div class="row news" style="align-items:flex-start">
      <span class="num tiny dim" style="width:104px;flex:none;padding-top:3px;white-space:nowrap">${isNew ? `<i class="newdot" title="New since your last visit"></i>` : ""}${esc(p.dt || "")}</span>
      <span class="n"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>${ext ? ` <span class="tiny dim">↗ video</span>` : ""}
        ${p.desc ? `<span class="small dim" style="display:block">${esc(p.desc)}</span>` : ""}
        <span class="tiny" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px">
          <span class="pill ${p.src === "Riot" ? "riot" : "src"}">${esc(p.src)}</span>
          ${p.kind === "rules" ? `<span class="pill bad">rules</span>` : ""}
          ${mine.map((c) => `<span class="pill good">${esc(c)}</span>`).join("")}
          <span class="dim">${esc((p.tags || []).join(" · "))}</span></span></span></div>`;
  };
  const at = (k) => k === "riot" ? (NEWS?.riot?.[0]?.dt || "—") : (NEWS?.posts?.[0]?.dt || "—");
  return `<section class="panel hero">
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0"><h1>News</h1>
        <span class="small dim">Riot's news and results, and riftbound.gg's posts · checked daily · newest from Riot ${esc(at("riot"))}, riftbound.gg ${esc(at("gg"))}</span></div>
      <div class="stats"><div class="stat"><span class="lbl">New since last visit</span><b>${prev ? fresh : "—"}</b></div>
        <div class="stat"><span class="lbl">For you, 30 days</span><b>${forYou.length}</b></div></div></section>
    ${forYou.length ? `<section class="panel"><div class="headrow"><h2>For you</h2>
        <span class="small dim">Riot's rules, ban and errata posts, and anything about ${esc([...champs.values()].join(", ") || "your decks")}</span></div>
      <div>${forYou.map(row).join("")}</div></section>` : ""}
    <nav class="subnav" aria-label="Filter news">${NEWS_FILTERS.map(([k, l]) => `<a href="#/news" data-nf="${k}" ${NF.k === k ? 'aria-current="page"' : ""}>${l}</a>`).join("")}</nav>
    <section class="panel">
      ${shown.length ? shown.map(row).join("") : `<p class="note">Nothing here${NF.k === "mine" ? " mentions your decks' champions" : ""}.</p>`}
      <p class="note">Riot's posts come from playriftbound.com's news pages, with Riot's own one-line summary. riftbound.gg's feed carries titles only. "Your decks" means the title names a champion one of your decks is built on.</p></section>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-nf]");
  if (!b) return;
  e.preventDefault();
  NF.k = b.dataset.nf; ls.set("rift-app-news-filter", NF.k);
  KEEP_SCROLL = true; route();
});

/* ── boot ────────────────────────────────────────────────────────────────── */
(async () => {
  try { await loadData(); }
  catch (e) { $("#view").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; return; }
  route();
  try { adopt(await pull()); setSync("ok"); }
  catch { setSync(navigator.onLine ? "error" : "offline"); }
  if (SHARE) { route(); return; }
  await flushQueue();
  if (!DIRTY) { KEEP_SCROLL = true; route(); }
  // riftbound.gg is where cards get entered, so its counts win over the row's on every
  // open. scripts/rift reads the row and never pulls, so this is what keeps it current.
  if (ROW && ROW.autoSync !== false) pullCollection();
  window.addEventListener("online", () => { flushQueue(); flushCounts(); });
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || DIRTY) return;
    const typing = document.activeElement?.matches?.("input,textarea,select");
    try { adopt(await pull()); setSync("ok"); await flushQueue(); if (!typing && !$("#dlg").open) { KEEP_SCROLL = true; route(); } } catch { /* keep what we have */ }
  });
})();
</script>
