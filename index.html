<style>

@media (prefers-color-scheme: dark){

    --ink:#E8EAEE; --ink2:#A9B0BC; --ink3:#848B97; --line:#2C3038; --line2:#252930;
    --ground:#0F1115; --card:#181B21; --soft:#1F232A; --head:#0A0B0E; --headon:#23262D;
    --accent:#8C7BFF; --accent2:#B0A4FF; --short:#F0A15C; --shortbg:#3A2414;
    --good:#5FCF8F; --goodbg:#15301F; --bad:#FF8A7E; --badbg:#3A1714; --later:#E8C55A; --laterbg:#332A0C;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EAEE; --ink2:#A9B0BC; --ink3:#848B97; --line:#2C3038; --line2:#252930;
  --ground:#0F1115; --card:#181B21; --soft:#1F232A; --head:#0A0B0E; --headon:#23262D;
  --accent:#8C7BFF; --accent2:#B0A4FF; --short:#F0A15C; --shortbg:#3A2414;

body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 var(--f-body)}

<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/decks">RIFT</a>
    <nav class="main" aria-label="Main" id="nav"></nav>
    <span class="sync" id="sync" title=""><i></i><span>loading</span></span>
  </div>
</header>
<main id="view"><p class="dim">Loading…</p></main>
<nav class="bottom" aria-label="Main" id="bnav"></nav>
<dialog id="dlg"></dialog>

<script type="module">
import { indexCatalog, deckStats, deckChecks, journalRecord, ownedByIdentity, MAIN_SIZE, SB_MAX } from "./lib/decks.mjs";
import { mdToHtml, esc, slugify } from "./lib/markdown.mjs";
import { deckEngines, ENGINES } from "./lib/engines.mjs";
import { annotateEngines, VERDICTS } from "./lib/research.mjs";
import { applyImport, matcher, setCount, setSource, foilOnlyProblems, newqRows, newqText, newqCSV,
  spares, readPartner, tradeMatch } from "./lib/collection.mjs";

/* ── sync: the same Supabase row scripts/rift reads ─────────────────────────────
   The row holds everything (collection, decks, settings), so every write here is
   read-modify-write on a fresh copy: pull, change only what this page owns, write
   the whole object back. Keys this page has never heard of ride through untouched.
   A copy of the row is kept in this browser before each write (the last 5). */
const SUPA_URL = "https://gnujcqoyjovhqkquwapd.supabase.co";
const SUPA_KEY = "sb_publishable_U9pC2YEA9YB2KxPog6t3SA_T03Jid1g";
const SUPA_TABLE = "riftbound", SUPA_ID = "jay";
const H = { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, "Content-Type": "application/json" };
// rift.jayegger.com/?view=trade: a read-only trade list to hand someone at the store.
// It reads the row and never writes it.
const SHARE = new URLSearchParams(location.search).get("view") === "trade";

const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

let ROW = null;          // the synced data object, as last read
let SYNC = "loading";    // loading | ok | offline | error

function setSync(state, msg) {
  SYNC = state;
  const el = document.getElementById("sync");
  const c = { loading: "#C9A227", ok: "#3FB37F", offline: "#E07B39", error: "#E5484D" }[state];
  el.querySelector("i").style.background = c;
  const q = queue().length;
  el.querySelector("span").textContent = msg || ({ loading: "syncing", ok: q ? `${q} to send` : "synced", offline: "offline", error: "sync error" })[state];
  el.title = state === "ok" ? "Saved to the same row scripts/rift reads." :
    "Can't reach the sync row. Logged rounds wait in this browser and send when it's back; deck edits can't be saved until then.";
}

async function pull() {
  const r = await fetch(`${SUPA_URL}/rest/v1/${SUPA_TABLE}?id=eq.${SUPA_ID}&select=data`, { headers: H, cache: "no-store" });
  if (!r.ok) throw new Error(`sync ${r.status}`);
  const rows = await r.json();
  if (!rows.length || !rows[0].data) throw new Error("no state row");
  return rows[0].data;
}

function backup(data) {
  const list = ls.get("rift-app-backups", []);
  list.unshift({ at: new Date().toISOString(), data });
  while (list.length > 5) list.pop();
  if (!ls.set("rift-app-backups", list)) ls.set("rift-app-backups", list.slice(0, 1));
}

let writing = Promise.resolve();
function write(mutate) {
  // Serialized, so two quick taps can't read the same row and drop one another.
  const run = writing.then(async () => {
    if (SHARE) throw new Error("read-only view");
    setSync("loading");
    const fresh = await pull();
    backup(fresh);
    mutate(fresh);
    const r = await fetch(`${SUPA_URL}/rest/v1/${SUPA_TABLE}`, {
      method: "POST", headers: { ...H, Prefer: "resolution=merge-duplicates" },
      body: JSON.stringify({ id: SUPA_ID, data: fresh }),
    });
    if (!r.ok) throw new Error(`sync ${r.status}`);
    adopt(fresh);
    setSync("ok");
  });
  writing = run.catch(() => {});
  return run;
}

/* ── the journal queue: a tap is never lost to a bad signal at the store ────── */
const queue = () => ls.get("rift-app-queue", []);
async function flushQueue() {
  const q = queue();
  if (!q.length) return;
  try {
    await write((d) => {
      const have = new Set((d.journal || []).map((g) => g.id));
      d.journal = (d.journal || []).concat(q.filter((g) => !have.has(g.id)));
    });
    const sent = new Set(q.map((g) => g.id));
    ls.set("rift-app-queue", queue().filter((g) => !sent.has(g.id)));
    setSync("ok");
  } catch { setSync("offline"); }
}
const journal = () => {
  const sent = ROW?.journal || [];
  const ids = new Set(sent.map((g) => g.id));
  return sent.concat(queue().filter((g) => !ids.has(g.id)));
};

/* ── data ────────────────────────────────────────────────────────────────── */
let CAT, IDX, TOP, TIERS, GUIDES, NEWS, IDEAS, ARCHE, RES, BREWS, RISING, MATCH, IMG = "";
const BYNAME = new Map();        // folded legend name "Irelia, Blade Dancer" -> legend card
const SHORT = new Map();         // "OGN-042" -> "OGN-042/298": the deck feed drops the set size
const getJSON = (f) => fetch(`data/${f}`).then((r) => (r.ok ? r.json() : null)).catch(() => null);

async function loadData() {
  const [cards, extras, banned, errata, top, tiers, guides, news, ideas, arche, res, brews, rising] = await Promise.all(
    ["cards.json", "extras.json", "banned.json", "errata.json", "topdecks.json", "tiers.json", "guides.json", "news.json", "ideas.json", "archetypes.json", "research.json", "brews.json", "rising.json"].map(getJSON));
  if (!cards) throw new Error("data/cards.json did not load");
  CAT = cards; IMG = cards.imagePrefix || "";
  const all = [...cards.cards, ...((extras && extras.cards) || [])];
  // Riot's feed carries printed text; errata.json carries the current wording.
  const fix = new Map(((errata && errata.cards) || []).filter((e) => e.status === "catalog-stale" && e.name && e.new).map((e) => [e.name, e.new]));
  for (const c of all) if (fix.has(c.n)) { c.x = fix.get(c.n); c.errata = true; }
  IDX = indexCatalog(all, banned);
  MATCH = matcher(all);
  for (const c of all) if (c.t === "Legend" && !c.v) { const n = IDX.legendName(c); if (!BYNAME.has(n)) BYNAME.set(n, c); }
  for (const c of all) { const k = c.c.replace(/\/\d+$/, ""); if (!SHORT.has(k)) SHORT.set(k, c.c); }
  TOP = top; TIERS = tiers; GUIDES = guides; NEWS = news; IDEAS = ideas; ARCHE = arche; RES = res; BREWS = brews; RISING = rising;
}

/* ── hand-kept counts: Want, Trade, On the way ──────────────────────────────
   Owned counts come from riftbound.gg and are replaced on every pull, so the app never
   edits them. These three it does. Taps apply to ROW at once and go out as one write a
   moment later; anything not yet sent is laid back over every fresh copy of the row. */
const PENDING = new Map();     // code -> { w?, t?, o?, os? }
let pendTimer = null;
function applyCounts(row, code, p) {
  for (const f of ["w", "t", "o"]) if (f in p) setCount(row, code, f, p[f]);
  if ("os" in p) setSource(row, code, p.os);
}
function adopt(row) {
  ROW = row;
  for (const [code, p] of PENDING) applyCounts(ROW, code, p);
}
function editCount(code, field, val) {
  if (SHARE || !ROW) return;
  const p = PENDING.get(code) || {};
  p[field] = val;
  PENDING.set(code, p);
  applyCounts(ROW, code, { [field]: val });
  clearTimeout(pendTimer);
  pendTimer = setTimeout(flushCounts, 800);
}
async function flushCounts() {
  clearTimeout(pendTimer); pendTimer = null;
  if (!PENDING.size) return;
  const batch = new Map(PENDING);
  try {
    await write((d) => { for (const [code, p] of batch) applyCounts(d, code, p); });
    for (const [code, p] of batch) if (PENDING.get(code) === p) PENDING.delete(code);
  } catch (err) {
    setSync("offline");
    toast(`Counts not saved yet: ${err.message}`, { label: "Retry", run: flushCounts });
  }
}
window.addEventListener("beforeunload", (e) => { if (PENDING.size) { flushCounts(); e.preventDefault(); e.returnValue = ""; } });

const held = (code) => { const e = ROW?.inv?.[code] || {}; return { n: e.n || 0, f: e.f || 0, w: e.w || 0, t: e.t || 0, o: e.o || 0, os: e.os || "" }; };

/* ── the field: Riot's latest RQ with a Day 1 / Day 2 table ──────────────── */
function latestField() {
  const ev = (TOP?.events || []).find((e) => e.field && e.day1 && e.day2);
  if (!ev) return null;
  const rows = ev.field.filter((r) => r.legend).map((r) => ({
    legend: r.legend, d1: r.d1, d2: r.d2, share: r.d1 / ev.day1,
    conv: r.d2 != null ? (r.d2 / ev.day2) / (r.d1 / ev.day1) : null,
    top8: ev.decks.filter((d) => d.legend === r.legend && d.overall != null && d.overall <= 8).map((d) => d.overall).sort((a, b) => a - b),
  })).sort((a, b) => b.d1 - a.d1);
  return { ev, rows };
}
const eventName = (ev) => ev.title.replace(/[’']s? Top Decks$/i, "").replace(/’/g, "'");
function tierOf(legend) {
  const c = legendCard(legend);
  if (!c || !TIERS?.tiers) return null;
  const champ = IDX.championOf(c), epi = c.n.replace(/ - Starter$/, "");
  const hit = TIERS.tiers.find((t) => t.champion === champ && (!t.epithet || t.epithet.replace(/ - Starter$/, "") === epi));
  return hit ? hit.tier : null;
}

const NAV = [["decks", "Decks"], ["find", "Find a deck"], ["collection", "Collection"], ["guides", "Guides"], ["news", "News"]];
const BNAV = [["decks", "Decks"], ["find", "Find"], ["collection", "Collection"], ["guides", "Guides"], ["news", "News"]];
function renderNav(cur) {
  if (SHARE) { $("#nav").innerHTML = ""; $("#bnav").innerHTML = ""; return; }
  const fresh = cur === "news" ? 0 : newsBadge();
  const badge = (k) => k === "news" && fresh ? ` <span class="navbadge" aria-label="${fresh} new">${fresh > 99 ? "99+" : fresh}</span>` : "";
  const link = (cls) => ([k, label]) => `<a ${cls} href="#/${k}" ${cur === k ? 'aria-current="page"' : ""}>${label}${badge(k)}</a>`;

let DIRTY = null;   // the editor's unsaved working copy, if any
let KEEP_SCROLL = false;   // a re-render in place (new data arrived), not a navigation
let lastHash = location.hash;
window.addEventListener("hashchange", () => {
  if (DIRTY && !confirm("Leave without saving your deck changes?")) { history.replaceState(null, "", lastHash); return; }
  DIRTY = null;
  lastHash = location.hash;
  route();
});

function route() {
  let [, page = "decks", arg = ""] = (location.hash || "#/decks").split("?")[0].split("/");
  if (SHARE) { page = "collection"; arg = "trade"; }
  const key = decodeURIComponent(arg);
  renderNav(page === "deck" || page === "edit" || page === "new" ? "decks" : page === "guide" ? "guides" : page === "idea" || page === "bench" || page === "archetypes" ? "find" : page);
  const v = $("#view");
  v.onclick = null;   // the editor and the bench attach their own; never carry one to the next page
  try {
    if (page === "collection") viewCollection(key || "cards");
    else if (page === "find") v.innerHTML = viewFind(key);
    else if (page === "idea") { v.innerHTML = viewIdea(key); fillGamePlan(); }
    else if (page === "archetypes") { v.innerHTML = viewArchetypes(); if (!ARCH_MD) loadArchMd().then(() => { if (location.hash.startsWith("#/archetypes")) { KEEP_SCROLL = true; route(); } }); }
    else if (page === "bench") viewBench(key);
    else if (page === "guides") v.innerHTML = viewGuides();
    else if (page === "guide") { v.innerHTML = `<p class="dim">Loading guide…</p>`; viewGuide(key); }
    else if (page === "news") v.innerHTML = viewNews();
    else if (page === "edit" || page === "new") { v.innerHTML = ""; viewEdit(page === "new" ? null : key); }
    else v.innerHTML = viewDecks(page === "deck" ? key : null);
  } catch (e) {
    console.error(e);
    v.innerHTML = `<div class="banner bad">Something broke rendering this page: ${esc(e.message)}</div>`;
  }
  const anchor = new URLSearchParams(location.hash.split("?")[1] || "").get("at");
  if (anchor) setTimeout(() => document.getElementById(anchor)?.scrollIntoView({ block: "start" }), 50);
  else if (!KEEP_SCROLL) window.scrollTo(0, 0);
  KEEP_SCROLL = false;
}

/* ══ Decks ════════════════════════════════════════════════════════════════ */

const sortRows = (a, b) => (a.card?.e ?? 99) - (b.card?.e ?? 99) || (a.card?.n || a.code).localeCompare(b.card?.n || b.code);

/* ── one-tap journal ─────────────────────────────────────────────────────── */
function opponentsFor(d) {
  const recent = [];
  for (const g of journal().slice().reverse()) if (g.deck === d.id && g.opp !== "Other" && !recent.includes(g.opp)) recent.push(g.opp);
  const field = latestField();
  const list = [...recent.slice(0, 4)];
  for (const r of field ? field.rows : []) { if (list.length >= 9) break; if (!list.includes(r.legend)) list.push(r.legend); }
  return list;
}
function shortName(legend, all) {
  const champ = champOf(legend);
  return all.filter((x) => champOf(x) === champ).length > 1 ? legend : champ;
}
function logPanel(d) {
  const opps = opponentsFor(d);
  const rec = journalRecord(journal(), d.id);
  const all = [...BYNAME.keys()].sort();
  const mine = journal().filter((g) => g.deck === d.id && dayOf(g.at) === today());
  const r = (o) => { const x = rec.get(o); return x ? `${x.w}–${x.l}${x.d ? `–${x.d}` : ""}` : ""; };
  return `<section class="panel" id="log">
    <div class="headrow"><h2>Log a game</h2><span class="tiny dim">tap who, then W or L</span></div>
    <div>${opps.map((o) => `<div class="logrow">
      <span class="n">${esc(shortName(o, opps))} <span class="rec">${r(o)}</span></span>
      <button class="seg w" data-log="W" data-opp="${esc(o)}" aria-label="Won against ${esc(o)}">W</button>
      <button class="seg l" data-log="L" data-opp="${esc(o)}" aria-label="Lost to ${esc(o)}">L</button></div>`).join("")}
      <div class="logrow">
        <select id="opp-other" aria-label="Another legend" style="flex:1;min-width:0">
          <option value="">Another legend…</option>
          ${all.filter((n) => !opps.includes(n)).map((n) => `<option>${esc(n)}</option>`).join("")}
          <option value="Other">Other / unknown</option>
        </select>
        <button class="seg w" data-log="W" data-opp="" aria-label="Won">W</button>
        <button class="seg l" data-log="L" data-opp="" aria-label="Lost">L</button>
      </div></div>
    ${mine.length ? `<div class="today"><span class="lbl">Today</span>
      ${mine.map((g, i) => `<div class="r"><span class="num dim">${i + 1}</span><span style="flex:1">${esc(shortName(g.opp, [g.opp]))}</span>
        <span class="${g.res === "W" ? "win" : g.res === "L" ? "loss" : "draw"}">${g.res === "W" ? "Win" : g.res === "L" ? "Loss" : "Draw"}</span></div>`).join("")}
      <button class="btn" data-undo="${esc(mine[mine.length - 1].id)}" style="align-self:flex-start;min-height:36px">Undo last</button></div>`
      : `<p class="note">One tap per game. Mistake notes can come later; the record is what matters at the table.</p>`}
  </section>`;
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-log]");
  if (b) {
    const d = CURRENT;
    if (!d) return;
    let opp = b.dataset.opp;
    if (!opp) { opp = $("#opp-other")?.value; if (!opp) { toast("Pick the legend first"); return; } }
    const entry = { id: uid(), at: new Date().toISOString(), deck: d.id, opp, res: b.dataset.log };
    ls.set("rift-app-queue", queue().concat(entry));
    b.classList.add("flash");
    route();
    toast(`${b.dataset.log === "W" ? "Win" : "Loss"} vs ${shortName(opp, [opp])} logged`, { label: "Undo", run: () => undo(entry.id) });
    await flushQueue();
    if (!DIRTY && (location.hash === "" || location.hash.startsWith("#/deck"))) route();
    return;
  }
  const u = e.target.closest("[data-undo]");
  if (u) undo(u.dataset.undo);
});
async function undo(id) {
  ls.set("rift-app-queue", queue().filter((g) => g.id !== id));
  try { await write((d) => { d.journal = (d.journal || []).filter((g) => g.id !== id); }); }
  catch { setSync("offline"); toast("Couldn't reach sync; try Undo again when online"); }
  route();
}

/* ── matchups ────────────────────────────────────────────────────────────── */
function guidesFor(L) {
  if (!L || !GUIDES?.guides) return [];
  return GUIDES.guides.filter((g) => g.legend && g.legend.trim() === L.n.replace(/ - Starter$/, ""));
}
function planLinks(guides, legend) {
  const champ = champOf(legend);
  const out = [];
  for (const g of guides) for (const s of g.sections || []) {
    if (s.startsWith(legend) || s.startsWith(champ + ",") || s.startsWith(champ + " ")) out.push({ g, s });
  }
  return out;
}
function matchupsPanel(d, L) {
  const field = latestField();
  const rec = journalRecord(journal(), d.id);
  const guides = guidesFor(L);
  const names = [...new Set([...(field ? field.rows.slice(0, 10).map((r) => r.legend) : []), ...rec.keys()])].filter((n) => n !== "Other");
  const cards = names.map((n) => {
    const f = field?.rows.find((r) => r.legend === n);
    const c = legendCard(n);
    const r = rec.get(n);
    const plans = planLinks(guides, n);
    return `<article class="mcard">
      <div class="headrow"><h3 style="font-family:var(--f-body);font-weight:600;font-size:18px">${c ? `<button class="cardlink" data-card="${esc(c.c)}">${esc(n)}</button>` : esc(n)}</h3>
        <span class="num small dim">${f ? pct(f.share) : "—"}</span></div>
      <div class="dots">${dots(c?.d, 10)}<span class="tiny dim">${esc((c?.d || []).join(" / "))}</span></div>
      <dl>
        <dt class="lbl">You</dt><dd class="num">${r ? `${r.w}–${r.l}${r.d ? `–${r.d}` : ""}` : "no games yet"}</dd>
        <dt class="lbl">Field</dt><dd>${f ? `${f.conv != null ? `converts ${f.conv.toFixed(2)}` : ""}${f.top8.length ? ` · Top 8: ${f.top8.map((x) => `#${x}`).join(", ")}` : ""}` : "not in Riot's table"}</dd>
        <dt class="lbl">Plan</dt><dd>${plans.length ? plans.map((p) => `<a href="#/guide/${encodeURIComponent(p.g.slug)}?at=${slugify(p.s)}">${esc(p.g.title.split("—")[0].trim())}</a>`).join("<br>") : `<span class="dim">none yet</span>`}</dd>
      </dl></article>`;
  }).join("");
  return `<section style="display:flex;flex-direction:column;gap:14px">
    <div class="headrow"><h2>Matchups</h2>
      <span class="small dim">${field ? `Share of Day 1 at ${esc(eventName(field.ev))}, Riot's table · "converts" is Day 2 share ÷ Day 1 share` : "No field table yet"}</span></div>
    <div class="mgrid">${cards}</div></section>`;
}

/* ══ Editor ══════════════════════════════════════════════════════════════ */
function viewEdit(id) {
  const src = id ? decks().find((d) => d.id === id) : null;
  if (id && !src) { $("#view").innerHTML = `<div class="banner bad">No deck with that id.</div>`; return; }
  const W = src ? JSON.parse(JSON.stringify({ id: src.id, name: src.name, cards: src.cards || {}, sb: src.sb || {} }))
    : { id: "d" + Date.now().toString(36), name: "New deck", cards: {}, sb: {} };
  const isNew = !src;
  let q = "";
  const touch = () => { DIRTY = W; draw(); };

  const set = (zone, code, n) => {
    const m = zone === "sb" ? W.sb : W.cards;
    if (n <= 0) delete m[code]; else m[code] = n;
    touch();
  };
  const move = (from, code) => {
    const a = from === "sb" ? W.sb : W.cards, b = from === "sb" ? W.cards : W.sb;
    a[code]--; if (a[code] <= 0) delete a[code];
    b[code] = (b[code] || 0) + 1;
    touch();
  };
  const setLegend = (code) => {
    for (const k of Object.keys(W.cards)) if (IDX.BY.get(k)?.t === "Legend") delete W.cards[k];
    W.cards[code] = 1; touch();
  };

  function results() {
    const st = deckStats(W, IDX, ROW?.inv || {});
    const L = st.legend;
    const ident = new Set(L?.d || []);
    const champ = L ? IDX.championOf(L) : null;
    const own = ownedByIdentity(ROW?.inv || {}, IDX);
    const t = q.trim().toLowerCase();
    if (!t && L) return `<p class="note">Search by name, tag or rules text. Only cards inside ${esc([...ident].join(" / "))} are shown.</p>`;
    let pool = IDX.cards.filter((c) => !c.v && c.t !== "Token" && (c.t !== "Legend" || !L || t));
    if (!L) pool = pool.filter((c) => c.t === "Legend");
    if (t) pool = pool.filter((c) => `${c.n} ${IDX.legendName(c) || ""} ${(c.g || []).join(" ")} ${c.x || ""}`.toLowerCase().includes(t));
    if (L) pool = pool.filter((c) => c.t === "Legend" || (c.d || []).every((d) => d === "Colorless" || ident.has(d)));
    pool.sort((a, b) => (a.n.toLowerCase().startsWith(t) ? 0 : 1) - (b.n.toLowerCase().startsWith(t) ? 0 : 1) || a.n.localeCompare(b.n));
    pool = pool.slice(0, 30);
    if (!pool.length) return `<p class="note">No card matches${L ? ` inside ${esc([...ident].join(" / "))}` : ""}.</p>`;
    return pool.map((c) => {
      const sig = IDX.signatureOf(c);
      const blocked = sig && champ && sig !== champ ? `${sig}'s signature, not legal with ${champ}`
        : IDX.bannedNames.has(c.n) ? "Banned" : null;
      const later = IDX.notYetStandard(c);
      const inDeck = (W.cards[c.c] || 0) + (W.sb[c.c] || 0);
      const note = blocked || [inDeck ? `${inDeck} in deck` : "", `you own ${own.get(IDX.identity(c)) || 0}`, later ? (later.from ? `legal ${later.from}` : "not Standard") : "", costOf(c)].filter(Boolean).join(" · ");
      const label = c.t === "Legend" ? IDX.legendName(c) : c.n;
      return `<div class="erow"><span class="n"><button class="cardlink" data-card="${esc(c.c)}">${esc(label)}</button>
        <span class="tiny" style="display:block;color:${blocked ? "var(--bad)" : "var(--ink2)"}">${dots(c.d, 9)} ${esc(note)}</span></span>
        ${c.t === "Legend" ? `<button class="pm sm" data-act="legend" data-code="${esc(c.c)}">${L ? "Swap legend" : "Use"}</button>`
          : `<button class="pm" data-act="add" data-code="${esc(c.c)}" ${blocked ? "disabled" : ""} aria-label="Add ${esc(c.n)} to main">+</button>
             ${c.t !== "Rune" && c.t !== "Battlefield" ? `<button class="pm sm" data-act="addsb" data-code="${esc(c.c)}" ${blocked ? "disabled" : ""} aria-label="Add ${esc(c.n)} to sideboard">+SB</button>` : ""}`}
      </div>`;
    }).join("");
  }

  function draw() {
    const st = deckStats(W, IDX, ROW?.inv || {});
    const checks = deckChecks(W, IDX, st);
    const L = st.legend;
    const row = (r, zone) => `<div class="erow">
      <button class="pm" data-act="dec" data-zone="${zone}" data-code="${esc(r.code)}" aria-label="One fewer ${esc(r.card?.n || r.code)}">−</button>
      <span class="q">${r.qty}</span>
      <button class="pm" data-act="inc" data-zone="${zone}" data-code="${esc(r.code)}" aria-label="One more ${esc(r.card?.n || r.code)}">+</button>
      <span class="n">${r.card ? `<button class="cardlink" data-card="${esc(r.code)}">${esc(r.card.n)}</button>` : esc(r.code)}
        <span class="cost">${esc(costOf(r.card))}</span>
        ${r.short ? `<span class="note pill short">need ${r.short}</span>` : `<span class="note tiny dim hide-sm">own ${r.have}</span>`}</span>
      ${r.card && !["Legend", "Rune", "Battlefield"].includes(r.card.t) ? `<button class="pm sm" data-act="move" data-zone="${zone}" data-code="${esc(r.code)}" title="${zone === "sb" ? "Move one to the main deck" : "Move one to the sideboard"}">${zone === "sb" ? "→ main" : "→ SB"}</button>` : ""}
    </div>`;
    const main = st.rows.filter((r) => r.zone !== "legend");
    const grp = (title, rows, zone) => rows.length ? `<div class="group"><div class="lbl">${title} · ${rows.reduce((a, r) => a + r.qty, 0)}</div>${rows.sort(sortRows).map((r) => row(r, zone)).join("")}</div>` : "";
    const groups = ZONES.map(([t, f]) => grp(t, main.filter((r) => r.card && f(r.card)), "main")).join("") +
      grp("Not in catalog", main.filter((r) => !r.card), "main") + grp("Sideboard", st.side.slice(), "sb");
    const dot = (ok) => `background:${ok === true ? "var(--good)" : ok === "later" ? "var(--later)" : "var(--bad)"}`;
    $("#view").innerHTML = `
    <div class="headrow" style="align-items:flex-end">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <a href="${src ? `#/deck/${encodeURIComponent(src.id)}` : "#/decks"}" class="small">‹ Back${src ? ` to ${esc(src.name)}` : ""}</a>
        <label class="lbl" for="dname">Deck name</label>
        <input type="text" id="dname" value="${esc(W.name)}" style="font:700 30px var(--f-head);min-width:min(520px,80vw)">
      </div>
      <div class="btnrow">
        ${src ? `<button class="btn danger" data-act="delete">Delete</button><button class="btn" data-act="saveas">Save as copy</button>` : ""}
        <button class="btn primary" data-act="save" ${DIRTY || isNew ? "" : "disabled"}>Save</button>
      </div>
    </div>
    <div class="cols">
      <section class="panel wide">
        <div class="headrow"><h2>${L ? `<button class="cardlink" data-card="${esc(L.c)}">${esc(IDX.legendName(L))}</button>` : "Pick a legend"}</h2>
          <div class="dots">${dots(L?.d)}</div></div>
        ${main.length || st.side.length ? `<div style="display:flex;flex-direction:column;gap:18px">${groups}</div>` : `<p class="note">Empty. ${L ? "Search on the right to add cards." : "Start with a legend: search on the right."}</p>`}
      </section>
      <div class="side">
        <section class="panel">
          <h2>Checks</h2>
          ${checks.map((k) => `<div class="check"><span class="d" style="${dot(k.ok)}" aria-hidden="true"></span>
            <span class="n">${esc(k.label)}</span>
            <span class="num small">${esc(k.val)}</span>${k.ok !== true && k.detail && [].concat(k.detail).length ? `<span class="why">${esc([].concat(k.detail).slice(0, 5).join(" · "))}</span>` : ""}</div>`).join("")}
          <div class="check" style="border-top:1px solid var(--line2);padding-top:10px"><span class="n">Cards you're short</span>
            <span class="num" style="color:var(--short)">${st.mainGap.cards + st.sideGap.cards}</span></div>
        </section>
        <section class="panel">
          <label style="display:flex;flex-direction:column;gap:6px"><span class="lbl">${L ? "Add a card" : "Find a legend"}</span>
            <input type="search" id="q" value="${esc(q)}" placeholder="${L ? "Name, tag or text" : "Champion or legend name"}" autocomplete="off"></label>
          <div id="results">${results()}</div>
        </section>
      </div>
    </div>`;
    const qi = $("#q");
    qi.oninput = () => { q = qi.value; $("#results").innerHTML = results(); };
    $("#dname").oninput = (e) => { W.name = e.target.value; DIRTY = W; $("[data-act=save]").disabled = false; };
  }

  const view = $("#view");
  view.onclick = async (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const code = b.dataset.code, zone = b.dataset.zone, m = zone === "sb" ? W.sb : W.cards;
    const act = b.dataset.act;
    if (act === "inc") set(zone, code, (m[code] || 0) + 1);
    else if (act === "dec") set(zone, code, (m[code] || 0) - 1);
    else if (act === "move") move(zone, code);
    else if (act === "add") { W.cards[code] = (W.cards[code] || 0) + 1; touch(); keepSearch(); }
    else if (act === "addsb") { W.sb[code] = (W.sb[code] || 0) + 1; touch(); keepSearch(); }
    else if (act === "legend") { setLegend(code); q = ""; draw(); }
    else if (act === "save" || act === "saveas") {
      const out = { ...W, name: (W.name || "").trim() || "Untitled deck" };
      if (act === "saveas") { out.id = "d" + Date.now().toString(36); out.name = `${out.name} (copy)`; }
      b.disabled = true;
      try {
        await write((data) => {
          data.decks = data.decks || [];
          const i = data.decks.findIndex((x) => x.id === out.id);
          // Keep any field the old app stores on a deck that this editor doesn't know.
          if (i > -1) data.decks[i] = { ...data.decks[i], name: out.name, cards: out.cards, sb: out.sb };
          else data.decks.push({ id: out.id, name: out.name, cards: out.cards, sb: out.sb });
        });
        DIRTY = null;
        toast("Saved");
        location.hash = `#/deck/${encodeURIComponent(out.id)}`;
      } catch (err) {
        b.disabled = false;
        toast(`Not saved: ${err.message}. Your edits are still here.`);
      }
    } else if (act === "delete") {
      if (!confirm(`Delete "${src.name}"? This removes it everywhere, including scripts/rift.`)) return;
      try {
        await write((data) => { data.decks = (data.decks || []).filter((x) => x.id !== src.id); });
        DIRTY = null; toast("Deleted"); location.hash = "#/decks";
      } catch (err) { toast(`Not deleted: ${err.message}`); }
    }
  };
  function keepSearch() { const qi = $("#q"); if (qi) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); } }
  if (isNew) DIRTY = W;
  draw();
}

/* ══ Deck ideas: the Radiance era ════════════════════════════════════════
   data/ideas.json (scripts/build-ideas.mjs) counts what each legend plays in
   Radiance-format events and builds the list those counts add up to. Everything on
   these pages is a count with its sample size beside it; a legend with too few lists
   says so instead of getting a guess. Claude's own builds sit next to the counts and
   are labelled as builds, not as evidence. */
const ideaFor = (name) => (IDEAS?.legends || []).find((l) => l.name === name) || null;
// Data-backed builds first, then experiments (kind "experiment": a reading of the cards, untested).
const buildsFor = (name) => (IDEAS?.builds || []).filter((b) => b.legend === name).sort((a, b) => (a.kind === "experiment") - (b.kind === "experiment"));
const myLegends = () => new Set(decks().map((d) => { const L = deckStats(d, IDX, ROW?.inv || {}).legend; return L ? IDX.legendName(L) : null; }).filter(Boolean));
const shortCode = (code) => IDX.BY.has(code) ? code : (SHORT.get(String(code).replace(/\/\d+$/, "")) || code);
const placeText = (pl, n) => `#${pl}${n ? ` of ${n}` : ""}`;
const pctI = (x) => `${Math.round(x * 100)}%`;
const bar = (x) => `<span class="incbar" title="${pctI(x)} of the lists"><i style="width:${Math.round(x * 100)}%"></i></span>`;

function radianceSection() {
  if (!IDEAS?.legends?.length) return "";
  const E = IDEAS.era, mine = myLegends();
  const quiet = (IDEAS.newLegends || []).filter((n) => !ideaFor(n.name));
  const rows = IDEAS.legends.filter((l) => l.placed || l.brews >= 3)
    .sort((a, b) => (mine.has(b.name) ? 1 : 0) - (mine.has(a.name) ? 1 : 0) || 0);
  return `<section class="panel">
    <div class="headrow"><h2>Radiance${E.allPreRelease ? " — online previews" : " era"}</h2><span class="small dim">${E.events.length} Radiance-format event${E.events.length === 1 ? "" : "s"} · ${E.placed} placed lists · ${E.brews} brews · built ${esc(IDEAS.generatedAt)}</span></div>
    ${E.events.some((e) => e.preRelease) ? `<div class="banner warn"><b>${E.allPreRelease ? "These are not tournament results yet." : "Some of these are pre-release events."}</b> Radiance is not legal for sanctioned play until ${esc(E.legalFrom)}. ${E.allPreRelease ? "Every list here" : "Lists marked preview"} come${E.allPreRelease ? "s" : ""} from unsanctioned online events that played the set early, on platforms that may not implement every new card correctly, in its first week. Real games, and the earliest signal there is — not a settled format.</div>` : ""}
    <p class="note">Radiance changes every legend, not just its nine new ones, so these are the lists from events that played with it: ${E.events.map((e) => `${esc(e.name)} (${e.players ?? "?"} players, ${esc(e.date)}${e.preRelease ? ", online preview" : ""})`).join("; ") || "none yet"}. ${E.events.length < 4 ? "That is a small sample, so read 9 lists as 9 lists." : ""} Brews are unplaced lists with Radiance cards, a weaker kind of evidence.</p>
    <div class="tablewrap"><table class="t"><thead><tr><th>Legend</th><th class="r">Placed</th><th class="r">Top 8</th><th>Best</th><th class="r hide-sm">Brews</th><th>Idea</th></tr></thead>
    <tbody>${rows.map((l) => `<tr>
      <td><span class="dots" style="display:inline-flex;margin-right:6px">${dots(l.domains, 9)}</span><a href="#/idea/${encodeURIComponent(l.name)}">${esc(l.name)}</a>
        ${l.isNew ? `<span class="pill later">new</span>` : ""}${mine.has(l.name) ? ` <span class="pill good">your deck</span>` : ""}</td>
      <td class="r num">${l.placed}</td><td class="r num">${l.top8 || ""}</td>
      <td class="num">${l.best ? placeText(l.best.pl, l.best.players) : "—"}</td><td class="r num hide-sm">${l.brews}</td>
      <td class="small">${l.basis === "placed" ? `consensus of ${l.consensus.from}` : l.basis === "brews" ? `<span class="dim">from ${l.consensus.from} brews</span>` : `<span class="dim">too few lists</span>`}${buildsFor(l.name).some((b) => b.kind !== "experiment") ? ` · <b>Claude build</b>` : ""}${buildsFor(l.name).some((b) => b.kind === "experiment") ? ` · <b>untested idea</b>` : ""}</td></tr>`).join("")}</tbody></table></div>
    ${quiet.length ? `<p class="note">New legends with no lists yet: ${quiet.map((n) => esc(n.name)).join(" · ")}.</p>` : ""}
  </section>`;
}

function consensusBlock(c) {
  const grp = (title, rows) => rows.length ? `<div class="group"><div class="lbl">${title} · ${rows.reduce((a, r) => a + r.copies, 0)}</div>
    ${rows.map((r) => `<div class="row"><span class="q">${r.copies}</span><span class="n"><button class="cardlink" data-card="${esc(shortCode(r.code))}">${esc(r.name)}</button></span>
      ${bar(r.inc)}<span class="num tiny dim" style="width:34px;text-align:right">${pctI(r.inc)}</span></div>`).join("")}</div>` : "";
  const by = (t) => c.main.filter((r) => r.type === t);
  return `<div class="grid-list">${grp("Units", by("Unit"))}${grp("Spells", by("Spell"))}${grp("Gear", by("Gear"))}
    ${grp("Runes", c.runes.map((r) => ({ ...r, inc: r.inc })))}${grp("Battlefields", c.battlefields.map((b) => ({ ...b, copies: 1 })))}</div>`;
}

function viewIdea(name) {
  const l = ideaFor(name);
  const card = legendCard(name) || (l && IDX.BY.get(shortCode(l.code)));
  const builds = buildsFor(name);
  if (!l && !builds.length) return archFor(name)
    ? `<a class="small" href="#/archetypes">‹ Archetypes</a><section class="panel hero"><div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <div class="dots">${dots(card?.d)}<span class="lbl">${esc((card?.d || []).join(" / "))}</span></div>
        <h1>${card ? `<button class="cardlink" data-card="${esc(card.c)}">${esc(name)}</button>` : esc(name)}</h1>
        <div class="dim">No Radiance-era lists yet.</div></div></section>${gamePlanPanel(name)}`
    : `<a class="small" href="#/find">‹ Find a deck</a><div class="banner warn">No Radiance-era lists for ${esc(name)} yet.</div>`;
  const c = l?.consensus;
  const mine = decks().filter((d) => { const L = deckStats(d, IDX, ROW?.inv || {}).legend; return L && IDX.legendName(L) === name; });
  return `<div style="display:flex;flex-direction:column;gap:6px"><a class="small" href="#/find">‹ Find a deck</a></div>
  <section class="panel hero">
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="dots">${dots(l?.domains || card?.d)}<span class="lbl">${esc((l?.domains || card?.d || []).join(" / "))}</span>${l?.isNew ? `<span class="pill later">new in Radiance</span>` : ""}</div>
      <h1>${card ? `<button class="cardlink" data-card="${esc(card.c)}">${esc(name)}</button>` : esc(name)}</h1>
      <div class="dim">${l ? `${l.finishes.length ? `Finishes: ${l.finishes.slice(0, 8).map(([p, n]) => placeText(p, n)).join(", ")}` : "No placed finishes yet"}` : ""}</div>
    </div>
    ${l ? `<div class="stats"><div class="stat"><span class="lbl">Placed lists</span><b>${l.placed}</b></div><div class="stat"><span class="lbl">Top 8</span><b>${l.top8}</b></div><div class="stat"><span class="lbl">Brews</span><b>${l.brews}</b></div></div>` : ""}
  </section>
  ${IDEAS?.era?.allPreRelease && l?.placed ? `<div class="banner warn">Every finish on this page is from an unsanctioned online event played before Radiance was legal (${esc(IDEAS.era.legalFrom)}). Early signal, not a settled result.</div>` : ""}
  ${gamePlanPanel(name)}
  ${builds.map(buildPanel).join("")}
  ${c ? `<div class="cols"><section class="panel wide">
      <div class="headrow"><h2>Consensus list</h2><div class="btnrow"><a class="btn" href="#/bench/${encodeURIComponent(name)}?from=consensus">Tweak</a>${ROW ? `<button class="btn primary" data-copyidea="${esc(name)}">Copy to my decks</button>` : ""}</div></div>
      <p class="note">${l.basis === "placed" ? `Counted from ${c.from} placed lists${IDEAS.era.allPreRelease ? " from online preview events (unsanctioned, before release)" : ""}` : `<b>From ${c.from} brews</b>: fewer than 3 placed lists exist, so these are unplaced lists, a weaker kind of evidence`}. Each card at the number of copies most of them run, highest share first, until 40; the bar is the share of lists playing it. No sideboard: the deck feed has none.
        <b>${l.close} of ${c.from}</b> lists are within 70% of it${l.close / c.from < 0.4 ? ` — <b style="color:var(--short)">these lists disagree, so this is a blend of different decks, not a deck anyone played</b>` : ""}.${c.checks.filter((k) => k.ok === false).length ? ` <b style="color:var(--bad)">Breaks: ${esc(c.checks.filter((k) => k.ok === false).map((k) => `${k.label} (${k.val})`).join(", "))}</b>` : ""}${c.checks.some((k) => k.ok === "later") ? " Radiance cards are legal from 2026-10-23." : ""}</p>
      ${consensusBlock(c)}
    </section>
    <div class="side">
      ${c.flex.length ? `<section class="panel"><h2>Flex</h2><p class="note">Played by at least 20% of the lists but outside the 40.</p>
        <div>${c.flex.slice(0, 14).map((r) => `<div class="row"><span class="n"><button class="cardlink" data-card="${esc(shortCode(r.code))}">${esc(r.name)}</button></span>${bar(r.inc)}<span class="num tiny dim" style="width:34px;text-align:right">${pctI(r.inc)}</span></div>`).join("")}</div></section>` : ""}
      <section class="panel"><h2>Since Vendetta</h2>
        ${l.changes ? `<p class="note">Against ${l.changes.vs} placed Vendetta lists of ${esc(champOf(name))} since ${esc(l.changes.since)}.</p>
          ${l.changes.added.length ? `<div class="lbl">In</div>${l.changes.added.map((r) => `<div class="row"><span class="n"><button class="cardlink" data-card="${esc(shortCode(r.code))}">${esc(r.name)}</button>${r.radiance ? ` <span class="pill later">RAD</span>` : ""}</span><span class="num tiny">${pctI(r.before)} → <b>${pctI(r.now)}</b></span></div>`).join("")}` : ""}
          ${l.changes.dropped.length ? `<div class="lbl" style="margin-top:8px">Out</div>${l.changes.dropped.map((r) => `<div class="row"><span class="n"><button class="cardlink" data-card="${esc(shortCode(r.code))}">${esc(r.name)}</button></span><span class="num tiny">${pctI(r.before)} → <b>${pctI(r.now)}</b></span></div>`).join("")}` : ""}
          ${!l.changes.added.length && !l.changes.dropped.length ? `<p class="note">Nothing moved by much.</p>` : ""}`
          : `<p class="note">${l.isNew ? "A new legend: there are no Vendetta lists to compare." : `Fewer than 3 placed Vendetta lists of ${esc(champOf(name))} to compare against.`}</p>`}
      </section>
      ${mine.length ? mine.map((d) => `<section class="panel">${diffBlock(d, l)}</section>`).join("") : ""}
    </div></div>` : `<div class="banner warn">${l ? `${l.placed} placed list${l.placed === 1 ? "" : "s"} and ${l.brews} brew${l.brews === 1 ? "" : "s"}: too few to count a consensus from.` : ""}</div>`}
  ${c ? `<section class="panel"><h2>Engines</h2><p class="note">What the consensus is built to do over and over, read off its cards' text, and the legal cards that would feed it — Radiance cards nobody has tried yet included.</p>${enginesBlock(Object.fromEntries(Object.entries(c.cards).map(([k, n]) => [shortCode(k), n])), l.shares || {})}</section>` : ""}
  ${l?.lists?.length ? `<section style="display:flex;flex-direction:column;gap:14px"><h2>The lists</h2>
    <div class="mgrid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${l.lists.map((x, i) => eraList(name, x, i)).join("")}</div></section>` : ""}`;
}

function eraList(name, x, i) {
  const rows = Object.entries(x.cards).map(([code, n]) => ({ code: shortCode(code), n, c: IDX.BY.get(shortCode(code)) })).filter((r) => r.c && r.c.t !== "Legend")
    .sort((a, b) => ["Unit", "Spell", "Gear", "Rune", "Battlefield"].indexOf(a.c.t) - ["Unit", "Spell", "Gear", "Rune", "Battlefield"].indexOf(b.c.t) || (a.c.e ?? 99) - (b.c.e ?? 99));
  const rad = rows.filter((r) => r.c.s === "RAD").reduce((a, r) => a + r.n, 0);
  return `<article class="panel">
    <div class="headrow"><h3>${esc(x.brew ? "Brew" : placeText(x.pl, x.players))}</h3><span class="small dim">${esc(x.dt || "")}</span></div>
    <div class="small dim">${esc(x.h || "")}${x.ev ? ` · ${esc(x.ev)}` : ""} · ${rad} Radiance card${rad === 1 ? "" : "s"}${x.overlap != null ? ` · ${pctI(x.overlap)} like the consensus` : ""}</div>
    ${x.overlap != null && x.overlap < 0.5 ? `<div class="pill later" style="align-self:flex-start">a different build</div>` : ""}
    ${!x.runes ? `<div class="banner warn">The feed carries this list without its runes.</div>` : ""}
    <details><summary class="btn" style="width:max-content">Show the list</summary>
      <div style="margin-top:10px">${rows.map((r) => `<div class="row"><span class="q">${r.n}</span><span class="n"><button class="cardlink" data-card="${esc(r.code)}">${esc(r.c.n)}</button>${r.c.s === "RAD" ? ` <span class="pill later">RAD</span>` : ""}</span></div>`).join("")}</div></details>
    <div class="btnrow"><a class="btn" href="#/bench/${encodeURIComponent(name)}?from=${encodeURIComponent("list:" + i)}">Tweak</a>${ROW ? `<button class="btn" data-copyera="${esc(name)}|${i}">Copy to my decks</button>` : ""}</div>
  </article>`;
}

// Your deck against the consensus for its legend: what most lists play that you don't,
// and what you play that few of them do. Names, not printings, so an alt art counts.
function diffBlock(d, l) {
  const c = l?.consensus;
  if (!c) return `<h2>Radiance update</h2><p class="note">Not enough Radiance-era lists of this legend to compare against yet.</p>`;
  const nameOf = (code) => IDX.BY.get(code)?.n;
  const have = new Map();
  for (const [code, q] of Object.entries(d.cards || {})) { const n = nameOf(code); if (n) have.set(n, (have.get(n) || 0) + q); }
  const inc = new Map([...c.main, ...c.flex].map((r) => [r.name, r.inc]));
  const add = c.main.filter((r) => (have.get(r.name) || 0) < r.copies && r.inc >= 0.5)
    .map((r) => ({ r, n: r.copies - (have.get(r.name) || 0) }));
  const typeOf = (n) => IDX.cards.find((x) => x.n === n)?.t;
  const cut = [...have].filter(([n]) => !["Rune", "Legend", "Battlefield"].includes(typeOf(n)) && (inc.get(n) || 0) < 0.2);
  return `<div class="headrow"><h2>Radiance update</h2><span class="small dim">${esc(d.name)}</span></div>
    <p class="note">Against ${c.from} ${l.basis === "placed" ? "placed" : "brewed"} Radiance-era lists of this legend. A count, not a verdict — your list may be built for a different plan.</p>
    ${add.length ? `<div class="lbl">Most lists play, you don't (or fewer)</div>${add.map(({ r, n }) => `<div class="row"><span class="q">+${n}</span><span class="n"><button class="cardlink" data-card="${esc(shortCode(r.code))}">${esc(r.name)}</button></span><span class="num tiny dim">${pctI(r.inc)}</span></div>`).join("")}` : `<p class="note">You already run everything at least half the lists play.</p>`}
    ${cut.length ? `<div class="lbl" style="margin-top:8px">You play, under 20% of lists do</div>${cut.map(([n, q]) => `<div class="row"><span class="q">${q}</span><span class="n">${esc(n)}</span><span class="num tiny dim">${pctI(inc.get(n) || 0)}</span></div>`).join("")}` : ""}
    <div class="btnrow"><a class="btn" href="#/bench/${encodeURIComponent(l.name)}?from=${encodeURIComponent("deck:" + d.id)}">Tweak this deck</a>
      <a class="btn" href="#/idea/${encodeURIComponent(l.name)}">Consensus and lists</a></div>`;
}

function buildPanel(b) {
  const st = deckStats({ cards: Object.fromEntries(Object.entries(b.cards).map(([k, n]) => [shortCode(k), n])), sb: b.sb || {} }, IDX, ROW?.inv || {});
  const rows = st.rows.filter((r) => r.card && r.zone !== "legend");
  const grp = (t) => rows.filter((r) => r.card.t === t).sort(sortRows);
  const list = (title, rs) => rs.length ? `<div class="group"><div class="lbl">${title} · ${rs.reduce((a, r) => a + r.qty, 0)}</div>${rs.map((r) => `<div class="row"><span class="q">${r.qty}</span><span class="n"><button class="cardlink" data-card="${esc(r.code)}">${esc(r.card.n)}</button></span><span class="cost hide-sm">${esc(costOf(r.card))}</span></div>`).join("")}</div>` : "";
  const exp = b.kind === "experiment";
  return `<section class="panel build ${exp ? "experiment" : ""}">
    <div class="headrow"><div><span class="lbl">${exp ? "Untested idea · Claude" : "Claude build"} · ${esc(b.date)}</span><h2>${esc(b.title)}</h2></div><div class="btnrow"><a class="btn" href="#/bench/${encodeURIComponent(b.legend)}?from=${encodeURIComponent("build:" + b.id)}">Tweak</a>${ROW ? `<button class="btn primary" data-copybuild="${esc(b.id)}">Copy to my decks</button>` : ""}</div></div>
    ${b.drift?.stale ? `<div class="banner warn"><b>The field has moved since this build (${esc(b.drift.since)}).</b>
      ${b.drift.newEvents.length ? `${b.drift.newEvents.length} new event${b.drift.newEvents.length === 1 ? "" : "s"}: ${b.drift.newEvents.map((e) => `${esc(e.name)} (${e.players ?? "?"} players${e.preRelease ? ", online preview" : ""})`).join("; ")}. ` : ""}
      Placed ${esc(champOf(b.legend))} lists ${b.drift.listsThen} → ${b.drift.listsNow}.
      ${b.drift.moved.length ? `Moved: ${b.drift.moved.map((r) => `${esc(r.name)} ${pctI(r.was)} → ${pctI(r.now)}${r.inBuild ? "" : " (not in this build)"}`).join(", ")}.` : ""}
      It is due a revision; until then it is the list as written.</div>` : b.drift ? `<p class="tiny dim" style="margin:0">Checked against today's lists: the field has not moved since this was written.</p>` : ""}
    <p>${esc(b.summary)}</p>
    <div class="cols"><div class="wide" style="flex:999 1 420px;min-width:0"><div class="grid-list">${list("Units", grp("Unit"))}${list("Spells", grp("Spell"))}${list("Gear", grp("Gear"))}${list("Runes", grp("Rune"))}${list("Battlefields", grp("Battlefield"))}</div></div>
      <div class="side" style="gap:12px">
        <div><div class="lbl">Built from</div><p class="small">${esc(b.basis)}</p></div>
        ${b.changes?.length ? `<div><div class="lbl">Changes, and why</div>${b.changes.map((x) => `<p class="small"><b>${esc(x.what)}</b> — ${esc(x.why)}</p>`).join("")}</div>` : ""}
        <div><div class="lbl">Plan</div>${b.plan.map((x) => `<p class="small">${esc(x)}</p>`).join("")}</div>
        ${b.matchups?.length ? `<div><div class="lbl">Matchups</div>${b.matchups.map((m) => `<p class="small"><b>${esc(m.vs)}</b> — ${esc(m.note)}</p>`).join("")}</div>` : ""}
        ${b.sim ? `<div><div class="lbl">Goldfish (scripts/sim)</div><p class="small">${esc(b.sim)}</p></div>` : ""}
      </div></div>
  </section>`;
}

async function saveNewDeck(deck, label) {
  try {
    await write((data) => { data.decks = (data.decks || []).concat(deck); });
    toast(`${label} copied to your decks`, { label: "Open", run: () => (location.hash = `#/deck/${deck.id}`) });
  } catch (err) { toast(`Not copied: ${err.message}`); }
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-copyidea]"), b = e.target.closest("[data-copyera]"), c = e.target.closest("[data-copybuild]");
  if (a) {
    const l = ideaFor(a.dataset.copyidea), k = l.consensus;
    const cards = Object.fromEntries(Object.entries(k.cards).map(([code, n]) => [shortCode(code), n]));
    saveNewDeck({ id: "d" + Date.now().toString(36), name: `${champOf(l.name)} — Radiance consensus (${k.from} lists, ${IDEAS.generatedAt})`, cards, sb: {} }, "Consensus");
  } else if (b) {
    const [name, i] = b.dataset.copyera.split("|"), x = ideaFor(name).lists[Number(i)];
    const cards = Object.fromEntries(Object.entries(x.cards).map(([code, n]) => [shortCode(code), n]));
    saveNewDeck({ id: "d" + Date.now().toString(36), name: `${champOf(name)} — ${x.brew ? "brew" : placeText(x.pl, x.players)}, ${x.ev || x.h || ""}`.slice(0, 90), cards, sb: {} }, "List");
  } else if (c) {
    const x = (IDEAS.builds || []).find((y) => y.id === c.dataset.copybuild);
    const fix = (m) => Object.fromEntries(Object.entries(m || {}).map(([code, n]) => [shortCode(code), n]));
    saveNewDeck({ id: "d" + Date.now().toString(36), name: `${x.title} (Claude, ${x.date})`, cards: fix(x.cards), sb: fix(x.sb) }, "Build");
  }
});

/* ══ Combos: what the data says goes together, and what the text says feeds what ═══
   data/synergy.json (scripts/build-synergy.mjs) is counted: cards played together far
   more often than lists that could play both would suggest. lib/engines.mjs is read off
   card text: payoffs and the cards that trigger them, so a new card with no lists can
   still be found. The first is evidence; the second is a reading, and says so. */
let SYN = null, SYN_LOADING = null;
function loadSyn() {
  if (SYN) return Promise.resolve(SYN);
  return SYN_LOADING || (SYN_LOADING = getJSON("synergy.json").then((d) => (SYN = d)));
}
function goesWithBlock(name) {
  const s = SYN?.cards?.[name];
  if (!SYN) return `<p class="tiny dim" style="margin:0">Loading what this goes with…</p>`;
  if (!s) return `<p class="tiny dim" style="margin:0">Too few lists to say what it goes with.</p>`;
  return `<div class="tiny" style="display:flex;flex-direction:column;gap:4px">
    ${s.legends.length ? `<div><b>Played by</b> ${s.legends.map((l) => `${esc(l.name)} ${pctI(l.share)}`).join(" · ")}</div>` : ""}
    ${s.with.length ? `<div><b>Goes with</b> ${s.with.map((w) => `${esc(w.name)}${w.rad ? "*" : ""} ${pctI(w.share)}`).join(" · ")}</div>` : ""}
    <div class="dim">Of the ${s.n} lists playing it; only partners at ${2}× their usual rate or more. * = Radiance.</div></div>`;
}
function enginesBlock(cards, shares, { addable = false, max = 3 } = {}) {
  // A long-legal card the legend's winners skip is a question, not a suggestion
  // (data/research.json): it is listed apart, with its answer if it has one.
  const L = Object.keys(cards).map((k) => IDX.BY.get(k)).find((c) => c?.t === "Legend");
  const legend = L ? IDX.legendName(L) : null;
  const E = annotateEngines(deckEngines(cards, IDX, { shares, max: 40 }), RES, legend).slice(0, max)
    .map((e) => ({ ...e, more: e.more + Math.max(0, e.candidates.length - 6), candidates: e.candidates.slice(0, 6) }));
  const known = ENGINES.map((e) => e.name.toLowerCase()).join(", ");
  if (!E.length) return `<p class="note">No engine found in this list's text: no card here pays off a repeated event this reader knows (${esc(known)}).</p>`;
  // Only a loop (the legend in it, or four copies each of payoff and feeder) is an engine;
  // a curve, removal or ramp deck has none, and its stray patterns are shown as just that.
  const none = !E[0].loop ? `<p class="note">No engine: nothing here loops — the legend is in none of these, and none has four copies each of a payoff and something else feeding it. A curve, removal or ramp deck reads this way. The patterns below are incidental.</p>` : "";
  const names = (xs) => xs.map((x) => `${x.qty} ${esc(x.legend ? "the legend" : x.name)}`).join(", ");
  return none + E.map((e) => `<div class="engine">
    <div class="headrow"><h3>${esc(e.name)}${e.loop ? "" : ` <span class="tiny dim">· incidental</span>`}</h3><span class="tiny dim">${esc(e.what)}</span></div>
    <div class="small"><b>Pays off:</b> ${names(e.payoffs)}${e.enablers.length ? ` · <b>Feeds it:</b> ${names(e.enablers)}` : ""}</div>
    ${e.candidates.length ? `<div class="lbl" style="margin-top:6px">Could add</div>${e.candidates.map((c) => `<div class="erow" style="align-items:flex-start">
      <span class="n"><button class="cardlink" data-card="${esc(c.code)}">${esc(c.name)}</button>${c.set === "RAD" ? ` <span class="pill later">RAD</span>` : ""}
        <span class="tiny dim" style="display:block">${esc(c.roles.includes("payoff") ? "pays off" : "feeds it")}: “${esc(c.text)}”</span></span>
      <span class="num tiny dim" style="white-space:nowrap">${c.share != null ? `${pctI(c.share)} play it` : "untried"}</span>
      ${addable ? `<button class="pm" data-b="add" data-code="${esc(c.code)}" aria-label="Add ${esc(c.name)}">+</button>` : ""}</div>`).join("")}` : ""}
    ${e.held.length ? `<div class="lbl" style="margin-top:6px">Winners skip these</div><p class="tiny dim" style="margin:0">${e.held.map((c) => `<button class="cardlink" data-card="${esc(c.code)}">${esc(c.name)}</button> ${Math.round(c.research.share * c.research.placed)}/${c.research.placed}`).join(" · ")}
      — ${(() => { const a = e.held.find((c) => c.research.answer); return a ? `${esc(VERDICTS[a.research.verdict] || "")}: ${esc(a.research.answer)}` : e.held.some((c) => c.research.id) ? `an <a href="#/idea/${encodeURIComponent(legend)}">open question</a>: the placed lists know something the text doesn't.` : "nobody plays them anywhere much."; })()}</p>` : ""}
  </div>`).join("") + `<p class="tiny dim" style="margin:0">Read off card text by pattern, not tested: it can't see timing, targets or whether two cards really combo. "Untried" means no list in these events plays it.</p>`;
}

/* ══ Archetypes ════════════════════════════════════════════════════════════
   What each legend's deck is for. data/archetypes.json is measured (the representative
   list's mix, curve, interaction, goldfish speed, engines, signature package);
   docs/archetypes.md is the hand-written game plan, one "### <legend> — <archetype>"
   section each, under "## <pair> — <character>". The page shows both side by side. */
let ARCH_MD = null, ARCH_LOADING = null;
function loadArchMd() {
  if (ARCH_MD) return Promise.resolve(ARCH_MD);
  return ARCH_LOADING || (ARCH_LOADING = fetch("docs/archetypes.md").then((r) => (r.ok ? r.text() : "")).catch(() => "").then((md) => {
    const legends = new Map(), pairs = new Map();
    let pair = null;
    for (const block of md.split(/^(?=##+ )/m)) {
      const h = /^(##+) (.+)$/m.exec(block);
      if (!h) continue;
      const [title, kind] = h[2].split(/ — /);
      if (h[1] === "##") { pair = title.trim().replace(/\s*\/\s*/g, "/"); pairs.set(pair, { character: (kind || "").trim(), body: block.slice(h[0].length).trim() }); }
      else legends.set(title.trim(), { archetype: (kind || "").replace(/\*.*$/, "").replace(/[\s·]+$/, "").trim(), body: block.slice(h[0].length).trim(), pair });
    }
    return (ARCH_MD = { legends, pairs });
  }));
}
const archFor = (name) => (ARCHE?.legends || []).find((l) => l.name === name) || null;
const guideLink = (u) => {
  const base = u.split("#")[0].split("/").pop();
  const hit = (GUIDES?.guides || []).find((x) => x.file.split("/").pop() === base);
  return hit ? `#/guide/${encodeURIComponent(hit.slug)}` : null;
};
// The archetype read off the cards alone (lib/infer.mjs), layer by layer: legend, chosen
// champion, signature, colour pair, then the cards that should (or can) be in it.
function inferredLine(a) {
  const f = a?.inferred;
  if (!f?.main) return "";
  // Only the sub-archetype: the inferred MAIN (aggro…ramp) is about half right — pace is how a
  // deck is played, which card text barely shows — so the heading's word stands alone.
  // When the cards' read disagrees with the heading, the heading stands (guides and results);
  // the read is shown as a disagreement, not a second label.
  const off = f.agrees === false;
  return `<details class="small" style="margin:4px 0"><summary><b>${off ? "From the cards alone" : "Built on, from the cards"}:</b> ${esc(f.subName || "")}
      <span class="dim">(also ${f.subs.slice(1).map((x) => esc(x.name)).join(", ")})${off ? " — the heading above, from guides and results, reads it differently, and wins" : ""}</span></summary>
    <ol class="tiny" style="margin:4px 0 0 18px">${f.layers.map((l) => `<li><b>${esc(l.name)}</b>${l.cards.length ? ` (${esc(l.cards.slice(0, 3).join(", "))})` : ""}${l.sub.length ? `: ${esc(l.sub.join(", "))}` : ""}
      ${l.evidence.length ? `<span class="dim"> — ${esc(l.evidence.slice(0, 3).map((e) => `${e.card}: ${e.why.concat(e.sub).slice(0, 3).join(", ")}`).join("; "))}</span>` : ""}</li>`).join("")}</ol>
    <p class="tiny dim" style="margin:2px 0 0">Pattern-matched from card text, earlier layers weighing more. It reads what a deck is built on; whether it plays aggro or midrange is the heading's call, from guides and results.</p></details>`;
}
function profileLine(a) {
  if (!a?.profile) return `<p class="note">No lists in the snapshot to measure.</p>${inferredLine(a)}`;
  const p = a.profile;

    $("#bench-src").onchange = (e) => { src = sources.find((x) => x.key === e.target.value); W = { ...src.cards }; history.replaceState(null, "", `#/bench/${encodeURIComponent(name)}?from=${encodeURIComponent(src.key)}`); draw(); runSims(true); };
    const qi = $("#bench-q");
    qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; draw(); const n = $("#bench-q"); n.focus(); n.setSelectionRange(pos, pos); };
  }
  v.onclick = async (e) => {
    const b = e.target.closest("[data-b]");
    if (!b) return;
    const k = b.dataset.b, code = b.dataset.code;
    if (k === "inc" || k === "add") W[code] = (W[code] || 0) + 1;
    else if (k === "dec") { W[code] = (W[code] || 0) - 1; if (W[code] <= 0) delete W[code]; }
    else if (k === "reset") W = { ...src.cards };
    else if (k === "save") {
      const deck = { id: "d" + Date.now().toString(36), name: `${champOf(name)} — tweaked from ${src.label.replace(/^Your deck: /, "")}`.slice(0, 90), cards: { ...W }, sb: {} };
      await saveNewDeck(deck, "Tweaked list");
      return;
    }
    curSim = null;      // show the pending run at once, not the previous list's numbers
    draw();
    if (k !== "save") { clearTimeout(simTimer); simTimer = setTimeout(() => runSims(false), 450); }
  };
  draw();
  runSims(true);
  if (!SYN) loadSyn().then(() => { if (location.hash.startsWith("#/bench")) draw(); });
}

/* ══ Collection ══════════════════════════════════════════════════════════
   A mirror of riftbound.gg, where cards get entered (its scanner beats typing). Owned
   counts arrive by a pull on every load; this page browses them, keeps the three counts
   riftbound.gg doesn't (Want, Trade, On the way), and carries the Piltover worklist. */
const DEFAULT_SYNC_URL = "https://rift-sync.jcegger.workers.dev";   // worker/, in front of the public profile
const syncUrl = () => ROW?.syncUrl || DEFAULT_SYNC_URL;
const playset = () => ROW?.playset || 3;
const stamp = () => new Date().toISOString().slice(0, 16).replace("T", " ");   // UTC, the old app's format
const ago = (t) => {
  const ms = Date.now() - (t instanceof Date ? t.getTime() : Date.parse(String(t).replace(" ", "T") + "Z"));
  if (!Number.isFinite(ms)) return "at an unknown time";
  const m = Math.round(ms / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 48 * 60 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
};
// Key order differs between a row and the same row after an import, so compare sorted.
const stable = (o) => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v)
  ? Object.fromEntries(Object.entries(v).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))) : v);
const copiesIn = (inv) => Object.values(inv || {}).reduce((a, e) => a + (e.n || 0) + (e.f || 0), 0);
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); toast(`${what} copied`); } catch { toast("Couldn't reach the clipboard"); }
}

/* ── the pull ────────────────────────────────────────────────────────────── */
let PULL = { state: "idle" };   // this session's pull: idle | pulling | ok | held | error
let LAST = null;                // the last import's report, from a pull or a file
async function pullCollection({ force = false } = {}) {
  if (!ROW || SHARE || PULL.state === "pulling") return;
  PULL = { state: "pulling" }; paintPull();
  try {
    const r = await fetch(syncUrl(), { cache: "no-store" });
    const body = await r.text();
    if (!r.ok) throw new Error(body.trim().slice(0, 200) || `HTTP ${r.status}`);
    const payload = JSON.parse(body);
    // A private profile or a renamed account comes back 200 with an empty collection.
    // Applied, that would zero every owned count, so it is refused outright.
    if (!Array.isArray(payload.collection) || !payload.collection.length)
      throw new Error("riftbound.gg sent back an empty collection (is the profile still public?). Nothing was changed.");
    const trial = JSON.parse(JSON.stringify({ inv: ROW.inv || {}, tags: ROW.tags || {}, newq: ROW.newq || {}, mirrorTradeWish: ROW.mirrorTradeWish }));
    let rep = applyImport(trial, body, MATCH);
    const before = copiesIn(ROW.inv), after = copiesIn(trial.inv);
    // Losing half the collection in one pull is far likelier a feed problem than a sale.
    if (!force && before > 50 && after < before / 2) { PULL = { state: "held", at: new Date(), before, after }; paintPull(); return; }
    const changed = stable(trial.inv) !== stable(ROW.inv || {}) || stable(trial.tags) !== stable(ROW.tags || {}) || stable(trial.newq) !== stable(ROW.newq || {});
    if (changed) await write((d) => { rep = applyImport(d, body, MATCH); d.lastSyncAt = stamp(); });
    LAST = { ...rep, via: "riftbound.gg", at: new Date() };
    PULL = { state: "ok", at: new Date(), changed };
  } catch (e) {
    PULL = { state: "error", at: new Date(), error: e.message };
  }
  paintPull();
}
function pullLine() {
  const P = PULL;
  if (P.state === "pulling") return `<span class="dim">Pulling from riftbound.gg…</span>`;
  if (P.state === "error") return `<span style="color:var(--bad)">riftbound.gg pull failed: ${esc(P.error)}</span>`;
  if (P.state === "held") return `<span style="color:var(--short)">riftbound.gg says ${P.after} cards, down from ${P.before}. Not applied.</span>
    <button class="btn" data-pull="force" style="min-height:36px">Apply anyway</button>`;
  const last = ROW?.lastSyncAt ? `last change pulled ${ago(ROW.lastSyncAt)}` : "never pulled";
  if (P.state === "ok") return `<span class="dim">riftbound.gg checked ${ago(P.at)} · ${P.changed && LAST ? `${LAST.added} new, ${LAST.changed} changed, ${LAST.cleared} gone` : "no changes"}</span>`;
  return `<span class="dim">${ROW?.autoSync === false ? "Pull on load is off" : "Mirrors riftbound.gg"} · ${last}</span>`;
}
function paintPull() {
  for (const el of document.querySelectorAll("[data-pullline]")) el.innerHTML = pullLine();
  if (PULL.state !== "ok" || !PULL.changed) return;
  // New counts: anything showing readiness or the collection is out of date.
  const h = location.hash;
  const typing = document.activeElement?.matches?.("input,textarea,select");
  if (h.startsWith("#/collection") && !h.startsWith("#/collection/") ) { paintCollHead(); drawGrid(); }
  else if (!DIRTY && !typing && (h === "" || h.startsWith("#/deck") || h.startsWith("#/collection"))) { KEEP_SCROLL = true; route(); }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-pull]");
  if (b) pullCollection({ force: b.dataset.pull === "force" });
});

/* ── shared header ───────────────────────────────────────────────────────── */
const SUBS = [["cards", "Cards"], ["sets", "Sets"], ["trade", "Trade"], ["import", "Import"]];

  return { copies, printings, foils, names: names.size };
}

/* ── Cards ───────────────────────────────────────────────────────────────── */
const CF = Object.assign({ q: "", set: "", type: "", dom: "", show: "", tag: "", sort: "set", prints: "all", view: "grid" }, ls.get("rift-app-cfilter", {}));
const SHOW = [["", "Everything"], ["own", "Owned"], ["missing", "Not owned"], ["deck", "My decks are short"],
  ["want", "Wanted"], ["spare", "Spare (past playset)"], ["trade", "Marked for trade"], ["way", "On the way"], ["foil", "Foils"]];
const SORTS = [["set", "Set order"], ["name", "Name"], ["energy", "Energy cost"], ["owned", "Most owned"]];
let FILTERED = [], DRAWN = 0, CTX = null;
function cardsCtx() {
  const own = ownedByIdentity(ROW.inv, IDX);
  const spare = new Set(spares(ROW.inv, IDX, playset()).map((x) => x.id));
  const short = new Set([...myNeeds().entries()].filter(([, n]) => n.decks.length).map(([id]) => id));
  return { own, spare, short };
}
function cfMatch(c) {
  if (CF.set && c.s !== CF.set) return false;
  if (CF.type && c.t !== CF.type) return false;
  if (CF.dom && !(c.d || []).includes(CF.dom)) return false;
  if (CF.prints === "base" && c.v) return false;
  if (CF.tag) {
    const neg = CF.tag[0] === "!";
    if ((ROW.tags?.[c.c] || []).includes(neg ? CF.tag.slice(1) : CF.tag) === neg) return false;
  }
  const h = held(c.c), q = h.n + h.f;
  if (CF.show === "own" && !q) return false;
  if (CF.show === "missing" && q) return false;
  if (CF.show === "want" && h.w <= q) return false;
  if (CF.show === "trade" && !h.t) return false;
  if (CF.show === "way" && !h.o) return false;
  if (CF.show === "foil" && !h.f) return false;
  if (CF.show === "spare" && (!q || !CTX.spare.has(IDX.identity(c)))) return false;
  if (CF.show === "deck" && (c.v || !CTX.short.has(IDX.identity(c)))) return false;
  if (CF.q) {
    const hay = `${c.n} ${c.c} ${IDX.legendName(c) || ""} ${(c.g || []).join(" ")} ${(c.a || []).join(" ")} ${c.t} ${c.r} ${c.x || ""}`.toLowerCase();
    if (!hay.includes(CF.q.toLowerCase())) return false;
  }
  return true;
}
const setRank = (id) => { const i = CAT.sets.findIndex((x) => x.id === id); return i < 0 ? 99 : i; };
function cfSort(list) {
  const q = (c) => { const h = held(c.c); return h.n + h.f; };
  const by = {
    set: (a, b) => setRank(a.s) - setRank(b.s) || (a.no ?? 0) - (b.no ?? 0) || a.c.localeCompare(b.c),
    name: (a, b) => a.n.localeCompare(b.n) || a.c.localeCompare(b.c),
    energy: (a, b) => (a.e ?? 99) - (b.e ?? 99) || a.n.localeCompare(b.n),
    owned: (a, b) => q(b) - q(a) || a.n.localeCompare(b.n),

  return list.sort(by[CF.sort] || by.set);
}
function viewCards() {
  const sets = [...new Set(IDX.cards.map((c) => c.s))].sort((a, b) => setRank(a) - setRank(b)).map((id) => [id, (CAT.sets.find((x) => x.id === id) || {}).name || id]);
  const types = [...new Set(IDX.cards.map((c) => c.t).filter(Boolean))].sort();
  const tags = [...new Set(Object.values(ROW.tags || {}).flat())].sort();
  const opt = (val, list) => list.map(([k, l]) => `<option value="${esc(k)}" ${val === k ? "selected" : ""}>${esc(l)}</option>`).join("");
  return `<section class="panel" style="gap:16px">
    <div class="filters">
      <input type="search" id="cf-q" value="${esc(CF.q)}" placeholder="Name, code, tag, artist or text" autocomplete="off" aria-label="Search cards">
      <select id="cf-show" aria-label="Show">${opt(CF.show, SHOW)}</select>
      <select id="cf-set" aria-label="Set">${opt(CF.set, [["", "All sets"], ...sets])}</select>
    </div>
    <details class="more" ${CF.type || CF.dom || CF.tag || CF.prints !== "all" ? "open" : ""}><summary class="small">More filters and sorting</summary>
      <div class="filters" style="margin-top:10px">
      <select id="cf-type" aria-label="Type">${opt(CF.type, [["", "All types"], ...types.map((t) => [t, t])])}</select>
      <select id="cf-dom" aria-label="Domain">${opt(CF.dom, [["", "All domains"], ...["Fury", "Calm", "Mind", "Body", "Chaos", "Order", "Colorless"].map((d) => [d, d])])}</select>

// Completion counts the numbered base cards only, so alt arts, signatures, overnumbers,
// tokens and basic runes never inflate the denominator. One copy in any finish owns it.
function viewSets() {
  const RAR = ["Common", "Uncommon", "Rare", "Epic", "Showcase"];
  const have = (c) => { const h = held(c.c); return h.n + h.f; };
  const rows = CAT.sets.map((s) => {
    const mine = IDX.cards.filter((c) => c.s === s.id);
    const base = mine.filter((c) => !c.v);
    const got = base.filter((c) => have(c)).length, play = base.filter((c) => have(c) >= playset()).length;
    const p = base.length ? got / base.length : 0;
    const byR = RAR.map((r) => { const g = base.filter((c) => c.r === r); return g.length ? `${g.filter(have).length}/${g.length} ${r.toLowerCase()}` : ""; }).filter(Boolean).join(" · ");
    const byV = Object.entries(VLABEL).filter(([v]) => v !== "token" && v !== "rune").map(([v, l]) => { const g = mine.filter((c) => c.v === v); return g.length ? `${g.filter(have).length}/${g.length} ${l.toLowerCase()}` : ""; }).filter(Boolean).join(" · ");

      <div class="tiny dim">${play}/${base.length} at a ${playset()}-of playset · ${byR}${byV ? `<br>${byV}` : ""}</div></div>`;

// What you're short of: your explicit wants, plus every card your own decks are short of
// (the most any one deck needs, since one set of copies serves all of them), less
// whatever is already on the way.
function myNeeds() {
  const need = new Map();
  const bump = (card, qty, why) => {
    const id = IDX.identity(card);
    if (!id || qty <= 0) return;
    const e = need.get(id) || { card, qty: 0, why: [], decks: [] };
    e.qty = Math.max(e.qty, qty);
    if (why === "want") e.why.push("want"); else { e.why.push(why); e.decks.push(why); }
    if (!card.v && e.card.v) e.card = card;
    need.set(id, e);
  };
  for (const [code, e] of Object.entries(ROW.inv || {})) {
    const c = IDX.BY.get(code);
    if (c && (e.w || 0) > (e.n || 0) + (e.f || 0)) bump(c, e.w - (e.n || 0) - (e.f || 0), "want");
  }
  for (const d of decks()) {
    const st = deckStats(d, IDX, ROW.inv);
    const per = new Map();
    for (const r of [...st.rows, ...st.side]) if (r.short && r.card) per.set(IDX.identity(r.card), { card: r.card, qty: (per.get(IDX.identity(r.card))?.qty || 0) + r.short });
    for (const { card, qty } of per.values()) bump(card, qty, d.name);
  }
  const coming = new Map();
  for (const [code, e] of Object.entries(ROW.inv || {})) if (e.o) { const id = IDX.identity(IDX.BY.get(code)); if (id) coming.set(id, (coming.get(id) || 0) + e.o); }
  for (const [id, e] of need) { e.qty -= coming.get(id) || 0; if (e.qty <= 0) need.delete(id); }
  return need;
}

      if (!Array.isArray(payload.collection) || !payload.collection.length) throw new Error(`${payload.user.nickname || user} has no public collection to compare against.`);
      PARTNER = readPartner(user, payload, MATCH, IDX, playset());
